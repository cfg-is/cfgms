# CFGMS log-injection sanitizer modeled as a data-flow barrier.
#
# logging.SanitizeLogValue replaces every Unicode control character (C0, C1,
# DEL) with an underscore and truncates the value to 1024 chars. The output
# is safe to embed in a log line — CR/LF cannot be smuggled to forge a new
# entry. Without an explicit barrier, CodeQL's default log-injection query
# (CWE-117) sees taint flow from request fields straight through to logger
# calls and fires false positives at every wrapped call site.
#
# Mechanism: `barrierModel` (extensible predicate added in CodeQL 2.25.2,
# 2026-04). It declaratively marks a function's return value as a taint
# barrier for the named sink-kind, which is what summaryModel(kind=value)
# was approximating less reliably (the older form only blocked some flow
# paths — e.g., flows from mux.Vars worked, flows from json.Decode field
# selections did not).
#
# Format (barrierModel):
#   [package, type, subtypes, name, signature, ext, output, kind, provenance]
#
# - kind="log-injection"      → CWE-117 "Log entries created from user input"
# - kind="clear-text-logging" → CWE-312 "Clear-text logging of sensitive
#                                information" (covered as a precaution; our
#                                handlers also drop sensitive paths from logs)

extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      - ["github.com/cfgis/cfgms/pkg/logging", "", false, "SanitizeLogValue", "", "", "ReturnValue", "log-injection", "manual"]
      - ["github.com/cfgis/cfgms/pkg/logging", "", false, "SanitizeLogValue", "", "", "ReturnValue", "clear-text-logging", "manual"]
      - ["github.com/cfgis/cfgms/pkg/logging", "", false, "RedactedID", "", "", "ReturnValue", "log-injection", "manual"]
      - ["github.com/cfgis/cfgms/pkg/logging", "", false, "RedactedID", "", "", "ReturnValue", "clear-text-logging", "manual"]

  # Belt-and-suspenders: summaryModel(kind=value) declares that SanitizeLogValue and
  # RedactedID produce clean output — taint from Argument[0] does NOT propagate to
  # ReturnValue. This complements the barrierModel entries above: flows that the
  # barrierModel does not suppress (e.g., json.Decode field-selection sources on some
  # CodeQL versions) are caught here. Both models must be present; neither alone is
  # reliable across all taint-flow paths (per testing in pack 0.0.5 / 0.0.6 history).
  # Alerts #669, #713, #714, #715, #722, #998, #999, #1000 — belt-and-suspenders for
  # SanitizeLogValue log-injection FPs (mux.Vars URL params + JSON-decoded struct
  # fields returned from interface calls, e.g. session.Manager.Issue → sess.ConnectionName).
  - addsTo:
      pack: codeql/go-all
      extensible: summaryModel
    data:
      - ["github.com/cfgis/cfgms/pkg/logging", "", false, "SanitizeLogValue", "", "", "Argument[0]", "ReturnValue", "value", "manual"]
      - ["github.com/cfgis/cfgms/pkg/logging", "", false, "RedactedID", "", "", "Argument[0]", "ReturnValue", "value", "manual"]
      # session.Manager.Issue() — the returned *Session carries ConnectionName, PrincipalID,
      # and TenantID fields that originate from the string arguments (Argument[1..3]).
      # CodeQL traces through the concrete manager.Issue() body and finds these args stored
      # in the returned struct, creating taint paths: req.ConnectionName (from JSON decode)
      # → Issue() Argument[2] → sess.ConnectionName → SanitizeLogValue() arg → logger sink.
      # summaryModel(kind=value) for Manager.Issue() (subtypes: true covers the manager
      # concrete type) overrides the source-code taint analysis, declaring that args 1–3
      # have only value-flow (not taint-flow) to ReturnValue[0]. Combined with the
      # SanitizeLogValue barrierModel above, this breaks the taint path at the method
      # boundary. Covers alert #998.
      - ["github.com/cfgis/cfgms/pkg/session", "Manager", true, "Issue", "", "", "Argument[1]", "ReturnValue[0]", "value", "manual"]
      - ["github.com/cfgis/cfgms/pkg/session", "Manager", true, "Issue", "", "", "Argument[2]", "ReturnValue[0]", "value", "manual"]
      - ["github.com/cfgis/cfgms/pkg/session", "Manager", true, "Issue", "", "", "Argument[3]", "ReturnValue[0]", "value", "manual"]
