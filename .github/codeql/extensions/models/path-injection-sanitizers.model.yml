# CFGMS path-injection sanitizer modeled as a summary.
#
# safeJoin returns values that have been validated against the configured
# base path (filepath.Clean + strict prefix check); if any traversal is
# detected it returns an error instead. CodeQL's default analysis traces
# taint from arguments through to the return value because it can't see the
# runtime check, so every os.Read/Write/Stat sink consuming a safeJoin
# result fires a path-injection false positive.
#
# CodeQL's Go pack does not expose an extensible `sanitizerModel`
# predicate. Instead we use `summaryModel` with `value` kind: this declares
# that the function's input-to-output relationship is *value flow*, not
# taint flow. The effect is that taint that reaches an argument is NOT
# propagated to the return value — i.e., the function acts as a sanitizer.
#
# Format (per CodeQL `summaryModel` extensible predicate):
#   [package, type, subtypes, name, signature, ext, input, output, kind, provenance]
#
# - package:    Go module path containing the function
# - type:       receiver type (empty for top-level functions)
# - subtypes:   include subtypes (boolean; irrelevant for top-level functions)
# - name:       function name
# - signature:  function signature (empty matches any)
# - ext:        access path qualifier (empty)
# - input:      where taint enters — "Argument[N]" or "Argument[N..M]"
# - output:     where flow lands — "ReturnValue" (or indexed if multi-return)
# - kind:       "value" (no taint propagation) or "taint" (propagate)
# - provenance: how the model was derived — "manual" (hand-authored)
#
# safeJoin signature: func safeJoin(base string, parts ...string) (string, error)
#   - Argument[0]   = base
#   - Argument[1]   = variadic parts slice (whole)
#   - ReturnValue[0] = sanitized path string (the value protected by runtime check)

extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: summaryModel
    data:
      - ["github.com/cfgis/cfgms/pkg/storage/providers/flatfile", "", false, "safeJoin", "", "", "Argument[0]", "ReturnValue[0]", "value", "manual"]
      - ["github.com/cfgis/cfgms/pkg/storage/providers/flatfile", "", false, "safeJoin", "", "", "Argument[1]", "ReturnValue[0]", "value", "manual"]
      # security.ValidateAndCleanPath validates userPath against basePath and returns
      # the cleaned canonical path. The return value (ReturnValue[0]) carries no taint
      # from either argument — the function either returns a safe path or an error.
      # Modeling both arguments as value-flow (not taint-flow) to ReturnValue[0] ensures
      # that CodeQL does not propagate path-injection taint through the return value.
      # Used in pkg/configrouting/providers/git/git_store.go to clear alerts #745/#746.
      - ["github.com/cfgis/cfgms/pkg/security", "", false, "ValidateAndCleanPath", "", "", "Argument[0]", "ReturnValue[0]", "value", "manual"]
      - ["github.com/cfgis/cfgms/pkg/security", "", false, "ValidateAndCleanPath", "", "", "Argument[1]", "ReturnValue[0]", "value", "manual"]

  # Durable upgrade: barrierModel (CodeQL >=2.25.2) marks safeJoin's cleaned
  # return value as a path-injection barrier directly, rather than relying on
  # summaryModel(kind=value) to suppress propagation (which the log-injection
  # model notes is unreliable on some flow paths — e.g. json.Decode field
  # selections). Kept ALONGSIDE the summaryModel entries above so this is purely
  # additive: if the barrierModel kind/format needs adjustment, protection does
  # not regress. Format mirrors log-injection-sanitizers.model.yml:
  #   [package, type, subtypes, name, signature, ext, output, kind, provenance]
  # NOTE: the exact barrierModel tuple/kind must be confirmed by the CodeQL CI
  # run (it cannot be fully verified locally); see the path-injection FP notes
  # in docs/development/security-workflow-guide.md.
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      - ["github.com/cfgis/cfgms/pkg/storage/providers/flatfile", "", false, "safeJoin", "", "", "ReturnValue[0]", "path-injection", "manual"]
      # ValidateAndCleanPath: belt-and-suspenders barrierModel alongside the summaryModel
      # above. Marks the validated return value as a path-injection barrier so that taint
      # cannot flow out through it even if the summaryModel is bypassed on some flow paths.
      - ["github.com/cfgis/cfgms/pkg/security", "", false, "ValidateAndCleanPath", "", "", "ReturnValue[0]", "path-injection", "manual"]
