name: Production Risk Gates

on:
  pull_request:
    branches: [ main, develop ]
    # CONSERVATIVE: Only skip for pure documentation changes
    # Production gates run if ANY code changes are present
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**/*.md'   # .claude markdown only — executable pipeline code under .claude/ (scripts, workflows) gets real CI (Issue #2586)
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  merge_group:
  push:
    branches:
      - main  # Run on main for production deployment validation and production-readiness-validation (load testing, benchmarks)
  workflow_dispatch:
    inputs:
      emergency_override:
        description: 'Emergency override for security gate (requires justification)'
        required: false
        default: false
        type: boolean
      override_reason:
        description: 'Reason for emergency override (required if override is true)'
        required: false
        type: string

# Never cancel an in-flight merge_group run — only PR pushes cancel their own
# workflow's prior run (#2595).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # PR-time stub for the `security-deployment-gate` required context (#2595).
  # The real scan runs in the merge queue (security-deployment-gate job below);
  # this posts the required check green on code PRs so branch protection is
  # satisfied without double-scanning every push. Docs-only PRs are covered by
  # documentation.yml's stub instead (this workflow is paths-ignored for docs).
  # Same check-name as the real job; the two are mutually exclusive by event.
  security-deployment-gate-pr-stub:
    name: security-deployment-gate
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: PR-time stub (real scan runs in the merge queue)
        run: |
          echo "security-deployment-gate: real vulnerability scan runs in the merge queue (merge_group) per #2595."
          echo "This PR-time stub posts the required context; the authoritative scan runs against the merge commit."

  # Security Gate - Critical Vulnerability Blocking (Story #99)
  # QUEUE-REAL (#2595): the real vulnerability scan runs in the merge queue
  # (merge_group) and on push to main — NOT on pull_request. The queue must scan
  # the actual merge commit (zero-trust posture), and this is the dedup half of
  # the #2595 split. The `security-deployment-gate` required context is posted on
  # PRs by the lightweight `security-deployment-gate-pr-stub` job below (code PRs)
  # and by documentation.yml (docs-only PRs).
  security-deployment-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      security-status: ${{ steps.security-gate.outputs.security-status }}
      deployment-allowed: ${{ steps.security-gate.outputs.deployment-allowed }}
      override-required: ${{ steps.security-gate.outputs.override-required }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.6'
        cache: true

    - name: Install Security Tools
      run: |
        echo "🔧 Installing Security Tools for Production Gate"
        echo "=============================================="
        
        # Install Trivy — v0.69.4-v0.69.6 are compromised (CVE-2026-33634);
        # v0.73.0 is the post-incident clean release. The install helper
        # verifies the archive SHA-256 against the pinned value before
        # extraction. See docs/runbooks/trivy-rollback.md for rollback.
        sudo .github/scripts/install-trivy.sh 'v0.73.0' '2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b'

        echo "✅ Security tools installed"
    
    - name: Run Security Gate Analysis
      id: security-gate
      env:
        EMERGENCY_OVERRIDE: ${{ github.event.inputs.emergency_override }}
        OVERRIDE_REASON: ${{ github.event.inputs.override_reason }}
      run: |
        echo "🚪 PRODUCTION SECURITY DEPLOYMENT GATE"
        echo "======================================"
        echo ""

        # Initialize variables
        critical_vulns=0
        high_vulns=0
        security_issues_found=false
        deployment_blocked=false
        override_required=false

        # Check for critical vulnerabilities with Trivy
        echo "🔍 Scanning for Critical/High Vulnerabilities..."
        trivy fs . --severity CRITICAL,HIGH --exit-code 1 --format table > /tmp/trivy-critical.txt 2>&1
        trivy_exit_code=$?

        if [ $trivy_exit_code -ne 0 ]; then
          echo "❌ CRITICAL/HIGH vulnerabilities detected in dependencies"
          critical_vulns=$(trivy fs . --severity CRITICAL --format json --quiet | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' 2>/dev/null || echo "0")
          high_vulns=$(trivy fs . --severity HIGH --format json --quiet | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' 2>/dev/null || echo "0")
          security_issues_found=true
          deployment_blocked=true

          echo "  Critical vulnerabilities: $critical_vulns"
          echo "  High vulnerabilities: $high_vulns"
          echo ""
          cat /tmp/trivy-critical.txt
        else
          echo "✅ No critical/high vulnerabilities detected"
        fi

        # Advisory scans (nancy, gosec, staticcheck) are non-required contexts
        # that run in security-scan.yml. They are not executed here so this
        # gate remains focused on the single blocking Trivy vulnerability scan.

        # Check for emergency override
        if [ "$EMERGENCY_OVERRIDE" = "true" ] || [ -f "EMERGENCY_DEPLOYMENT" ]; then
          echo ""
          echo "🚨 EMERGENCY OVERRIDE DETECTED"
          echo "============================="
          if [ "$deployment_blocked" = "true" ]; then
            echo "⚠️  Security issues present but emergency override authorized"
            echo "   Override reason: ${OVERRIDE_REASON:-Manual emergency file present}"
            deployment_blocked=false
            override_required=true
          fi
        fi
        
        # Set outputs
        echo "security-status=$( [ "$security_issues_found" = "true" ] && echo "issues-found" || echo "clean" )" >> $GITHUB_OUTPUT
        echo "deployment-allowed=$( [ "$deployment_blocked" = "false" ] && echo "true" || echo "false" )" >> $GITHUB_OUTPUT
        echo "override-required=$override_required" >> $GITHUB_OUTPUT
        
        # Final decision
        echo ""
        echo "🎯 SECURITY GATE DECISION"
        echo "========================"
        if [ "$deployment_blocked" = "true" ]; then
          echo "❌ DEPLOYMENT BLOCKED"
          echo "   Critical security vulnerabilities must be resolved"
          echo ""
          echo "🤖 Automated Remediation Available:"
          echo "   1. Download security scan artifacts from previous workflow run"
          echo "   2. Use Claude Code with the remediation JSON to fix issues"
          echo "   3. Re-run deployment after fixes are merged"
          echo ""
          echo "🚨 Emergency Override Available:"
          echo "   Use workflow_dispatch with emergency_override: true"
          echo "   Requires proper justification and approval"
          exit 1
        else
          if [ "$override_required" = "true" ]; then
            echo "⚠️  DEPLOYMENT ALLOWED (EMERGENCY OVERRIDE)"
            echo "   Security issues present but override authorized"
          else
            echo "✅ DEPLOYMENT ALLOWED"
            echo "   All security checks passed"
          fi
        fi
    
    - name: Generate Security Audit Trail
      if: always()
      env:
        SECURITY_STATUS: ${{ steps.security-gate.outputs.security-status }}
        DEPLOYMENT_ALLOWED: ${{ steps.security-gate.outputs.deployment-allowed }}
        OVERRIDE_REQUIRED: ${{ steps.security-gate.outputs.override-required }}
        OVERRIDE_REASON: ${{ github.event.inputs.override_reason }}
      run: |
        echo "📝 SECURITY AUDIT TRAIL"
        echo "======================"
        echo ""
        echo "Deployment Details:"
        echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "- Branch: $GITHUB_REF"
        echo "- Commit: $GITHUB_SHA"
        echo "- Actor: $GITHUB_ACTOR"
        echo "- Event: $GITHUB_EVENT_NAME"
        echo ""
        echo "Security Gate Results:"
        echo "- Security Status: $SECURITY_STATUS"
        echo "- Deployment Allowed: $DEPLOYMENT_ALLOWED"
        echo "- Override Used: $OVERRIDE_REQUIRED"
        echo ""
        if [ "$OVERRIDE_REQUIRED" = "true" ]; then
          echo "Override Details:"
          echo "- Reason: ${OVERRIDE_REASON:-Emergency file override}"
          echo "- Authorized by: $GITHUB_ACTOR"
          echo "- Approval required: YES (manual review needed)"
        fi

        # Save audit trail
        mkdir -p audit-logs
        cat > audit-logs/deployment-security-audit.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "deployment": {
            "branch": "$GITHUB_REF",
            "commit": "$GITHUB_SHA",
            "actor": "$GITHUB_ACTOR",
            "event": "$GITHUB_EVENT_NAME"
          },
          "security_gate": {
            "status": "$SECURITY_STATUS",
            "deployment_allowed": $DEPLOYMENT_ALLOWED,
            "override_used": $OVERRIDE_REQUIRED,
            "override_reason": "${OVERRIDE_REASON:-N/A}"
          }
        }
        EOF
    
    - name: Upload Security Audit Trail
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: security-deployment-audit
        path: audit-logs/
        retention-days: 90


