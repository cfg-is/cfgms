# OWASP ZAP DAST Baseline Scan — controller REST API + embedded SPA (Issue #2950)
#
# Covers gap 3 from #2930: unauthenticated baseline scan (spider + passive
# rules) against the controller's single HTTPS listener, which serves both
# the REST API and the embedded SPA (features/controller/api/spa.go).
#
# Scan posture: production auth — CFGMS_ENABLE_TEST_ENDPOINTS and
# CFGMS_SEED_TEST_TOKENS are intentionally NOT set.
#
# Controller bootstrap: flatfile storage (DefaultConfig().Storage.Provider
# = "flatfile"); no external database needed. Certs auto-generated by
# pkg/cert.Manager on first boot. CFGMS_HTTP_LISTEN_ADDR=0.0.0.0:8080
# overrides the loopback-only default (127.0.0.1:8080, Story #1919) so
# ZAP can reach the container via localhost.
#
# Advisory only: not a required merge-queue check on first landing.
# Intended for manual workflow_dispatch runs and a weekly discovery sweep.

name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 03:00 UTC

env:
  IMAGE_PREFIX: cfg-is/cfgms

permissions: {}

jobs:
  dast-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build controller image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./cmd/controller/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_PREFIX }}/controller:dast
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create writable data directories and ephemeral secrets key
      run: |
        # /etc/cfgms is where --init writes the admin credential bundle
        # (features/controller/initialization/bundle_marker.go
        # defaultAdminBundlePath, used whenever no config file sets
        # admin_bundle_path — the case here, since this workflow runs with
        # no --config flag). pkg/cert/bundle.Write does `os.MkdirAll(dir,
        # 0700)` then writes the bundle file inside it; both need the
        # directory to exist and be writable by container UID 1001
        # (cmd/controller/Dockerfile's non-root `USER 1001:1001`), which a
        # bare /etc/cfgms is not. This is 5 straight red DAST runs' actual
        # cause (Issue #4169): "mkdir /etc/cfgms: permission denied",
        # surfacing only after the external_url fix cleared the earlier
        # failure in the same --init call.
        mkdir -p /tmp/cfgms-dast/data /tmp/cfgms-dast/certs /tmp/cfgms-dast/etc-cfgms
        chmod 777 /tmp/cfgms-dast/data /tmp/cfgms-dast/certs /tmp/cfgms-dast/etc-cfgms
        # NewSecretStore (features/controller/api/server.go) fails closed
        # without CFGMS_SECRETS_KEY_FILE — plaintext secret storage is
        # prohibited. scripts/generate-test-credentials.sh uses the same
        # `openssl rand 32` recipe for the fleet-controller integration
        # stack, at 0600. The SOPS provider (pkg/secrets/providers/sops)
        # additionally rejects a key file with any group/other bit set, so
        # unlike the 777 data/certs dirs above — which the non-root
        # container UID 1001 needs to *write* — this file must instead be
        # *owned* by 1001 (cmd/controller/Dockerfile's `adduser -D -u 1001`)
        # so owner-only 0600 still grants it read access.
        openssl rand 32 > /tmp/cfgms-dast/secrets.key
        chmod 600 /tmp/cfgms-dast/secrets.key
        sudo chown 1001:1001 /tmp/cfgms-dast/secrets.key

    - name: Start controller (flatfile storage, production auth posture)
      run: |
        # --network host: ZAP Docker also runs with --network=host (zaproxy
        # action-baseline@v0.15.0 source), so localhost:8080 reaches this
        # container from within ZAP's container.
        #
        # CFGMS_ENABLE_TEST_ENDPOINTS and CFGMS_SEED_TEST_TOKENS are NOT set.
        # Storage defaults to flatfile (no CFGMS_STORAGE_PROVIDER override).
        #
        # No --config flag and nothing mounted at /etc/cfgms/controller.cfg:
        # cmd/controller/Dockerfile's default CMD is `--config
        # /etc/cfgms/controller.cfg`, an explicit path that config.findConfigFile
        # hard-fails on when it doesn't exist ("config file not found at
        # specified path") rather than falling back to defaults — that failure
        # was the actual cause of 5 straight red runs (Issue #4169), not a ZAP
        # finding. --entrypoint sh replaces the Dockerfile CMD with a bare
        # invocation so configPath is "", which makes findConfigFile fall
        # through env var / prod path / dev path (none present) to "no config
        # file found — OK, will use defaults", i.e. DefaultConfig()'s flatfile
        # storage — the posture this step's own comment above already intended.
        #
        # `controller --init` must run first regardless: server.New() refuses
        # to start with ErrNotInitialized ("run 'controller --init ...' to
        # perform first-run initialization") until the CA and RBAC defaults
        # exist on disk — this is the same init-then-exec sequence
        # docker-compose.test.yml's fleet-controller service uses.
        #
        # CFGMS_EXTERNAL_URL is required by --init itself: initialization.Run
        # refuses to issue the admin bundle without an external_url configured
        # (the externally-reachable HTTPS address operators use to connect).
        #
        # CFGMS_EXTERNAL_HOSTNAME is a separate guard in server.New()
        # (features/controller/server/server.go): DefaultConfig() sets
        # Transport.ListenAddr to "0.0.0.0:4433" regardless of
        # CFGMS_HTTP_LISTEN_ADDR, and New() refuses to start a 0.0.0.0-bound
        # transport listener without transport.external_address or this env
        # var set. This — not the admin-bundle chain above — was the actual
        # cause of every workflow_dispatch run failing after that chain was
        # fixed (Issue #4169): "transport.listen_addr binds 0.0.0.0 but no
        # external address is configured".
        #
        # /etc/cfgms is mounted from the writable dir created above: with no
        # --config flag, --init writes the admin bundle to the platform
        # default (/etc/cfgms/admin.bundle.yaml), which the container's
        # non-root UID 1001 cannot create on a bare /etc/cfgms — see the
        # comment on the step above for the full chain.
        #
        # CFGMS_METRICS_LISTEN_ADDR: DefaultConfig() leaves MetricsListenAddr
        # empty on purpose (features/controller/config/config.go: "Required
        # explicitly; startup fails closed when absent") and Server.Start
        # (features/controller/api/server.go) refuses to bind with
        # "invalid private metrics listener: address is required" until it's
        # set. ValidatePrivateListenerAddress additionally requires a fixed
        # loopback/private numeric address, so this is a container-local
        # 127.0.0.1 port rather than 0.0.0.0, matching the "private" intent.
        docker run -d \
          --name cfgms-controller-dast \
          --network host \
          --entrypoint /bin/sh \
          -e CFGMS_HTTP_LISTEN_ADDR=0.0.0.0:8080 \
          -e CFGMS_EXTERNAL_URL=https://localhost:8080 \
          -e CFGMS_EXTERNAL_HOSTNAME=localhost \
          -e CFGMS_METRICS_LISTEN_ADDR=127.0.0.1:9090 \
          -e CFGMS_SECRETS_KEY_FILE=/app/secrets.key \
          -v /tmp/cfgms-dast/data:/app/data \
          -v /tmp/cfgms-dast/certs:/app/certs \
          -v /tmp/cfgms-dast/secrets.key:/app/secrets.key:ro \
          -v /tmp/cfgms-dast/etc-cfgms:/etc/cfgms \
          ${{ env.IMAGE_PREFIX }}/controller:dast \
          -c './controller --init && exec ./controller'

    - name: Wait for controller to be healthy
      run: |
        echo "Waiting for controller at https://localhost:8080/api/v1/health ..."
        for i in $(seq 1 30); do
          status=$(curl -k -s -o /dev/null -w "%{http_code}" \
            https://localhost:8080/api/v1/health 2>/dev/null || echo "000")
          if [ "$status" = "200" ]; then
            echo "Controller healthy after ${i} attempt(s)"
            exit 0
          fi
          echo "Attempt ${i}/30: HTTP ${status} — retrying in 2 s..."
          sleep 2
        done
        echo "Controller did not become healthy within 60 s — container logs:"
        docker logs cfgms-controller-dast
        exit 1

    - name: Run ZAP baseline scan
      # Advisory: continue-on-error prevents ZAP findings from blocking the
      # workflow. fail_action:false + -I mean exit codes 1/2 (alerts found)
      # are treated as informational; only exit code 3 (unreachable target)
      # propagates, but continue-on-error absorbs that too.
      # allow_issue_writing:false prevents automated GitHub issue creation.
      # ZAP Docker uses --network=host (see action source), so it reaches
      # the controller at localhost:8080.
      # Self-signed cert: ZAP's baseline scan connects directly to the target
      # and does not validate the server cert chain by design (DAST tool).
      continue-on-error: true
      uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
      with:
        target: 'https://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        fail_action: false
        allow_issue_writing: false
        artifact_name: 'zap-dast-report'
        cmd_options: '-I'

    - name: Dump controller logs on scan failure
      if: failure()
      run: docker logs cfgms-controller-dast || true

    - name: Stop controller
      if: always()
      run: docker rm -f cfgms-controller-dast || true

    - name: Workflow summary
      if: always()
      run: |
        echo "## OWASP ZAP DAST Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Target | \`https://localhost:8080\` (REST API + embedded SPA) |" >> $GITHUB_STEP_SUMMARY
        echo "| Storage | flatfile (no external DB) |" >> $GITHUB_STEP_SUMMARY
        echo "| Auth posture | production (no test-endpoint env vars) |" >> $GITHUB_STEP_SUMMARY
        echo "| Blocking | advisory — not a required merge-queue check |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the full ZAP HTML/JSON/Markdown report from workflow artifacts." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "SARIF upload is not supported by \`zaproxy/action-baseline\` natively; review the JSON artifact for findings detail." >> $GITHUB_STEP_SUMMARY
