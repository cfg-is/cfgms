name: Fleet E2E Tests

on:
  # merge_group only — the develop merge queue is the authoritative gate. Fleet
  # E2E was moved off pull_request per the #2550 long-pole audit: its PR failures
  # were predominantly flaky/infra or redundant (build errors any cheaper gate
  # catches), so it earned no unique early PR value. Still enforced at merge.
  merge_group:

env:
  GO_VERSION: '1.27.1'

permissions: {}

jobs:
  fleet-e2e-tests:
    name: fleet-e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GITHUB_TOKEN in .git/config — this job only builds
          # and runs tests, so persisted git credentials are an unnecessary
          # exposure (flagged by zizmor: credential persistence via artifacts).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Restore-only (Issue #4234): this step used to be a combined
      # actions/cache restore+save. A merge_group run's save is scoped to the
      # transient `gh-readonly-queue/...` ref — unreadable by any PR or later
      # queue run, and it evicted the develop-scoped Linux-go-modules entry at
      # the 10 GB cache ceiling. The develop-scoped writer (develop-sanity.yml)
      # is the only save path — every other workflow only ever restores.
      - name: Restore Go module/build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-modules-
        continue-on-error: true

      - name: Install dependencies
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run fleet E2E tests
        env:
          COMPOSE_BAKE: "1"
        run: make test-e2e-fleet
