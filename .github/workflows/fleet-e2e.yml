name: Fleet E2E Tests

on:
  # merge_group only — the develop merge queue is the authoritative gate. Fleet
  # E2E was moved off pull_request per the #2550 long-pole audit: its PR failures
  # were predominantly flaky/infra or redundant (build errors any cheaper gate
  # catches), so it earned no unique early PR value. Still enforced at merge.
  merge_group:

env:
  GO_VERSION: '1.26.5'

permissions: {}

jobs:
  fleet-e2e-tests:
    name: fleet-e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Do not leave the GITHUB_TOKEN in .git/config — this job only builds
          # and runs tests, so persisted git credentials are an unnecessary
          # exposure (flagged by zizmor: credential persistence via artifacts).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-modules-
        continue-on-error: true

      - name: Install dependencies
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Run fleet E2E tests
        env:
          COMPOSE_BAKE: "1"
        run: make test-e2e-fleet
