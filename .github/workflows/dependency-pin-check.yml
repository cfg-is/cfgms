# Dependency Pin Freshness Check
# Checks pinned Go security tools and binary downloads against their latest
# releases. Opens a GitHub issue if any are outdated.
#
# Dependabot handles GitHub Actions SHA pins automatically (see dependabot.yml).
# This workflow covers tools installed via `go install` and binary download
# that Dependabot cannot track.
#
# Runs weekly on Wednesday (offset from Dependabot's Monday schedule).

name: Dependency Pin Check

on:
  schedule:
    - cron: '0 9 * * 3'  # Wednesday 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/**'
      - '.github/scripts/install-trivy.sh'
      - 'Makefile'

# Deny by default at the workflow level; each job re-grants only what it needs.
# Without this, jobs inherit the repository default token scope (Scorecard
# TokenPermissions).
permissions: {}

jobs:
  # Hard-fail any PR (or schedule run) that reintroduces a compromised Trivy
  # version (v0.69.4 / v0.69.5 / v0.69.6) into the build. CVE-2026-33634.
  # Runs first so a bad pin can't sneak in even if a newer freshness check
  # later relabels something.
  denylist-check:
    name: Compromised Version Denylist
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Scan for known-compromised trivy versions
      run: |
        # Match v0.69.4 / v0.69.5 / v0.69.6 (plus pre-release suffixes like
        # -rc1) ONLY when they appear in a pin-usage context: quoted string
        # value, env-var assignment (`=`), or Go module ref (`@`). This
        # avoids false positives on documentation prose that mentions the
        # compromised versions to warn against them.
        if grep -rEn $'(\'|"|=|@)v0\\.69\\.[456]([.-][[:alnum:]_.-]*)?' \
              --include='Dockerfile' --include='*.yml' --include='*.yaml' \
              --include='Makefile' --include='*.sh' \
              .devcontainer/ .github/ Makefile 2>/dev/null; then
          echo "" >&2
          echo "ERROR: a known-compromised Trivy version (v0.69.4 - v0.69.6) was found in a pin-usage context." >&2
          echo "These releases are part of the CVE-2026-33634 supply-chain compromise." >&2
          echo "Use v0.74.0 (post-incident clean release) or v0.69.3 (pre-incident)." >&2
          echo "See docs/runbooks/trivy-rollback.md for context." >&2
          exit 1
        fi
        echo "No compromised trivy versions detected in any pin-usage context."

  # Weekly dependency-graph CVE scan.
  #
  # This is the only scan that catches a CVE published against a dependency
  # nobody has touched. PR-time and merge-queue scanning are both triggered by
  # code movement, so an advisory landing against an already-merged go.sum entry
  # is invisible to them until something unrelated happens to change that file.
  # CVE-2026-41178 (otel baggage DoS) was exactly that shape.
  #
  # Findings are reported into the same `dependency-pins` issue the pin
  # freshness check uses, so refresh-pins consumes both from one place.
  dependency-cve-scan:
    name: Weekly Dependency CVE Scan
    runs-on: ubuntu-latest
    # Same rationale as check-tool-versions: never open issues from a PR run.
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Install Nancy
      run: make install-nancy

    - name: Scan dependency graph for known vulnerabilities
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GUIDE_TOKEN: ${{ secrets.GUIDE_TOKEN }}
      run: |
        set -uo pipefail

        # Fail closed on a missing credential. Nancy v2 returns 401 without a
        # Sonatype Guide token, and a scan that cannot run must never be
        # mistaken for a scan that found nothing.
        if [ -z "${GUIDE_TOKEN:-}" ]; then
          echo "::error::GUIDE_TOKEN is not configured — the weekly dependency CVE scan could not run."
          exit 1
        fi

        scan_log=$(mktemp)
        if make security-deps >"$scan_log" 2>&1; then
          cat "$scan_log"
          echo ""
          echo "No known vulnerabilities in the current dependency graph."
          exit 0
        fi

        cat "$scan_log"

        # Nancy's table output is wide; fence it so the issue stays readable.
        findings=$(sed -e 's/\x1b\[[0-9;]*m//g' "$scan_log" | tail -n 120)
        body=$(printf '## Dependency CVEs\n\nThe weekly scan found known vulnerabilities in the current dependency graph. These are Go module dependencies from `go.mod`, not pinned tool versions — a CVE here is published against code already merged, so it is not attached to any pull request.\n\n```\n%s\n```\n\n### How to handle\n\nRun `/refresh-pins --urgent <module>` — a CVE against a merged dependency skips the cooldown gate. Bump the module to the first patched version, then re-run `make security-deps` locally with `GUIDE_TOKEN` exported to confirm.\n\n---\n*Auto-generated by the dependency-cve-scan job*' "$findings")

        existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "dependency-pins" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
        if [ -n "$existing" ]; then
          echo "Open issue #${existing} already exists — adding comment instead."
          printf '## Weekly Dependency CVE Scan — %s\n\n%s' "$(date +%Y-%m-%d)" "$body" \
            | gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file -
        else
          printf '%s' "$body" \
            | gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "deps: dependency CVEs ($(date +%Y-%m-%d))" \
                --label "dependency-pins,dependencies,security,automated" \
                --body-file -
        fi

        # The finding is recorded for triage; the job stays red so the scan
        # result is visible on the Actions tab rather than only in an issue.
        exit 1

  check-tool-versions:
    name: Check Pinned Tool Versions
    runs-on: ubuntu-latest
    # Only run the freshness check on schedule/manual triggers — on PR we don't
    # want to open new GitHub issues; the denylist-check above is the gate.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check for outdated pinned tools
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        outdated=""
        warnings=""

        check_version() {
          local name="$1" repo="$2" pinned="$3"
          local owner="${repo%/*}" repo_name="${repo#*/}"
          local latest

          # GraphQL first (preferred — official API, lightweight). On failure,
          # stderr is preserved in the workflow log for diagnostics, then we
          # fall through. `|| latest=""` prevents `set -e` from killing the job
          # when one tool fails (so the other seven still get checked).
          latest=$(gh api graphql \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){latestRelease{tagName}}}' \
            -f owner="$owner" -f name="$repo_name" \
            --jq '.data.repository.latestRelease.tagName') || latest=""

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            # Fallback: HTTP HEAD against the public release-redirect URL.
            # Bypasses org IP allowlists (e.g. aquasecurity blocks GitHub
            # Actions runner IPs from authenticated API access) since this is
            # an unauthenticated public web request, not an api.github.com call.
            echo "  INFO: ${repo} GraphQL returned empty/null or failed — trying redirect parse"
            latest=$(curl -sI "https://github.com/${repo}/releases/latest" \
                     | sed -n 's|^location: .*/tag/||Ip' | tr -d '\r\n')
          fi

          if [ -z "$latest" ]; then
            echo "  WARN: Both GraphQL and redirect-parse failed for ${repo}"
            warnings="${warnings}- **${name}**: could not fetch latest version from \`${repo}\` (GraphQL + redirect parse both failed)\n"
            return
          fi

          if [ "$pinned" != "$latest" ]; then
            echo "  OUTDATED: ${name} pinned=${pinned} latest=${latest}"
            outdated="${outdated}- **${name}**: pinned \`${pinned}\`, latest \`${latest}\` ([releases](https://github.com/${repo}/releases))\n"
          else
            echo "  OK: ${name} ${pinned}"
          fi
        }

        echo "Checking pinned tool versions..."
        check_version "gosec"       "securego/gosec"                          "v2.28.0"
        check_version "staticcheck" "dominikh/go-tools"                       "2026.1"
        check_version "gitleaks"    "zricethezav/gitleaks"                    "v8.30.1"
        check_version "nancy"       "sonatype-nexus-community/nancy"          "v2.1.0"
        check_version "trufflehog"  "trufflesecurity/trufflehog"              "v3.97.0"
        check_version "trivy"       "aquasecurity/trivy"                      "v0.74.0"
        check_version "go-licenses" "google/go-licenses"                      "v2.0.1"
        check_version "golangci-lint" "golangci/golangci-lint"                "v2.12.2"

        # Claude Code CLI freshness check. Installed from npm rather than a
        # GitHub release asset, so check_version's release API doesn't apply —
        # the authoritative "what would an unpinned install get" answer is
        # npm's dist-tags.latest. The pin lives in .devcontainer/Dockerfile as
        # ARG CLAUDE_CODE_VERSION and is read from there so this check can
        # never disagree with what the image actually installs.
        echo "Checking Claude Code CLI version..."
        cc_pinned=$(grep -oE '^ARG CLAUDE_CODE_VERSION=.+' .devcontainer/Dockerfile \
                    | sed 's/^ARG CLAUDE_CODE_VERSION=//')
        cc_latest=$(curl -fsSL "https://registry.npmjs.org/@anthropic-ai/claude-code" 2>/dev/null \
                    | jq -r '.["dist-tags"].latest' 2>/dev/null)
        if [ -z "$cc_pinned" ]; then
          echo "  WARN: could not read ARG CLAUDE_CODE_VERSION from .devcontainer/Dockerfile"
          warnings="${warnings}- **Claude Code CLI**: could not read \`ARG CLAUDE_CODE_VERSION\` from \`.devcontainer/Dockerfile\` — did the pin get renamed or removed?\n"
        elif [ -z "$cc_latest" ] || [ "$cc_latest" = "null" ]; then
          echo "  WARN: Could not fetch latest claude-code version from npm"
          warnings="${warnings}- **Claude Code CLI**: could not fetch \`dist-tags.latest\` from registry.npmjs.org\n"
        elif [ "$cc_pinned" != "$cc_latest" ]; then
          echo "  OUTDATED: Claude Code CLI pinned=${cc_pinned} latest=${cc_latest}"
          outdated="${outdated}- **Claude Code CLI**: pinned \`${cc_pinned}\`, latest \`${cc_latest}\` ([changelog](https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md)). Bump \`ARG CLAUDE_CODE_VERSION\` in \`.devcontainer/Dockerfile\`, then rebuild the agent image.\n"
        else
          echo "  OK: Claude Code CLI ${cc_pinned}"
        fi

        # Go toolchain freshness check. Go's release index doesn't fit the
        # GitHub Releases pattern of check_version above, so it gets its own
        # handler. The toolchain version is pinned in go.mod and in workflow
        # GO_VERSION env vars; the freshness check uses go.mod as the source
        # of truth, and lockstep-check below catches drift across files.
        echo "Checking Go toolchain version..."
        go_pinned=$(grep -E "^toolchain go" go.mod | sed 's/^toolchain go//')
        go_latest=$(curl -fsSL "https://go.dev/dl/?mode=json" 2>/dev/null \
                    | jq -r '[.[] | select(.stable)][0].version' 2>/dev/null \
                    | sed 's/^go//')
        if [ -z "$go_latest" ] || [ "$go_latest" = "null" ]; then
          echo "  WARN: Could not fetch latest Go version from go.dev/dl"
          warnings="${warnings}- **Go toolchain**: could not fetch latest from go.dev/dl?mode=json\n"
        elif [ "$go_pinned" != "$go_latest" ]; then
          echo "  OUTDATED: Go toolchain pinned=${go_pinned} latest=${go_latest}"
          outdated="${outdated}- **Go toolchain**: pinned \`${go_pinned}\`, latest \`${go_latest}\` ([release notes](https://go.dev/doc/devel/release))\n"
        else
          echo "  OK: Go toolchain ${go_pinned}"
        fi

        # Lockstep validator. The Go toolchain version is pinned in MULTIPLE
        # places (go.mod, workflow GO_VERSION/go-version, cmd/*/Dockerfile FROM
        # golang:X-alpine, .devcontainer/Dockerfile). All must move together.
        # This check caught the 2026-05-12 drift where go.mod was bumped ahead
        # of the Dockerfile FROM lines, causing Trivy to keep reporting stdlib
        # CVEs on PRs against develop.
        echo "Checking Go toolchain lockstep across all pin locations..."
        lockstep_versions=$(
          {
            grep -hoE "^toolchain go[0-9.]+" go.mod | sed 's/^toolchain go//'
            grep -hoE "(GO_VERSION|go-version):[[:space:]]*['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?" .github/workflows/*.yml \
              | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"
            grep -hoE "^FROM golang:[0-9]+\.[0-9]+\.[0-9]+" cmd/*/Dockerfile .devcontainer/Dockerfile 2>/dev/null \
              | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"
          } | sort -u
        )
        lockstep_count=$(printf '%s\n' "$lockstep_versions" | grep -c .)
        if [ "$lockstep_count" -gt 1 ]; then
          echo "  ERROR: Go toolchain pin drift — multiple versions in use:"
          printf '%s\n' "$lockstep_versions" | sed 's/^/    /'
          outdated="${outdated}- **Go toolchain (lockstep drift)**: multiple versions present in repo — \`$(printf '%s, ' $lockstep_versions | sed 's/, $//')\`. Bump all locations to the same version (run \`./.claude/skills/refresh-pins/scripts/discover-pins.py\` to see every file:line).\n"
        else
          echo "  OK: Go toolchain lockstep version=${lockstep_versions}"
        fi

        # Base-image digest drift. Every Dockerfile FROM is pinned by digest
        # (Scorecard PinnedDependenciesID), which makes builds reproducible but
        # also means a patched re-push of the same tag is NOT picked up. Nothing
        # else in the repo notices that, so compare each pinned digest against
        # the tag's current digest and surface drift in this weekly issue.
        echo "Checking Docker base-image digest drift..."
        while IFS= read -r from_line; do
          [ -n "$from_line" ] || continue
          ref=${from_line#FROM }
          ref=${ref%% *}
          image=${ref%@*}
          pinned_digest=${ref#*@}
          repo=${image%:*}
          tag=${image##*:}
          # Official Docker Hub images only (no slash). Anything else is not
          # resolvable with this token flow — report it rather than skip silently.
          case "$repo" in
            */*)
              echo "  SKIP: $image (not a Docker Hub official image)"
              warnings="${warnings}- **Base image \`${image}\`**: digest drift not checked — only Docker Hub official images are resolvable by this job.\n"
              continue
              ;;
          esac
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/${repo}:pull" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])' 2>/dev/null || echo "")
          if [ -z "$token" ]; then
            echo "  WARN: could not obtain registry token for ${image}"
            warnings="${warnings}- **Base image \`${image}\`**: could not obtain a Docker Hub registry token to check digest drift.\n"
            continue
          fi
          current_digest=$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/library/${repo}/manifests/${tag}" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}' || echo "")
          if [ -z "$current_digest" ]; then
            echo "  WARN: could not resolve current digest for ${image}"
            warnings="${warnings}- **Base image \`${image}\`**: could not resolve the tag's current digest.\n"
          elif [ "$current_digest" != "$pinned_digest" ]; then
            echo "  DRIFT: ${image} pinned=${pinned_digest} current=${current_digest}"
            outdated="${outdated}- **Base image \`${image}\`**: pinned \`${pinned_digest}\`, tag now resolves to \`${current_digest}\`. The tag was re-pushed (usually a patched base). Update the \`FROM\` digest.\n"
          else
            echo "  OK: ${image} digest current"
          fi
        done < <(grep -hoE '^FROM [^[:space:]]+@sha256:[0-9a-f]{64}' \
          .devcontainer/Dockerfile cmd/*/Dockerfile cmd/*/Dockerfile.* Dockerfile.test-runner 2>/dev/null | sort -u)

        if [ -z "$outdated" ] && [ -z "$warnings" ]; then
          echo ""
          echo "All pinned tools are up to date."
          exit 0
        fi

        # Build issue body sections
        body=""
        title_parts=""
        if [ -n "$outdated" ]; then
          body="${body}## Outdated Pinned Tool Versions\n\nThe following tools pinned in CI have newer releases available:\n\n${outdated}\n"
          title_parts="outdated pins"
        fi
        if [ -n "$warnings" ]; then
          body="${body}## Version Check Warnings\n\nThe following tools could not be checked — investigate why the API calls are failing:\n\n${warnings}\n"
          if [ -n "$title_parts" ]; then
            title_parts="${title_parts} + check failures"
          else
            title_parts="version check failures"
          fi
        fi
        if [ -n "$outdated" ]; then
          body="${body}### How to update\n\n1. Update the version in \`.devcontainer/Dockerfile\`, \`.github/workflows/*.yml\`, and \`Makefile\`\n2. For APT packages (trivy): update the \`=X.Y.Z\` version constraint\n3. For \`go install\`: update the \`@vX.Y.Z\` suffix\n4. For binary downloads (nancy, trufflehog): update the URL version\n5. For checksum-verified downloads (trivy, golangci-lint): update the per-architecture \`SHA256\` values alongside the version, taking them from the release's checksums asset — a stale checksum fails the build at image-build time\n6. Run the full CI suite to validate before merging\n\n"
        fi
        body="${body}### Why we pin\n\nAll tool versions are pinned to prevent supply chain attacks (see CVE-2026-33634). Never use \`@latest\`.\n\n---\n*Auto-generated by dependency-pin-check workflow*"

        echo ""
        echo "Issues found. Checking for existing issue..."

        # Check if an open issue already exists (avoid duplicates)
        existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "dependency-pins" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
        if [ -n "$existing" ]; then
          echo "Open issue #${existing} already exists — adding comment instead."
          printf "## Weekly Pin Check — $(date +%Y-%m-%d)\n\n${body}" \
            | gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file -
          exit 0
        fi

        echo "Creating issue..."
        printf "${body}" \
          | gh issue create --repo "$GITHUB_REPOSITORY" --title "deps: ${title_parts} ($(date +%Y-%m-%d))" --label "dependency-pins,dependencies,security,automated" --body-file -
