name: Cross-Platform Build Validation

# QUEUE-ONLY. This workflow has no `pull_request` trigger, so it posts nothing on
# the pull-request side — not even a skipped run. The PR-side `Cross-Platform
# Compilation Check` and `Build Gate` contexts come from
# cross-platform-build-pr.yml.
#
# The split is structural on purpose. A job gated `if: pull_request` still posts a
# check run with conclusion `skipped` in the merge queue, and GitHub accepts a
# `skipped` run as satisfying a required status check. With `build-gate` being
# `needs: [native-builds, postgres-integration]`, its check run does not exist while
# the native builds run — so the queue saw only a skipped `Build Gate` and merged
# before this gate ever reported. See cross-platform-build-pr.yml for the measured
# evidence.
#
# DO NOT add a `pull_request` trigger to this file.
on:
  merge_group:
  workflow_dispatch:

# Never cancel an in-flight merge_group run (#2595).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'

permissions: {}

jobs:
  # One Linux build and unit pass on the MERGE COMMIT, in one job.
  #
  # The PR side already runs every unit package natively on Linux, Windows and
  # macOS (test-suite.yml's unit-tests-* legs, cross-platform-build-pr.yml's
  # Windows/macOS legs, Issue #4219). What a PR cannot see is its combination
  # with whatever merged ahead of it, so the queue builds every binary against
  # the merge commit and re-runs the api and controller-core groups there, beside
  # Controller Integration Tests (Linux), the queue's floor. The heavy-providers
  # and rest groups are not repeated here: they run on every pull request
  # (test-suite.yml's unit-tests-heavy-providers and unit-tests-rest legs), and
  # a 14-day review of queue failures that needed an agent fix found none caught
  # by the second shard that used to rerun them (Issue #5972). Windows and macOS
  # are not repeated here either.
  #
  # `build-gate` below `needs:` this job, so its check run does not exist
  # until it finishes. Keep that: a queue-side Build Gate with no `needs:`
  # barrier would report before the tests it stands for.
  native-builds:
    name: Native Build (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): this job runs on merge_group /
    # workflow_dispatch, whose ref is gh-readonly-queue/* or the manual
    # dispatch ref — neither is refs/heads/develop, so a save here would be
    # just as unreadable to other PRs as the per-PR-ref caches this story
    # removes, and would count as a second writer alongside
    # develop-sanity.yml. The develop-scoped writer is the only save path.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    # The same make targets, and so the same packages and flags (-race -short),
    # as test-suite.yml's unit-tests-api / -controller-core legs.
    - name: Build all binaries and run api + controller-core groups
      env:
        CFGMS_TEST_INTEGRATION: "0"  # no Docker here; Controller Integration Tests (Linux) covers it
      run: |
        make build
        make test-framework-api-sharded
        make test-go-group-controller-core

  # The Postgres-backed suites no PR job can run (Issue #4220), in parallel
  # with the native build so the queue's wall time stays at its floor (Controller
  # Integration Tests (Linux)). This is what remained unique in the removed
  # "Integration Tests (Docker)" job:
  #   - features/controller/server's database-provider subtests, which skip
  #     under -short and without CFGMS_TEST_DB_HOST, so no unit leg reaches them;
  #   - the integration-tagged cert and database-provider suites.
  # That job's TestRegistration and certificate -run tests already run in
  # Controller Integration Tests (Linux), so they are not repeated here.
  #
  # -tags=integration so the database provider's //go:build integration files
  # run (pkg/cert has none; the tag is a no-op there). -p 1 because
  # pkg/cert/interfaces' database contract case and the database provider's
  # setupTestDatabase drop and recreate the same schema; concurrent packages
  # would drop tables from under each other's tests.
  #
  # It also proves both directions of the N / N-1 schema contract on this same
  # Postgres (Issue #6097, Epic #5978) after the suites above, in two steps that
  # reset the database first: scripts/check-schema-compat.sh runs the base
  # revision's database suite against the head revision's schema and the head
  # revision's suite against the base revision's schema, and
  # scripts/check-schema-compat_test.sh proves the check itself fails closed.
  # The base commit has to be in the clone, hence fetch-depth: 0 (the checkout
  # does not persist credentials, so a single-SHA fetch can fail).
  #
  # timeout-minutes is the sum of the step limits: the original 30 for the
  # steps above, 35 for the compat check (two suite runs capped at 15 minutes
  # each, plus both apply steps and builds) and 20 for its self-test.
  postgres-integration:
    name: Postgres Integration Tests (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 85
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234), as for the native build above.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Start Docker test services
      run: make test-integration-setup

    - name: Run Postgres-backed tests
      env:
        CFGMS_TEST_INTEGRATION: "1"
      run: |
        set -a
        source .env.test
        set +a
        go test -race -timeout=10m ./pkg/testing/storage/... ./features/controller/server/...
        go test -v -race -p 1 -tags=integration -timeout=20m ./pkg/cert/... ./pkg/storage/providers/database/... ./features/controller/run/...

    # The base is the merge group's base commit; a manual dispatch uses the
    # merge-base with develop. The script resets the database itself.
    - name: Check schema compatibility (N / N-1)
      timeout-minutes: 35
      env:
        MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      run: |
        set -a
        source .env.test
        set +a
        if [[ -n "$MERGE_GROUP_BASE_SHA" ]]; then
          CFGMS_SCHEMA_COMPAT_BASE_SHA="$MERGE_GROUP_BASE_SHA"
        else
          CFGMS_SCHEMA_COMPAT_BASE_SHA="$(git merge-base origin/develop HEAD)"
        fi
        export CFGMS_SCHEMA_COMPAT_BASE_SHA
        scripts/check-schema-compat.sh

    - name: Test the schema compatibility check
      timeout-minutes: 20
      run: |
        set -a
        source .env.test
        set +a
        scripts/check-schema-compat_test.sh

    - name: Cleanup Docker services
      if: always()
      run: make test-integration-cleanup

  # QUEUE-REAL (#2595): the authoritative Build Gate on the merge commit. It
  # `needs:` the Linux native build and the Postgres job above, so its check run
  # does not exist until they finish (Issue #4220 AC4).
  build-gate:
    name: Build Gate
    permissions: {}
    needs: [native-builds, postgres-integration]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Check Build Results
      env:
        NATIVE_RESULT: ${{ needs.native-builds.result }}
        POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
      run: |
        echo "## Build Gate Results" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Native Build (Linux) | $NATIVE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Postgres Integration Tests (Linux) | $POSTGRES_RESULT |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [[ "$NATIVE_RESULT" == "success" && "$POSTGRES_RESULT" == "success" ]]; then
          echo "### BUILD GATE PASSED" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### BUILD GATE FAILED" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
