name: Cross-Platform Build Validation

# QUEUE-ONLY. This workflow has no `pull_request` trigger, so it posts nothing on
# the pull-request side — not even a skipped run. The PR-side `Cross-Platform
# Compilation Check` and `Build Gate` contexts come from
# cross-platform-build-pr.yml.
#
# The split is structural on purpose. A job gated `if: pull_request` still posts a
# check run with conclusion `skipped` in the merge queue, and GitHub accepts a
# `skipped` run as satisfying a required status check. With `build-gate` being
# `needs: [native-builds, integration-tests]`, its check run does not exist while
# the native builds run — so the queue saw only a skipped `Build Gate` and merged
# before this gate ever reported. See cross-platform-build-pr.yml for the measured
# evidence.
#
# DO NOT add a `pull_request` trigger to this file.
on:
  merge_group:
  workflow_dispatch:

# Never cancel an in-flight merge_group run (#2595).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.6'

permissions: {}

jobs:
  # Native build tests on each platform — all on GitHub-hosted runners.
  #
  # Windows CI runs on hosted windows-latest (#2559, epic #565): the self-hosted
  # Windows runner was measurably ~2x slower than hosted and, sharing hardware with
  # a Linux runner, starved Linux CI — so Windows was routed off it. Hosted runners
  # have effectively unlimited concurrency, so no self-hosted/hosted picker is
  # needed. Linux and macOS were already hosted.
  native-builds:
    name: Native Build (${{ matrix.platform }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # QUEUE-REAL (#2595): the 3-platform native build+test matrix is the
    # fleet's most expensive suite — validated once against the merge commit
    # rather than paying for it twice per PR.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Mark workspace safe for git (needed on self-hosted after service-account changes; idempotent on hosted)
      shell: bash
      env:
        GIT_CONFIG_GLOBAL: ${{ runner.temp }}/.gitconfig
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build All Binaries
      shell: bash
      run: make build

    - name: Run Unit Tests
      shell: bash
      env:
        CFGMS_TEST_INTEGRATION: "0"  # Disable integration tests (no Docker infrastructure in cross-platform CI)
      # Windows runs -short WITHOUT -race to keep this compile-validation job fast;
      # race coverage is fully exercised on the Linux unit-tests + integration-tests
      # jobs. Linux/macOS run with -race here.
      #
      # ./cmd/... added (Issue #3470): Windows-only SCM and service-management code
      # in cmd/cfgms-steward-launcher, cmd/steward/service, and
      # cmd/controller/service is //go:build windows and therefore invisible to
      # the Linux unit-tests job. This is the only job that runs on a Windows
      # runner, so without ./cmd/... those tests executed in no CI job.
      #
      # Timeout set to 8m (from 5m) — Issue #2591: features/controller/api grew to
      # 89 files / ~25k LOC with CPU-intensive tests (argon2id credential hashing,
      # TLS certificate rotation). Measured wall-clock on a 16-core Linux dev
      # container: ~42s; 2–3 vCPU macOS/Windows hosted runners at ~7× overhead
      # were hitting the 5m wall consistently. The argon2id TestMain override
      # (Issue #2591) removes the largest hot path; 8m provides a safe margin for
      # the remaining certificate-rotation tests, Windows file-I/O overhead, and
      # the SCM / WMI calls in ./cmd/... on Windows.
      run: |
        if [ "${{ matrix.platform }}" = "Windows" ]; then
          go test -short -timeout=8m ./pkg/... ./features/...
          # -v is scoped to ./cmd/... (Issue #3470): the Windows-only SCM tests in
          # cmd/cfgms-steward-launcher are the reason this job exists, and a
          # non-verbose run emits only one "ok <package>" line per package — the
          # per-test "--- PASS" / "--- SKIP" result each SCM test produces is
          # absent from the log entirely, so there is no way to tell a passing SCM
          # test from one that skipped for lack of Administrator rights. Keeping
          # -v off ./pkg/... and ./features/... holds the rest of the log readable.
          go test -v -short -timeout=8m ./cmd/...
        else
          go test -race -short -timeout=8m ./pkg/... ./features/... ./cmd/...
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-${{ matrix.platform }}
        path: bin/
        retention-days: 5

  # Integration tests with Docker infrastructure (Linux only)
  # QUEUE-REAL (#2595): Docker-heavy, validated once against the merge commit.
  integration-tests:
    name: Integration Tests (Docker)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Start Docker Test Services
      run: |
        echo "🐳 Starting Docker test infrastructure..."
        make test-integration-setup
        echo "✅ Docker services ready"

    - name: Start Controller for Transport Tests
      run: |
        echo "🚀 Starting standalone controller for transport integration tests..."
        # Source test environment variables
        set -a
        source .env.test
        set +a
        # Start controller-standalone with HA profile (includes TimescaleDB)
        docker compose -f docker-compose.test.yml --profile ha up -d controller-standalone
        echo "⏳ Waiting for controller to be healthy..."
        sleep 30
        # Verify controller is running
        docker compose -f docker-compose.test.yml ps controller-standalone
        docker compose -f docker-compose.test.yml logs --tail=50 controller-standalone
        echo "✅ Controller started"

    - name: Run Integration Tests
      run: |
        echo "🧪 Running integration tests with Docker infrastructure..."
        # Source test environment variables from make test-integration-setup
        set -a
        source .env.test
        set +a
        export CFGMS_TEST_INTEGRATION=1

        # Run storage and controller server integration tests
        go test -race -timeout=10m ./pkg/testing/storage/... ./features/controller/server/...

        # Run transport integration tests (requires Docker controller)
        # TestRegistration includes TestSingleUseToken which is the known failing test
        go test -v -race -timeout=15m ./test/integration/transport/... -run "TestRegistration"

        # Run certificate integration tests
        go test -v -race -timeout=10m ./test/integration/... \
          -run "^Test(Certificate|ConfigValidation|Epic6Compliance|RegistrationTokenPersistence)$"

        echo "✅ Integration tests completed"

    - name: Cleanup Controller
      if: always()
      run: |
        echo "🧹 Stopping controller..."
        # Compose interpolates every service in the file even for `down`, and two
        # of them require CFGMS_SECRETS_KEY_FILE. Without it this aborted before
        # stopping anything — masked by the `|| true`.
        if [ -f .env.test ]; then
          set -a
          source .env.test
          set +a
        fi
        export CFGMS_SECRETS_KEY_FILE="${CFGMS_SECRETS_KEY_FILE:-/dev/null}"
        docker compose -f docker-compose.test.yml --profile ha down || true

    - name: Cleanup Docker Services
      if: always()
      run: make test-integration-cleanup


  # QUEUE-REAL (#2595): the authoritative Build Gate — native multi-platform
  # builds and Docker integration tests validate the actual merge commit here,
  # not on every PR push. Mutually exclusive with the PR stub above by event.
  build-gate:
    name: Build Gate
    permissions: {}
    needs: [native-builds, integration-tests]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Check Build Results
      run: |
        echo "## Build Gate Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        native="${{ needs.native-builds.result }}"
        integration="${{ needs.integration-tests.result }}"

        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Native Builds | $native |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | $integration |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "$native" == "success" && "$integration" == "success" ]]; then
          echo "### BUILD GATE PASSED" >> $GITHUB_STEP_SUMMARY
          echo "All platforms build and test successfully." >> $GITHUB_STEP_SUMMARY
        else
          echo "### BUILD GATE FAILED" >> $GITHUB_STEP_SUMMARY
          echo "One or more platform builds failed." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
