name: Cross-Platform Build Validation

# QUEUE-ONLY. This workflow has no `pull_request` trigger, so it posts nothing on
# the pull-request side — not even a skipped run. The PR-side `Cross-Platform
# Compilation Check` and `Build Gate` contexts come from
# cross-platform-build-pr.yml.
#
# The split is structural on purpose. A job gated `if: pull_request` still posts a
# check run with conclusion `skipped` in the merge queue, and GitHub accepts a
# `skipped` run as satisfying a required status check. With `build-gate` being
# `needs: [native-builds]`, its check run does not exist while
# the native builds run — so the queue saw only a skipped `Build Gate` and merged
# before this gate ever reported. See cross-platform-build-pr.yml for the measured
# evidence.
#
# DO NOT add a `pull_request` trigger to this file.
on:
  merge_group:
  workflow_dispatch:

# Never cancel an in-flight merge_group run (#2595).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.1'

permissions: {}

jobs:
  # One Linux unit pass on the MERGE COMMIT, in two shards (Issue #4220).
  #
  # The PR side already runs every unit package natively on Linux, Windows and
  # macOS (test-suite.yml's unit-tests-* legs, cross-platform-build-pr.yml's
  # Windows/macOS legs, Issue #4219). What a PR cannot see is its combination
  # with whatever merged ahead of it, so the queue re-runs the Linux suite once
  # against the merge commit — the same make targets and flags as the PR's
  # unit-tests-* legs, split to run beside Controller Integration Tests (Linux),
  # the queue's floor. Windows and macOS are not repeated here.
  #
  # `build-gate` below `needs:` these shards, so its check run does not exist
  # until they finish. Keep that: a queue-side Build Gate with no `needs:`
  # barrier would report before the tests it stands for.
  native-builds:
    name: Native Build (Linux, shard ${{ matrix.shard }}/2)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): this job runs on merge_group /
    # workflow_dispatch, whose ref is gh-readonly-queue/* or the manual
    # dispatch ref — neither is refs/heads/develop, so a save here would be
    # just as unreadable to other PRs as the per-PR-ref caches this story
    # removes, and would count as a second writer alongside
    # develop-sanity.yml. The develop-scoped writer is the only save path.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    # The same make targets, and so the same packages and flags (-race -short),
    # as test-suite.yml's unit-tests-api / -controller-core / -heavy-providers /
    # -rest legs, balanced into two shards from those legs' measured times.
    - name: Build all binaries and run api + controller-core groups (shard 1)
      if: matrix.shard == 1
      env:
        CFGMS_TEST_INTEGRATION: "0"  # no Docker here; Controller Integration Tests (Linux) covers it
      run: |
        make build
        make test-framework-api-sharded
        make test-go-group-controller-core

    - name: Run heavy-providers + rest groups (shard 2)
      if: matrix.shard == 2
      env:
        CFGMS_TEST_INTEGRATION: "0"
      run: |
        make test-go-group-heavy-providers
        make test-go-group-rest

  # QUEUE-REAL (#2595): the authoritative Build Gate on the merge commit. It
  # `needs:` the Linux unit shards above, so its check run does not exist until
  # they finish (Issue #4220 AC4). The Docker-backed suites that used to feed
  # this gate as "Integration Tests (Docker)" now run in production-gates.yml's
  # Controller Integration Tests (Linux), which the queue already waits for.
  build-gate:
    name: Build Gate
    permissions: {}
    needs: [native-builds]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Check Build Results
      env:
        NATIVE_RESULT: ${{ needs.native-builds.result }}
      run: |
        echo "## Build Gate Results" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Native Build (Linux, 2 shards) | $NATIVE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [[ "$NATIVE_RESULT" == "success" ]]; then
          echo "### BUILD GATE PASSED" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### BUILD GATE FAILED" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
