# Docker Container Security Scanning Workflow
# Trivy container image vulnerability scanning
#
# This workflow scans Docker container images for:
# - Base image vulnerabilities (OS packages)
# - Application dependency vulnerabilities
# - Misconfigurations
# - Embedded secrets
#
# Scans trigger on:
# - PRs that modify cmd/**/Dockerfile*, go.mod, or go.sum — in practice this
#   fires on most PRs: measured at 15 of 50 sampled PR-side runs for
#   scan-controller (14 of 50 for scan-steward), filling a full 50-run sample
#   page within 34-40 days. See docs/development/ci-test-tiers.md §AC1.
# - Manual workflow dispatch
#
# Trivy binary is installed once per job and cached across runs.
# Only the vulnerability database is updated each run.
#
# Documentation: https://github.com/aquasecurity/trivy-action

name: Docker Container Security

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cmd/**/Dockerfile*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-security.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.27.2'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: cfg-is/cfgms
  TRIVY_VERSION: 'v0.75.0'

permissions: {}

jobs:
  # PR-time mirror (Issue #4955): a PR that adds or changes a .github/ci-images.yml
  # entry copies the new image into ghcr.io/cfg-is/ci-mirror/ before the image
  # pulling jobs run. pin-diff is unprivileged and computes the refs; mirror-pins
  # holds packages: write and is skipped for fork PRs and when the list is
  # unchanged. Consumers run when mirror-pins is skipped, not when it failed.
  pin-diff:
    name: Diff Mirrored Image Pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_refs: ${{ steps.diff.outputs.changed_refs }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: List added or changed mirrored images
      id: diff
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        base="$(mktemp)"
        if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}:.github/ci-images.yml" 2>/dev/null; then
          git show "${BASE_SHA}:.github/ci-images.yml" > "$base"
        else
          : > "$base"
        fi
        refs="$(scripts/mirror-ci-images.sh --changed-refs "$base" | jq -R . | jq -sc .)"
        echo "changed_refs=${refs}" >> "$GITHUB_OUTPUT"
        echo "changed refs: ${refs}"

  mirror-pins:
    name: Mirror Changed Image Pins
    needs: pin-diff
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.pin-diff.outputs.changed_refs != '[]' && needs.pin-diff.outputs.changed_refs != '' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        upstream_ref: ${{ fromJSON(needs.pin-diff.outputs.changed_refs) }}
    permissions:
      contents: read
      packages: write
    # './' is the documented form for job-level reusable-workflow calls; see
    # dependency-pin-check.yml mirror-new-digests.
    uses: ./.github/workflows/ci-image-mirror.yml # zizmor: ignore[self-repository]
    with:
      upstream_ref: ${{ matrix.upstream_ref }}

  # Scan Controller Docker Image
  scan-controller:
    name: Scan Controller Image
    needs: [pin-diff, mirror-pins]
    if: ${{ !cancelled() && needs.mirror-pins.result != 'failure' && needs.pin-diff.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Trivy (cached)
      # zizmor: ignore[unpinned-tools] — TRIVY_VERSION is pinned to a specific clean release (v0.75.0, post-CVE-2026-33634); the action itself is SHA-pinned
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1 — pinned to SHA per CVE-2026-33634
      with:
        version: ${{ env.TRIVY_VERSION }}
        cache: true

    - name: Cache Trivy vulnerability database
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.cache/trivy
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          trivy-db-${{ runner.os }}-

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Controller Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./cmd/controller/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_PREFIX }}/controller:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — pinned to SHA per CVE-2026-33634
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/controller:scan
        format: 'sarif'
        output: 'trivy-controller-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln,secret,config'
        exit-code: '1'
        ignore-unfixed: false
        vuln-type: 'os,library'
        timeout: '10m'
        cache-dir: ${{ github.workspace }}/.cache/trivy
        skip-setup-trivy: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      if: always()
      with:
        sarif_file: 'trivy-controller-results.sarif'
        category: 'container-controller'

    - name: Generate human-readable report
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — pinned to SHA per CVE-2026-33634
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/controller:scan
        format: 'table'
        output: 'trivy-controller-report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln,secret,config'
        timeout: '10m'
        cache-dir: ${{ github.workspace }}/.cache/trivy
        skip-setup-trivy: true

    - name: Print human-readable report to job log
      if: always()
      run: |
        if [ -f trivy-controller-report.txt ]; then
          cat trivy-controller-report.txt
          {
            echo '### Controller image scan'
            echo '```'
            cat trivy-controller-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "trivy-controller-report.txt was not generated (scan did not complete)." | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload scan results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: trivy-controller-results
        path: |
          trivy-controller-results.sarif
          trivy-controller-report.txt
        retention-days: 30

  # Scan Steward Docker Image
  scan-steward:
    name: Scan Steward Image
    needs: [pin-diff, mirror-pins]
    if: ${{ !cancelled() && needs.mirror-pins.result != 'failure' && needs.pin-diff.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Trivy (cached)
      # zizmor: ignore[unpinned-tools] — TRIVY_VERSION is pinned to a specific clean release (v0.75.0, post-CVE-2026-33634); the action itself is SHA-pinned
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1 — pinned to SHA per CVE-2026-33634
      with:
        version: ${{ env.TRIVY_VERSION }}
        cache: true

    - name: Cache Trivy vulnerability database
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.cache/trivy
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          trivy-db-${{ runner.os }}-

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Steward Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./cmd/steward/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_PREFIX }}/steward:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — pinned to SHA per CVE-2026-33634
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/steward:scan
        format: 'sarif'
        output: 'trivy-steward-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln,secret,config'
        exit-code: '1'
        ignore-unfixed: false
        vuln-type: 'os,library'
        timeout: '10m'
        cache-dir: ${{ github.workspace }}/.cache/trivy
        skip-setup-trivy: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      if: always()
      with:
        sarif_file: 'trivy-steward-results.sarif'
        category: 'container-steward'

    - name: Generate human-readable report
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — pinned to SHA per CVE-2026-33634
      with:
        image-ref: ${{ env.IMAGE_PREFIX }}/steward:scan
        format: 'table'
        output: 'trivy-steward-report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln,secret,config'
        timeout: '10m'
        cache-dir: ${{ github.workspace }}/.cache/trivy
        skip-setup-trivy: true

    - name: Print human-readable report to job log
      if: always()
      run: |
        if [ -f trivy-steward-report.txt ]; then
          cat trivy-steward-report.txt
          {
            echo '### Steward image scan'
            echo '```'
            cat trivy-steward-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "trivy-steward-report.txt was not generated (scan did not complete)." | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload scan results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: trivy-steward-results
        path: |
          trivy-steward-results.sarif
          trivy-steward-report.txt
        retention-days: 30

  # Consolidated Security Summary
  security-summary:
    name: Container Security Summary
    runs-on: ubuntu-latest
    needs: [scan-controller, scan-steward]
    if: always()
    permissions: {}
    steps:
    - name: Generate Summary
      run: |
        echo "## Docker Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Image Scan Status" >> $GITHUB_STEP_SUMMARY
        echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Controller | ${{ needs.scan-controller.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Steward | ${{ needs.scan-steward.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        controller_status="${{ needs.scan-controller.result }}"
        steward_status="${{ needs.scan-steward.result }}"

        if [[ "$controller_status" == "success" && "$steward_status" == "success" ]]; then
          echo "### ✅ All Container Scans Passed" >> $GITHUB_STEP_SUMMARY
          echo "No CRITICAL or HIGH vulnerabilities found in container images." >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Container Security Issues Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review findings in the [Security tab](../../security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "2. Download scan results from workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "3. Update base images or dependencies to resolve vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common Fixes:**" >> $GITHUB_STEP_SUMMARY
          echo "- Update base image version in Dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "- Run \`go get -u\` to update vulnerable Go dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Review Trivy reports for specific remediation steps" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Scan Coverage" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Base OS vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Application dependencies" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Configuration issues" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Embedded secrets" >> $GITHUB_STEP_SUMMARY
