name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated semantic-version tag on main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag is not canonical semantic versioning." >&2
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            IFS='.' read -r -a prerelease_parts <<< "${tag#*-}"
            for identifier in "${prerelease_parts[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "Release tag has a non-canonical numeric prerelease identifier." >&2
                exit 1
              fi
            done
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != tag ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          commit="$(git rev-list -n 1 "refs/tags/$tag")"
          if [[ "$commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release commit is not reachable from origin/main." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked release checkout is dirty." >&2
            exit 1
          fi
          {
            echo "version=$tag"
            echo "commit=$commit"
            echo "epoch=$(git show -s --format=%ct "$commit")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build release binaries
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release artifacts must not be built from a cache any other workflow
          # can write. A poisoned module cache would be baked into the binaries.
          cache: false

      - name: Build all targets twice and compare
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_EPOCH: ${{ needs.validate.outputs.epoch }}
          # A public key, not a secret. Empty means the development placeholder.
          RELEASE_PUBLISHER_KEY: ${{ vars.CFGMS_RELEASE_PUBLISHER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_args=()
          if [[ -n "$RELEASE_PUBLISHER_KEY" ]]; then
            key_args=(--publisher-key "$RELEASE_PUBLISHER_KEY")
          fi
          bash scripts/release/build-binaries.sh \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source-date-epoch "$RELEASE_EPOCH" \
            "${key_args[@]}" \
            --output dist

      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: dist/cfgms-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PUBLISHER_KEY: ${{ vars.CFGMS_RELEASE_PUBLISHER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : > release-notes.md
          if [[ -z "$RELEASE_PUBLISHER_KEY" ]]; then
            printf '%s\n\n' "These binaries carry the development placeholder publisher key." >> release-notes.md
          fi
          bash scripts/release/changelog-section.sh "$RELEASE_VERSION" >> release-notes.md

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_VERSION" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_VERSION" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CFGMS $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
