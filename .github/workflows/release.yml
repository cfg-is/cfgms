name: Signed release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated semantic-version tag on main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag is not canonical semantic versioning." >&2
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            IFS='.' read -r -a prerelease_parts <<< "${tag#*-}"
            for identifier in "${prerelease_parts[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "Release tag has a non-canonical numeric prerelease identifier." >&2
                exit 1
              fi
            done
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != tag ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          commit="$(git rev-list -n 1 "refs/tags/$tag")"
          if [[ "$commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release commit is not reachable from origin/main." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked release checkout is dirty." >&2
            exit 1
          fi
          {
            echo "version=$tag"
            echo "commit=$commit"
            echo "epoch=$(git show -s --format=%ct "$commit")"
          } >> "$GITHUB_OUTPUT"

  archives:
    name: Reproducible archives
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release artifacts must not be built from a cache any other workflow
          # can write. A poisoned module cache would be baked into signed,
          # attested binaries.
          cache: false

      - name: Build twice and compare
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_EPOCH: ${{ needs.validate.outputs.epoch }}
          RELEASE_PUBLISHER_KEY: ${{ vars.CFGMS_RELEASE_PUBLISHER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PUBLISHER_KEY" ]]; then
            echo "The protected release environment has no publisher public key." >&2
            exit 1
          fi
          bash scripts/release/build-reproducible.sh \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source-date-epoch "$RELEASE_EPOCH" \
            --publisher-key "$RELEASE_PUBLISHER_KEY" \
            --output dist

      - name: Upload reproducible archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/cfgms-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Signed Windows installer
    needs: validate
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release artifacts must not be built from a cache any other workflow
          # can write. A poisoned module cache would be baked into signed,
          # attested binaries.
          cache: false

      - name: Import signing certificate and build MSI
        shell: pwsh
        env:
          CFGMS_RELEASE_BUILD: "1"
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PUBLISHER_KEY: ${{ vars.CFGMS_RELEASE_PUBLISHER_KEY }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:RELEASE_PUBLISHER_KEY)) {
              throw "Protected Windows signing inputs are incomplete."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "cfgms-release-signing.pfx"
          try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
              $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
              if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
                  throw "Imported certificate has no private key."
              }
              ./build/windows/build-msi.ps1 `
                  -Version $env:RELEASE_VERSION `
                  -PublisherKey $env:RELEASE_PUBLISHER_KEY `
                  -SigningCertThumbprint $certificate.Thumbprint
          } finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload signed MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-msi
          path: bin/cfgms-steward-windows-amd64.msi
          if-no-files-found: error
          retention-days: 7

  macos-installers:
    name: Signed and notarized macOS installers
    needs: validate
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release artifacts must not be built from a cache any other workflow
          # can write. A poisoned module cache would be baked into signed,
          # attested binaries.
          cache: false

      - name: Import signing identities, build, and notarize
        env:
          CFGMS_RELEASE_BUILD: "1"
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PUBLISHER_KEY: ${{ vars.CFGMS_RELEASE_PUBLISHER_KEY }}
          APPLE_P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARIZATION_PROFILE: cfgms-release-notary
        shell: bash
        run: |
          set -euo pipefail
          for required in PUBLISHER_KEY APPLE_P12_BASE64 APPLE_P12_PASSWORD \
              APPLE_APPLICATION_SIGNING_IDENTITY APPLE_SIGNING_IDENTITY \
              APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!required}" ]]; then
              echo "Protected macOS signing input $required is missing." >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/cfgms-release.keychain-db"
          p12="$RUNNER_TEMP/cfgms-release.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$p12" "$notary_key"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_P12_BASE64" | base64 --decode > "$p12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          security create-keychain -p "$APPLE_P12_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_P12_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_P12_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials "$APPLE_NOTARIZATION_PROFILE" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
          bash build/darwin/build-pkg.sh --arch amd64 --version "$RELEASE_VERSION" --publisher-key "$PUBLISHER_KEY"
          bash build/darwin/build-pkg.sh --arch arm64 --version "$RELEASE_VERSION" --publisher-key "$PUBLISHER_KEY"

      - name: Upload signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-pkgs
          path: bin/cfgms-steward-darwin-*.pkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign, attest, and publish
    needs: [validate, archives, windows-installer, macos-installers]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/cfgms-${{ needs.validate.outputs.version }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            LC_ALL=C sort -z |
            xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign every artifact
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done < <(find release-assets -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 | LC_ALL=C sort -z)

      - name: Attest release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Attest release SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
          sbom-path: release-assets/cfgms-${{ needs.validate.outputs.version }}.spdx.json

      - name: Add attestation bundles to release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "release-assets/cfgms-${RELEASE_VERSION}.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release-assets/cfgms-${RELEASE_VERSION}.sbom-attestation.sigstore.json"

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CFGMS $RELEASE_VERSION" \
            --generate-notes
