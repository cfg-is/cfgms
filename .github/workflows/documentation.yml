name: Documentation Validation

on:
  pull_request:
    branches: [ main, develop ]
    # Run when documentation, agent definitions, or workflow files change
    paths:
      - 'docs/**'
      - '*.md'
      - '.claude/**/*.md'   # .claude markdown only — executable pipeline code under .claude/ (scripts, workflows) gets real CI (Issue #2586)
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/workflows/*.yml'
  push:
    branches:
      - main
    # Same paths filter on push
    paths:
      - 'docs/**'
      - '*.md'
      - '.claude/**/*.md'   # .claude markdown only — executable pipeline code under .claude/ (scripts, workflows) gets real CI (Issue #2586)
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/workflows/*.yml'
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  # Validate CLAUDE.md structure and links
  validate-claude-md:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate CLAUDE.md Structure
        run: |
          echo "## CLAUDE.md Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check essential content exists (concept-based, not exact heading names)
          errors=0

          check_content() {
            local description="$1"
            local pattern="$2"
            if grep -qi "$pattern" CLAUDE.md; then
              echo "✅ $description" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Missing: $description (pattern: $pattern)" >> $GITHUB_STEP_SUMMARY
              errors=$((errors + 1))
            fi
          }

          check_content "Project overview" "CFGMS"
          check_content "Agent workflow" "CFGMS_AGENT_MODE"
          check_content "Slash commands" "story-start\|story-commit\|story-complete"
          check_content "Git workflow (PRs target develop)" "base develop"
          check_content "Central providers" "central provider"
          check_content "Testing standards" "TDD\|real.*components\|no.*mock"
          check_content "DSD principles" "Desired State"
          check_content "Security rules" "mTLS\|mutual TLS"

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $errors -eq 0 ]; then
            echo "✅ CLAUDE.md structure validation passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ CLAUDE.md validation failed: $errors missing sections" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Check Internal File References
        run: |
          echo "## Internal Link Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract file paths from markdown links (excluding URLs)
          # Format: [text](path/to/file.md)
          broken_links=0

          while IFS= read -r file; do
            # Skip URLs and anchors
            if [[ "$file" =~ ^http ]] || [[ "$file" =~ ^# ]]; then
              continue
            fi

            # Strip anchor fragment (#section) before checking file existence
            file_path="${file%%#*}"
            if [ ! -f "$file_path" ] && [ ! -d "$file_path" ]; then
              echo "❌ Broken link: $file" >> $GITHUB_STEP_SUMMARY
              broken_links=$((broken_links + 1))
            fi
          done < <(grep -oP '\[.*?\]\(\K[^)]+' CLAUDE.md 2>/dev/null || true)

          if [ $broken_links -eq 0 ]; then
            echo "✅ All internal file references are valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Found $broken_links broken link(s)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # Validate roadmap structure
  validate-roadmap:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate Roadmap Format
        run: |
          echo "## Roadmap Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for required sections
          if grep -q "## Current Status" docs/product/roadmap.md; then
            echo "✅ Current Status section found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Missing Current Status section" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for Epic structure
          if grep -q "### Epic [0-9]" docs/product/roadmap.md; then
            echo "✅ Epic structure found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  No Epic structure found" >> $GITHUB_STEP_SUMMARY
          fi

          # Count completed vs pending stories
          completed=$(grep -c "\- \[x\]" docs/product/roadmap.md || echo "0")
          pending=$(grep -c "\- \[ \]" docs/product/roadmap.md || echo "0")
          total=$((completed + pending))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Roadmap Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Completed Stories: $completed" >> $GITHUB_STEP_SUMMARY
          echo "- Pending Stories: $pending" >> $GITHUB_STEP_SUMMARY
          echo "- Total Stories: $total" >> $GITHUB_STEP_SUMMARY

          if [ $total -gt 0 ]; then
            progress=$((completed * 100 / total))
            echo "- Progress: $progress%" >> $GITHUB_STEP_SUMMARY
          fi

  # Documentation summary
  documentation-summary:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [validate-claude-md, validate-roadmap]
    if: always()
    steps:
      - name: Documentation Validation Summary
        run: |
          echo "## Documentation Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.validate-claude-md.result }}" == "success" ]]; then
            echo "✅ **CLAUDE.md Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.validate-claude-md.result }}" == "skipped" ]]; then
            echo "⏭️  **CLAUDE.md Validation**: Skipped (merge_group)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CLAUDE.md Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.validate-roadmap.result }}" == "success" ]]; then
            echo "✅ **Roadmap Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.validate-roadmap.result }}" == "skipped" ]]; then
            echo "⏭️  **Roadmap Validation**: Skipped (merge_group)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Roadmap Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation Best Practices" >> $GITHUB_STEP_SUMMARY
          echo "- Keep documentation in sync with code changes" >> $GITHUB_STEP_SUMMARY
          echo "- Update CLAUDE.md when changing development workflow" >> $GITHUB_STEP_SUMMARY
          echo "- Mark roadmap items complete when stories are merged" >> $GITHUB_STEP_SUMMARY
          echo "- Use relative links for internal documentation" >> $GITHUB_STEP_SUMMARY

  # Stub jobs for branch protection requirements on docs-only PRs
  # These provide the required check names so docs-only PRs can merge
  # without waiting for code validation workflows that won't run

  unit-tests:
    name: unit-tests
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only PR validation
        run: |
          echo "✅ Documentation-only PR detected"
          echo "   Skipping code unit tests (no code changes)"
          echo "   Documentation validation is sufficient for merge"

  security-deployment-gate:
    name: security-deployment-gate
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only security validation
        run: |
          echo "✅ Documentation-only PR detected"
          echo "   Skipping security scans (no code changes)"
          echo "   No security vulnerabilities possible in docs-only changes"

  build-gate:
    name: Build Gate
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only build validation
        run: |
          echo "✅ Documentation-only PR detected"
          echo "   Skipping build validation (no code changes)"
          echo "   No compilation required for documentation updates"

  integration-tests:
    name: integration-tests
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only integration test validation
        run: |
          echo "Documentation-only PR detected"
          echo "   Skipping integration tests (no code changes)"
          echo "   No integration test validation required for docs-only changes"

  integration-tests-controller:
    name: Controller Integration Tests (Linux)
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only controller integration test validation
        run: |
          echo "✅ Documentation-only PR detected"
          echo "   Skipping controller integration tests (no code changes)"
          echo "   No controller test validation required for docs-only changes"

  fleet-e2e-tests:
    name: fleet-e2e-tests
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only fleet E2E validation
        run: |
          echo "✅ Documentation-only PR detected"
          echo "   Skipping fleet E2E tests (no code changes)"
          echo "   No fleet test validation required for docs-only changes"

  trivy-scan:
    name: trivy-scan
    permissions: {}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Docs-only Trivy validation
        run: |
          echo "✅ Documentation-only PR detected"
          echo "   Skipping Trivy filesystem scan (no code or Dockerfile changes)"
          echo "   No vulnerability scanning required for docs-only changes"
          echo "   Matches the check context name emitted by security-scan.yml's"
          echo "   real trivy-scan job, so the develop ruleset's required check"
          echo "   is satisfied uniformly for both code PRs and docs-only PRs."
