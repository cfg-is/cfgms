name: CI Image Mirror

# Copies every image listed in .github/ci-images.yml from Docker Hub to
# ghcr.io/cfg-is/ci-mirror/<name>:<tag>, digest unchanged (Issue #4858).
#
# Triggers, and nothing else:
#   push to develop  — a merge that changes the list (or this file) refreshes the mirror
#   workflow_call    — dependency-pin-check.yml mirrors a newly found upstream digest
#   workflow_dispatch — manual refresh
#
# NEVER add pull_request or pull_request_target here. This workflow holds
# packages: write; a PR-triggered run would hand that token to PR-controlled code.

on:
  push:
    branches: [develop]
    paths:
      - '.github/ci-images.yml'
      - '.github/workflows/ci-image-mirror.yml'
  workflow_call:
    inputs:
      upstream_ref:
        description: 'Mirror only this <image>:<tag>@sha256:<digest> (blank = whole list)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Mirror only this <image>:<tag>@sha256:<digest> (blank = whole list)'
        required: false
        type: string
        default: ''

# Deny by default; the mirror job re-grants only what it needs.
permissions: {}

concurrency:
  group: ci-image-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror CI Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to ghcr.io
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GHCR_USER: ${{ github.actor }}
      run: |
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

    - name: Verify the list matches the repo
      run: scripts/mirror-ci-images.sh --check

    - name: Copy images to the mirror
      env:
        UPSTREAM_REF: ${{ inputs.upstream_ref }}
      run: |
        if [ -n "$UPSTREAM_REF" ]; then
          scripts/mirror-ci-images.sh --only "$UPSTREAM_REF"
        else
          scripts/mirror-ci-images.sh
        fi
