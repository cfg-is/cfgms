    needs: changes
    runs-on: macos-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): setup-go's cache:true both restores AND
    # saves via a post-job hook; on a pull_request run that save is scoped to
    # this PR's ref, invisible to every other PR, and was evicting the
    # develop-scoped Linux-go-modules cache at the 10 GB ceiling. The
    # develop-scoped writer (develop-sanity.yml) is the only save path — PR
    # legs only ever restore into whatever it last wrote.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
          ~\go\pkg\mod
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Run features/controller minus api (-race)
      shell: bash
      env:
        CFGMS_TEST_INTEGRATION: "0"
      run: make test-go-group-macos-controller

