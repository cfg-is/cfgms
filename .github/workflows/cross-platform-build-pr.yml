        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Run controller (minus api), cert, controlplane, storage/sqlite (no -race)
      shell: bash
      env:
        CFGMS_TEST_INTEGRATION: "0"
        CFGMS_TEST_RACE: "0"
      run: make test-go-group-windows-controller

  windows-steward:
    name: Windows Unit Tests (steward, cmd)
    permissions:
      contents: read
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
