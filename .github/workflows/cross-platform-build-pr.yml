          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
          ~\go\pkg\mod
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Run remaining pkg/features/cmd packages, including modules (no -race)
      shell: bash
      env:
        CFGMS_TEST_INTEGRATION: "0"
        CFGMS_TEST_RACE: "0"
      run: make test-go-group-windows-rest

  # Native macOS unit-test legs (Issue #4219). -race, matching the queue's
  # Native Build (macOS) job. A first attempt at 2 legs measured 10m25s and
  # 11m44s on this story's own PR (#4225, run 35811533253) — macos-latest
  # hosted runners have only 3 vCPUs, so test-framework-api-sharded's
  # nproc-based internal sharding maxed out at 3 processes fighting over the
  # SAME 3 cores, and -race's overhead compounds it. 7 legs (api and rest each
  # split into CI-job-level shards, controller/providers/steward pulled out
  # the way the Windows legs do) gives each leg its own dedicated 3-core
  # runner for a smaller slice of work — see the Makefile comment above
  # test-go-group-macos-api for the measured per-package breakdown.
  macos-api-1:
    name: macOS Unit Tests (controller/api, shard 1/2)
    permissions:
      contents: read
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
