      env:
        CFGMS_TEST_INTEGRATION: "0"
        CFGMS_MACOS_API_SHARD: "0"
        CFGMS_MACOS_API_SHARDS: "2"
      run: make test-go-group-macos-api

  macos-api-2:
    name: macOS Unit Tests (controller/api, shard 2/2)
    permissions:
      contents: read
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
