  windows-rest:
    name: Windows Unit Tests (rest + modules)
    permissions:
      contents: read
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): setup-go's cache:true both restores AND
    # saves via a post-job hook; on a pull_request run that save is scoped to
    # this PR's ref, invisible to every other PR, and was evicting the
