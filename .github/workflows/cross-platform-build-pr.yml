  # Non-Docker e2e suite (Issue #4219). It took over production-gates.yml's
  # queue-only "Comprehensive E2E Testing" job (same command, same -run
  # filter), which #4220 then removed from the queue.
  e2e:
    name: E2E Scenarios (no Docker)
    permissions:
      contents: read
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: always() && needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): setup-go's cache:true both restores AND
    # saves via a post-job hook; on a pull_request run that save is scoped to
    # this PR's ref, invisible to every other PR, and was evicting the
    # develop-scoped Linux-go-modules cache at the 10 GB ceiling. The
    # develop-scoped writer (develop-sanity.yml) is the only save path — PR
    # legs only ever restore into whatever it last wrote.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
          ~\go\pkg\mod
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Run Full E2E Test Suite (no Docker)
      run: go test -v -race -timeout=20m ./test/e2e/... -run "TestE2EScenarios"

  # PR-side `Build Gate` context. Docker integration tests and the queue's own
  # re-validation of the merge commit remain deferred to the merge queue, where
  # cross-platform-build.yml's `build-gate` job posts the authoritative result
  # for this same context.
  build-gate-pr-stub:
    name: Build Gate
    permissions: {}
    needs:
      - changes
      - cross-compile-check
      - windows-api
      - windows-controller
      - windows-steward
      - windows-rest
      - macos-api-1
      - macos-api-2
      - macos-providers
      - macos-controller
      - macos-steward
      - macos-rest-1
      - macos-rest-2
      - e2e
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check PR-time Build Results
      env:
        CROSS_COMPILE_RESULT: ${{ needs.cross-compile-check.result }}
        WINDOWS_API_RESULT: ${{ needs.windows-api.result }}
        WINDOWS_CONTROLLER_RESULT: ${{ needs.windows-controller.result }}
        WINDOWS_STEWARD_RESULT: ${{ needs.windows-steward.result }}
        WINDOWS_REST_RESULT: ${{ needs.windows-rest.result }}
        MACOS_API_1_RESULT: ${{ needs.macos-api-1.result }}
        MACOS_API_2_RESULT: ${{ needs.macos-api-2.result }}
        MACOS_PROVIDERS_RESULT: ${{ needs.macos-providers.result }}
        MACOS_CONTROLLER_RESULT: ${{ needs.macos-controller.result }}
        MACOS_STEWARD_RESULT: ${{ needs.macos-steward.result }}
        MACOS_REST_1_RESULT: ${{ needs.macos-rest-1.result }}
        MACOS_REST_2_RESULT: ${{ needs.macos-rest-2.result }}
        E2E_RESULT: ${{ needs.e2e.result }}
        CHANGES_RESULT: ${{ needs.changes.result }}
        CODE_CHANGES: ${{ needs.changes.outputs.code }}
      run: |
        echo "## Build Gate Results (PR)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Cross-Compile Check | $CROSS_COMPILE_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows: controller/api | $WINDOWS_API_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows: controller/cert/controlplane/sqlite | $WINDOWS_CONTROLLER_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows: steward/cmd | $WINDOWS_STEWARD_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows: rest + modules | $WINDOWS_REST_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: controller/api shard 1/2 | $MACOS_API_1_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: controller/api shard 2/2 | $MACOS_API_2_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: cert/controlplane/sqlite | $MACOS_PROVIDERS_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: controller | $MACOS_CONTROLLER_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: steward/cmd | $MACOS_STEWARD_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: rest + modules shard 1/2 | $MACOS_REST_1_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS: rest + modules shard 2/2 | $MACOS_REST_2_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E (no Docker) | $E2E_RESULT |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Integration + Queue Re-validation | deferred to merge queue |" >> $GITHUB_STEP_SUMMARY
        echo "| Change detection (\`changes\`) | $CHANGES_RESULT (code=${CODE_CHANGES:-<unset>}) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # THIS AGGREGATION MUST FAIL CLOSED, same as test-suite.yml's
        # `unit-tests` aggregator (which accepts skipped legs only when it has
        # explicitly observed `changes.outputs.code == 'false'`).
        #
        # Every native leg below is gated `if: always() && needs.changes.outputs.code == 'true'`,
        # so the legs also skip when that output is the EMPTY STRING — which is
        # what it is whenever the `changes` job failed, was cancelled, or hit
        # its `timeout-minutes`. Accepting `skipped` unconditionally would
        # therefore report a green `Build Gate` with zero Windows, macOS or e2e
        # validation on a genuine code PR. `skipped` is only ever a legitimate
        # outcome when `changes` SUCCEEDED and explicitly classified the PR as
        # documentation-only.
        fail=0

        # cross-compile-check is unconditional and must be a real success.
        [ "$CROSS_COMPILE_RESULT" = "success" ] || fail=1

        # The gate's own input: an unsuccessful `changes` job, or an output
        # that is anything other than the two values it is defined to emit,
        # is a defect and fails closed.
        if [ "$CHANGES_RESULT" != "success" ]; then
          echo "::error::change detection did not succeed (result: ${CHANGES_RESULT:-<unset>}) — cannot prove the native legs were legitimately skipped"
          fail=1
          docs_only=no
        elif [ "$CODE_CHANGES" = "false" ]; then
          docs_only=yes
        elif [ "$CODE_CHANGES" = "true" ]; then
          docs_only=no
        else
          echo "::error::change detection emitted an unexpected code output (${CODE_CHANGES:-<unset>}) — failing closed"
          fail=1
          docs_only=no
        fi

        for result in "$WINDOWS_API_RESULT" "$WINDOWS_CONTROLLER_RESULT" "$WINDOWS_STEWARD_RESULT" "$WINDOWS_REST_RESULT" "$MACOS_API_1_RESULT" "$MACOS_API_2_RESULT" "$MACOS_PROVIDERS_RESULT" "$MACOS_CONTROLLER_RESULT" "$MACOS_STEWARD_RESULT" "$MACOS_REST_1_RESULT" "$MACOS_REST_2_RESULT" "$E2E_RESULT"; do
          if [ "$result" = "success" ]; then
            continue
          fi
          if [ "$result" = "skipped" ] && [ "$docs_only" = "yes" ]; then
            continue
          fi
          echo "::error::native leg result '${result:-<unset>}' is not acceptable (docs-only PR: ${docs_only})"
          fail=1
        done

        if [ "$fail" -eq 0 ]; then
          echo "### BUILD GATE PASSED (PR stub)" >> $GITHUB_STEP_SUMMARY
          echo "Cross-compilation, native Windows/macOS unit tests, and the e2e suite all validated. Docker integration tests and a full re-validation of the merge commit run in the merge queue (#2595)." >> $GITHUB_STEP_SUMMARY
        else
          echo "### BUILD GATE FAILED" >> $GITHUB_STEP_SUMMARY
          echo "One or more PR-side build/test legs failed." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
