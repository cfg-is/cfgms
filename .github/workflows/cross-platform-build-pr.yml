name: Cross-Platform Build Validation (PR)

# PR-side half of the Build Gate, split out of cross-platform-build.yml.
#
# This file exists to make the split STRUCTURAL rather than conditional. The
# `Build Gate` stub used to live in cross-platform-build.yml behind
# `if: github.event_name == 'pull_request'`, but a job whose `if` is false still
# posts a check run with conclusion `skipped`, and GitHub accepts a `skipped` run
# as satisfying a required status check. Because the real `build-gate` job is
# `needs: [native-builds, integration-tests]`, its check run does not exist while
# the native builds are still running — so the queue saw only the stub's skipped
# `Build Gate`, considered the context satisfied, and merged.
#
# Measured on queue commit 9fcc3315: `Build Gate` had two `skipped` runs and no
# successful one; PR #3500 merged at 18:02:06Z; `Native Build (Windows)` then
# FAILED at 18:03:51Z and the real `Build Gate` failed at 18:05:00Z. A failing
# build merged. The same shape merged the Windows failures at cf404eff.
#
# A workflow with no `merge_group` trigger cannot post anything in the queue —
# not even a skipped run. That is an invariant of the trigger list, not of an
# `if:` expression a later edit can weaken.
#
# DO NOT add `merge_group:` to this file. The queue-side `Build Gate` must be
# posted only by cross-platform-build.yml's `build-gate` job.
#
# Issue #4219: the PR side used to be cross-compile-check alone, with every
# native build/test deferred to the queue — but 15 of the last 15 queue
# `Cross-Platform Build Validation` failures (measured 2026-09-22) were
# `Native Build (Windows)`, spread across ordinary packages
# (features/controller/api, pkg/storage/providers/sqlite,
# cmd/cfgms-steward-launcher, pkg/ha, pkg/lease, features/controller/registration,
# features/controller/fleet/storage, features/workflow/trigger) with no small
# Windows-specific subset that would have caught them. This file now also runs
# the unit suite natively on windows-latest (4 legs, no -race, matching the
# queue job) and macos-latest (7 legs, -race, matching the queue job — split
# finer than Windows because macos-latest's 3 vCPUs make -race much more
# expensive per leg; see the "Native macOS unit-test legs" comment below),
# plus the non-Docker e2e suite on ubuntu-latest — so a Windows- or macOS-only failure
# shows up on the PR instead of only after it reaches the merge queue. Nothing
# is removed from the queue by this story: cross-platform-build.yml still
# independently re-validates the merge commit with its own native-build matrix
# and Docker integration tests (follow-up story removes the redundancy).

on:
  pull_request:
    branches: [ main, develop ]
    # CONSERVATIVE: Only skip for pure documentation changes
    # Build validation runs if ANY code changes are present
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**/*.md'   # .claude markdown only — executable pipeline code under .claude/ (scripts, workflows) gets real CI (Issue #2586)
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'

permissions: {}

jobs:
  # Change detection (Issue #4219), duplicated from test-suite.yml's `changes`
  # job with identical fail-closed semantics rather than shared across
  # workflows — GitHub Actions has no cross-workflow-run output sharing short
  # of a `workflow_call` reusable workflow, and this keeps the split structural
  # (see the file-level comment above) without adding a third workflow file.
  # Any edit to test-suite.yml's classification step should be mirrored here.
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR payload's own file count, used below to prove the API list
          # is complete. Not capped the way GET /pulls/{n}/files is.
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          # THIS GATE MUST FAIL CLOSED, same as test-suite.yml's `changes` job.
          # `code=false` skips the Windows/macOS/e2e legs below; every defect in
          # the input resolves to `code=true` (run them for real) — a
          # needlessly-run suite costs runner minutes, a wrongly-skipped one
          # ships untested code.
          api_status=0
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --paginate --jq '.[].filename' > changed_files.txt || api_status=$?

          listed=$(wc -l < changed_files.txt)
          echo "PR #${PR_NUMBER}: API listed ${listed} file(s); PR payload reports ${PR_CHANGED_FILES:-<unset>}"
          cat changed_files.txt

          # Defect 1: the API call itself failed (network, rate limit, token).
          if [ "$api_status" -ne 0 ]; then
            echo "::warning::gh api exited ${api_status} listing PR files — assuming code changes and running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defect 2: an empty or unusable list. Before this check an absent
          # file list was indistinguishable from a genuine docs-only PR,
          # because "no line outside the docs regex" is vacuously true for
          # empty input.
          if [ "$listed" -eq 0 ]; then
            echo "::warning::PR file list came back empty — assuming code changes and running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defect 3: an incomplete list. GET /pulls/{n}/files returns at most
          # 3000 files no matter how far --paginate walks, so on a larger PR
          # any code file past the cap is invisible to the regex below. The
          # count in the PR payload is not capped, so a mismatch detects both
          # that truncation and any partial page.
          if ! [ "${PR_CHANGED_FILES:-}" -eq "${PR_CHANGED_FILES:-}" ] 2>/dev/null; then
            echo "::warning::PR payload carried no usable changed_files count — assuming code changes and running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$listed" -ne "$PR_CHANGED_FILES" ]; then
            echo "::warning::listed ${listed} file(s) but the PR reports ${PR_CHANGED_FILES} (API cap or partial response) — assuming code changes and running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Mirrors the file set this workflow's pull_request trigger uses in
          # paths-ignore above. Any changed file outside this set means the PR
          # is not docs-only, so the native legs below must run.
          #
          # Written to a file rather than piped into `grep -q`: under
          # `pipefail` the consumer exits on its first match and can SIGPIPE
          # the producer, so the pipeline reports 141 exactly when code files
          # WERE found — which would take the docs-only branch and skip the
          # suite. A grep failure (exit >1) is a defect too, handled like the
          # others.
          grep_status=0
          grep -vE '^(docs/|[^/]+\.md$|\.claude/.*\.md$|LICENSE$|\.gitignore$|\.editorconfig$)' \
            changed_files.txt > non_doc_files.txt || grep_status=$?
          if [ "$grep_status" -gt 1 ]; then
            echo "::warning::classifying changed files failed (grep exit ${grep_status}) — assuming code changes and running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -s non_doc_files.txt ]; then
            echo "Non-documentation file(s) changed — running the native Windows/macOS/e2e legs:"
            cat non_doc_files.txt
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "All ${listed} changed file(s) are documentation — legs will be skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast cross-compilation check (single runner, all platforms not natively
  # tested below)
  # PR-REAL (#2595): fast single-runner compile check across the two targets
  # (linux/arm64, darwin/amd64) that no native runner in this workflow or the
  # queue's exercises. Native per-platform builds and Docker integration tests
  # for linux/amd64, windows/amd64 and darwin/arm64 come from the legs below and
  # the queue (cross-platform-build.yml).
  cross-compile-check:
    name: Cross-Platform Compilation Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): this step used to be a combined
    # actions/cache restore+save. This job is ungated and runs on
    # ubuntu-latest for every pull_request, so it was the highest-frequency
    # writer of `Linux-go-modules-<go.sum hash>` in the repo — each save
    # PR-ref-scoped, unreadable by any other PR, and evicting the
    # develop-scoped entry at the 10 GB cache ceiling. The develop-scoped
    # writer (develop-sanity.yml) is the only save path — PR legs only ever
    # restore into whatever it last wrote.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
          ~\go\pkg\mod
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Validate Cross-Platform Compilation
      run: make build-cross-validate

    - name: Build Summary
      run: |
        echo "## Cross-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Cross-compiled (no native runner exercises these directly):" >> $GITHUB_STEP_SUMMARY
        echo "- Linux (ARM64)" >> $GITHUB_STEP_SUMMARY
        echo "- macOS (AMD64)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Natively built and tested by the legs below:" >> $GITHUB_STEP_SUMMARY
        echo "- Linux (AMD64) — unit-tests-* legs (test-suite.yml) and the e2e leg" >> $GITHUB_STEP_SUMMARY
        echo "- Windows (AMD64) — windows-* legs" >> $GITHUB_STEP_SUMMARY
        echo "- macOS (ARM64) — macos-* legs" >> $GITHUB_STEP_SUMMARY

  # Native Windows unit-test legs (Issue #4219). No -race, matching the queue's
  # Native Build (Windows) job — Windows -race support is out of scope for this
  # story. Partitioned by measured serial per-package wall time on
  # windows-latest (queue run 35678629960, job 106590441360) to keep each leg
  # under the 7-minute PR budget; see the Makefile comment above
  # GO_GROUP_WINDOWS_CONTROLLER_EXTRA for the measurements.
  windows-api:
    name: Windows Unit Tests (controller/api)
    permissions:
      contents: read
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): setup-go's cache:true both restores AND
    # saves via a post-job hook; on a pull_request run that save is scoped to
    # this PR's ref, invisible to every other PR, and was evicting the
    # develop-scoped Linux-go-modules cache at the 10 GB ceiling. The
    # develop-scoped writer (develop-sanity.yml) is the only save path — PR
    # legs only ever restore into whatever it last wrote.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          ~\AppData\Local\go-build
          ~\go\pkg\mod
        key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-modules-

    - name: Download dependencies
      run: go mod download

    - name: Run features/controller/api (sharded, no -race)
      shell: bash
      env:
        CFGMS_TEST_INTEGRATION: "0"
      run: make test-go-group-windows-api

  windows-controller:
    name: Windows Unit Tests (controller, cert, controlplane, sqlite)
    permissions:
      contents: read
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    if: always() && needs.changes.outputs.code == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    # Restore-only (Issue #4234): setup-go's cache:true both restores AND
    # saves via a post-job hook; on a pull_request run that save is scoped to
    # this PR's ref, invisible to every other PR, and was evicting the
    # develop-scoped Linux-go-modules cache at the 10 GB ceiling. The
    # develop-scoped writer (develop-sanity.yml) is the only save path — PR
    # legs only ever restore into whatever it last wrote.
    - name: Restore Go module/build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
