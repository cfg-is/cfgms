# Third-party container images that CI pulls from Docker Hub.
#
# Each entry is two lines, parsed by line pattern only (no YAML parser is
# available to scripts/mirror-ci-images.sh or discover-pins.py):
#
#   - upstream: <image>:<tag>@sha256:<64 hex>
#     mirror: <name>
#
# `scripts/mirror-ci-images.sh` copies each upstream reference, digest
# unchanged, to ghcr.io/cfg-is/ci-mirror/<mirror>:<tag>. `--check` fails when a
# reference in docker-compose.test.yml, a Dockerfile FROM line or a workflow
# pull_with_retry step is missing from this file or carries a different digest.
# See docs/development/ci-infrastructure-setup.md.
