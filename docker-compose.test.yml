# Docker Compose configuration for CFGMS integration testing
# Provides isolated, ephemeral test environments for storage provider validation

services:
  # PostgreSQL database for database provider testing
  postgres-test:
    image: postgres:15-alpine
    container_name: cfgms-postgres-test
    environment:
      POSTGRES_DB: cfgms_test
      POSTGRES_USER: cfgms_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"  # Use non-standard port to avoid conflicts
    volumes:
      - ./test/sql:/docker-entrypoint-initdb.d:ro
      - postgres_test_data:/var/lib/postgresql/data
    tmpfs:
      # Use tmpfs for faster I/O in testing
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfgms_test -d cfgms_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cfgms-test
    profiles:
      - database  # Only start with --profile database

  # TimescaleDB database for time-series logging provider testing AND HA cluster storage
  # This service is shared between logging tests and HA integration tests
  timescaledb-test:
    image: timescale/timescaledb:latest-pg15
    container_name: cfgms-timescaledb-test
    environment:
      POSTGRES_DB: cfgms_ha_test  # Unified database for both logging and HA tests
      POSTGRES_USER: cfgms_test
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      # Enable TimescaleDB extension on startup
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5434:5432"  # Use different port from regular PostgreSQL
    volumes:
      - ./test/timescaledb:/docker-entrypoint-initdb.d:ro
      - timescaledb_test_data:/var/lib/postgresql/data
    tmpfs:
      # Use tmpfs for faster I/O in testing
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfgms_test -d cfgms_ha_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Reduced from 60s for faster startup
    networks:
      - cfgms-test
    profiles:
      - timescale  # Only start with --profile timescale
      - ha  # Also start with --profile ha

  # Gitea server for git provider testing (lightweight Git server)
  git-server-test:
    image: gitea/gitea:1.21.0
    container_name: cfgms-git-server-test
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      - GITEA__server__DISABLE_SSH=true
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__admin__USERNAME=cfgms_test
      - GITEA__admin__PASSWORD=${GITEA_ADMIN_PASSWORD}
      - GITEA__admin__EMAIL=test@cfgms.local
    ports:
      - "3001:3000"
    volumes:
      - gitea_test_data:/data
      - ./test/git-repos:/data/git/repositories:rw
      - ./test/gitea-init:/docker-entrypoint-init.d:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cfgms-test
    depends_on:
      - postgres-test
    profiles:
      - git  # Only start with --profile git

  # Redis for session/cache testing (future Epic support)
  redis-test:
    image: redis:7-alpine
    container_name: cfgms-redis-test
    ports:
      - "6380:6379"  # Use non-standard port
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cfgms-test
    profiles:
      - future  # Only start with --profile future

  # ============================================================================
  # HIGH AVAILABILITY (HA) CLUSTER SERVICES
  # Used for HA integration testing (Story #178)
  # Start with: docker compose --profile ha up
  # ============================================================================

  # One-shot bootstrap for the HA cluster's shared certificate authority.
  #
  # Raft peer traffic on /raft/message is mutual TLS: each node mints a client
  # certificate whose CN is its node ID (pkg/ha/manager.go) and the receiving
  # node verifies it against CFGMS_HA_CA_CERT_PATH. If every node ran --init it
  # would mint its own CA and no peer would trust any other, so this service
  # initialises the CA once into the ha_cluster_certs volume that all three
  # controllers mount. It also mints the server certificate they share, which
  # keeps three simultaneously-starting nodes from racing to write it.
  #
  # The controllers depend on this completing successfully, so they never start
  # against a half-written CA directory.
  #
  # It must run with the same controller.cfg the controllers use.
  # initialization.TransportCertSANs merges certificate.server.dns_names into the
  # internal (PurposeTransport) certificate, and EnsureSeparatedCertificates is
  # idempotent — whichever process mints that certificate first decides its SAN
  # set for the life of the volume. Initialising without the config file minted it
  # from the built-in defaults alone (localhost, cfgms-internal,
  # controller-standalone), so every steward's QUIC handshake failed with
  # "certificate is valid for ... not controller-east" and the steward fell back
  # to re-registering an identity the controller had already accepted, reporting
  # the unrelated "device_id already registered in this tenant".
  ha-ca-init:
    container_name: cfgms-ha-ca-init
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
    environment:
      CFGMS_NODE_ID: "controller-east"
      CFGMS_STORAGE_PROVIDER: "database"
      CFGMS_DB_HOST: "timescaledb-test"
      CFGMS_DB_PORT: "5432"
      CFGMS_DB_NAME: "cfgms_ha_test"
      CFGMS_DB_USER: "cfgms_test"
      CFGMS_DB_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      CFGMS_DB_SSLMODE: "disable"
      CFGMS_HA_ENABLED: "true"
      CFGMS_HA_MODE: "cluster"
      CFGMS_STORAGE_CLUSTER_POSTGRES_DSN: "postgres://cfgms_test:${TIMESCALEDB_PASSWORD}@timescaledb-test:5432/cfgms_ha_test?sslmode=disable"
      CFGMS_STORAGE_CLUSTER_SESSION_HMAC_KEY: "${HA_SESSION_HMAC_KEY}"
      CFGMS_S3_INSTALLER_BUCKET: "cfgms-installers-test"
      CFGMS_S3_INSTALLER_ENDPOINT_URL: "http://minio-test:9000"
      CFGMS_S3_INSTALLER_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      CFGMS_CERT_PATH: "/app/certs"
      CFGMS_DATA_DIR: "/app/data"
      CFGMS_SECRETS_KEY_FILE: "/run/secrets/cfgms-secrets-key"
      CFGMS_METRICS_LISTEN_ADDR: "127.0.0.1:9099"
      CFGMS_EXTERNAL_URL: "https://controller-east:9080"
      # controller-ha.cfg resolves internal_listen_addr from this. --init never
      # binds the listener, but config.LoadWithPath fails closed on an
      # unresolvable reference, so the value has to be present and valid.
      CFGMS_HA_INTERNAL_IP: "172.20.0.11"
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    user: root
    # cmd/controller/Dockerfile declares ENTRYPOINT ["/app/controller"] with a
    # default CMD of --config /etc/cfgms/controller.cfg; clearing the entrypoint
    # restores shell-form startup. --init is idempotent-by-tolerance: it exits
    # non-zero when the CA already exists, which `|| true` accepts so a rerun
    # against a warm volume is a no-op rather than a failure.
    entrypoint: []
    # After initialising the CA, publish a readable copy of the certificate for
    # the stewards. The CA directory itself is deliberately 0700 with 0600
    # contents because it is private key material, and the stewards run as the
    # unprivileged `cfgms` user, so mounting it directly gave them "Permission
    # denied" and then a TLS failure against their own cluster's CA. Only the
    # public certificate is copied out, and only into its own volume.
    # Clearing the entrypoint also drops the Dockerfile's default
    # `--config /etc/cfgms/controller.cfg`, so it is passed explicitly here.
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && ./controller --config /etc/cfgms/controller.cfg --init || true; mkdir -p /app/ca-public && cp /app/certs/ca/ca.crt /app/ca-public/ca.crt && chmod 0644 /app/ca-public/ca.crt"]
    volumes:
      - ha_cluster_certs:/app/certs
      - ha_ca_public:/app/ca-public
      - ./test/fixtures/ha/controller-ha.cfg:/etc/cfgms/controller.cfg:ro
      - ha_ca_init_data:/app/data
      - ha_cluster_secrets:/app/data/secrets
      - ${CFGMS_SECRETS_KEY_FILE:?set CFGMS_SECRETS_KEY_FILE to an ephemeral test key}:/run/secrets/cfgms-secrets-key:ro
    depends_on:
      timescaledb-test:
        condition: service_healthy
    networks:
      - cfgms-test
    profiles:
      - ha

  # Controller East (us-east region) - gRPC-over-QUIC Transport (Issue #519)
  controller-east:
    container_name: controller-east
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
    ports:
      - "4433:4433/udp"   # gRPC-over-QUIC transport
      - "9080:9080"   # HTTP API
    environment:
      CFGMS_NODE_ID: "controller-east"
      CFGMS_NODE_REGION: "us-east"
      # gRPC-over-QUIC Transport (Issue #519: replaces MQTT+QUIC)
      CFGMS_TRANSPORT_LISTEN_ADDR: "0.0.0.0:4433"
      CFGMS_TRANSPORT_USE_CERT_MANAGER: "true"
      CFGMS_HTTP_LISTEN_ADDR: "0.0.0.0:9080"
      # Storage Configuration
      CFGMS_STORAGE_PROVIDER: "database"
      CFGMS_DB_HOST: "timescaledb-test"
      CFGMS_DB_PORT: "5432"
      CFGMS_DB_NAME: "cfgms_ha_test"
      CFGMS_DB_USER: "cfgms_test"
      CFGMS_DB_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      CFGMS_DB_SSLMODE: "disable"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      CFGMS_TIMESCALE_HOST: "timescaledb-test"
      CFGMS_TIMESCALE_PORT: "5432"
      CFGMS_TIMESCALE_DATABASE: "cfgms_ha_test"
      CFGMS_TIMESCALE_USER: "cfgms_test"
      CFGMS_TIMESCALE_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      # HA Configuration
      CFGMS_HA_ENABLED: "true"
      CFGMS_HA_MODE: "cluster"
      # Raft peers dial https://<address>/raft/message, and that route is served
      # by the internal listener (features/controller/api/server.go), not the
      # public API. These addresses therefore carry the internal Raft port, not
      # the 9080-9082 HTTP ports they named before.
      CFGMS_HA_EXTERNAL_ADDRESS: "controller-east:9443"
      CFGMS_HA_CLUSTER_NODES: "controller-east:9443,controller-central:9443,controller-west:9443"
      CFGMS_HA_DISCOVERY_METHOD: "static"
      CFGMS_HA_DISCOVERY_INTERVAL: "10s"
      CFGMS_HA_NODE_TIMEOUT: "15s"
      CFGMS_HA_ELECTION_TIMEOUT: "5s"
      # Raft requires ElectionTimeout >= 5x HeartbeatInterval; at the previous
      # 2s the 5s election timeout produced ElectionTick=2 and every node
      # aborted in NewRaftConsensus. The 5s election timeout is load-bearing:
      # test/integration/ha/failover_test.go budgets failover as
      # NODE_TIMEOUT(15s) + DISCOVERY_INTERVAL(10s) + ELECTION_TIMEOUT(5s).
      CFGMS_HA_HEARTBEAT_INTERVAL: "1s"
      CFGMS_HA_INTERNAL_IP: "172.20.0.11"
      CFGMS_HA_CA_CERT_PATH: "/app/certs/ca/ca.crt"
      # Cluster-mode backends. features/controller/server/server.go's
      # assertClusterBackendsReady and the cluster storage manager fail closed
      # on each of these, so a cluster-mode node cannot start without them.
      CFGMS_STORAGE_CLUSTER_POSTGRES_DSN: "postgres://cfgms_test:${TIMESCALEDB_PASSWORD}@timescaledb-test:5432/cfgms_ha_test?sslmode=disable"
      CFGMS_STORAGE_CLUSTER_SESSION_HMAC_KEY: "${HA_SESSION_HMAC_KEY}"
      CFGMS_S3_INSTALLER_BUCKET: "cfgms-installers-test"
      CFGMS_S3_INSTALLER_ENDPOINT_URL: "http://minio-test:9000"
      CFGMS_S3_INSTALLER_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      CFGMS_CERT_PATH: "/app/certs"
      CFGMS_DATA_DIR: "/app/data"
      CFGMS_SECRETS_KEY_FILE: "/run/secrets/cfgms-secrets-key"
      CFGMS_METRICS_LISTEN_ADDR: "127.0.0.1:9099"
      # Adds the service name to the transport certificate's SANs
      # (features/controller/initialization/transport_sans.go) so stewards can
      # verify this node, and supplies the external address the transport
      # requires when the listener binds 0.0.0.0.
      CFGMS_EXTERNAL_HOSTNAME: "controller-east"
      CFGMS_EXTERNAL_URL: "https://controller-east:9080"
      CFGMS_API_KEY: "${API_KEY_EAST}"
      CFGMS_SEED_TEST_API_KEYS: "1"
      # Seeds the registration tokens the HA stewards present; without it
      # every steward registration is rejected 401 and no steward joins.
      CFGMS_SEED_TEST_TOKENS: "1"
      # Same rationale as controller-standalone: the ip-trust default
      # quarantines these stewards, and quarantine needs a durable pending
      # store this deployment has none of, so registration answered 503
      # "Registration admission service unavailable".
      CFGMS_REGISTRATION_WORKFLOW: "auto-approve"
      CFGMS_API_KEY_EAST: "test-api-key-east"
    user: root
    # cmd/controller/Dockerfile's ENTRYPOINT runs the binary directly with a
    # default CMD of --config /etc/cfgms/controller.cfg. Wrapping it in a shell
    # keeps that config path and creates CFGMS_LOG_DIR first: the file logging
    # provider does not create its own directory, so these nodes wrote no log
    # records at all and every cluster failure had to be diagnosed from a bare
    # container exit code.
    entrypoint: []
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && exec ./controller --config /etc/cfgms/controller.cfg"]
    volumes:
      # Shared CA and server certificate minted by ha-ca-init; peer mTLS only
      # verifies if all three nodes trust the same root.
      - ha_cluster_certs:/app/certs
      - controller_east_data:/app/data
      - ha_cluster_secrets:/app/data/secrets
      - ${CFGMS_SECRETS_KEY_FILE:?set CFGMS_SECRETS_KEY_FILE to an ephemeral test key}:/run/secrets/cfgms-secrets-key:ro
      # internal_listen_addr has no environment override and must name an
      # explicit private IP, so cluster mode requires a config file.
      - ./test/fixtures/ha/controller-ha.cfg:/etc/cfgms/controller.cfg:ro
    depends_on:
      timescaledb-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      ha-ca-init:
        condition: service_completed_successfully
    healthcheck:
      # Both listeners, not just QUIC. The stewards register over the HTTP
      # API, so a healthcheck that only proves :4433 is bound reports the
      # node healthy while :9080 is still closed; StartCluster then starts
      # the stewards, whose first registration attempt is refused and whose
      # retry backoff doubles past the test's wait window.
      test: ["CMD", "sh", "-c", "netstat -ln | grep :4433 && netstat -ln | grep :9080"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      cfgms-test:
        ipv4_address: 172.20.0.11
    profiles:
      - ha

  # Controller Central (us-central region) - gRPC-over-QUIC Transport (Issue #519)
  controller-central:
    container_name: controller-central
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
    ports:
      - "4434:4433/udp"   # gRPC-over-QUIC transport (different host port)
      - "9081:9081"   # HTTP API
    environment:
      CFGMS_NODE_ID: "controller-central"
      CFGMS_NODE_REGION: "us-central"
      # gRPC-over-QUIC Transport (Issue #519: replaces MQTT+QUIC)
      CFGMS_TRANSPORT_LISTEN_ADDR: "0.0.0.0:4433"
      CFGMS_TRANSPORT_USE_CERT_MANAGER: "true"
      CFGMS_HTTP_LISTEN_ADDR: "0.0.0.0:9081"
      # Storage Configuration
      CFGMS_STORAGE_PROVIDER: "database"
      CFGMS_DB_HOST: "timescaledb-test"
      CFGMS_DB_PORT: "5432"
      CFGMS_DB_NAME: "cfgms_ha_test"
      CFGMS_DB_USER: "cfgms_test"
      CFGMS_DB_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      CFGMS_DB_SSLMODE: "disable"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      CFGMS_TIMESCALE_HOST: "timescaledb-test"
      CFGMS_TIMESCALE_PORT: "5432"
      CFGMS_TIMESCALE_DATABASE: "cfgms_ha_test"
      CFGMS_TIMESCALE_USER: "cfgms_test"
      CFGMS_TIMESCALE_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      # HA Configuration
      CFGMS_HA_ENABLED: "true"
      CFGMS_HA_MODE: "cluster"
      # See controller-east for why these carry the internal Raft port.
      CFGMS_HA_EXTERNAL_ADDRESS: "controller-central:9443"
      CFGMS_HA_CLUSTER_NODES: "controller-east:9443,controller-central:9443,controller-west:9443"
      CFGMS_HA_DISCOVERY_METHOD: "static"
      CFGMS_HA_DISCOVERY_INTERVAL: "10s"
      CFGMS_HA_NODE_TIMEOUT: "15s"
      CFGMS_HA_ELECTION_TIMEOUT: "5s"
      # Raft requires ElectionTimeout >= 5x HeartbeatInterval (see controller-east).
      CFGMS_HA_HEARTBEAT_INTERVAL: "1s"
      CFGMS_HA_INTERNAL_IP: "172.20.0.12"
      CFGMS_HA_CA_CERT_PATH: "/app/certs/ca/ca.crt"
      CFGMS_STORAGE_CLUSTER_POSTGRES_DSN: "postgres://cfgms_test:${TIMESCALEDB_PASSWORD}@timescaledb-test:5432/cfgms_ha_test?sslmode=disable"
      CFGMS_STORAGE_CLUSTER_SESSION_HMAC_KEY: "${HA_SESSION_HMAC_KEY}"
      CFGMS_S3_INSTALLER_BUCKET: "cfgms-installers-test"
      CFGMS_S3_INSTALLER_ENDPOINT_URL: "http://minio-test:9000"
      CFGMS_S3_INSTALLER_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      CFGMS_CERT_PATH: "/app/certs"
      CFGMS_DATA_DIR: "/app/data"
      CFGMS_SECRETS_KEY_FILE: "/run/secrets/cfgms-secrets-key"
      CFGMS_METRICS_LISTEN_ADDR: "127.0.0.1:9099"
      CFGMS_EXTERNAL_HOSTNAME: "controller-central"
      CFGMS_EXTERNAL_URL: "https://controller-central:9081"
      CFGMS_API_KEY: "${API_KEY_CENTRAL}"
      CFGMS_SEED_TEST_API_KEYS: "1"
      # Seeds the registration tokens the HA stewards present; without it
      # every steward registration is rejected 401 and no steward joins.
      CFGMS_SEED_TEST_TOKENS: "1"
      # Same rationale as controller-standalone: the ip-trust default
      # quarantines these stewards, and quarantine needs a durable pending
      # store this deployment has none of, so registration answered 503
      # "Registration admission service unavailable".
      CFGMS_REGISTRATION_WORKFLOW: "auto-approve"
      CFGMS_API_KEY_CENTRAL: "test-api-key-central"
    user: root
    # cmd/controller/Dockerfile's ENTRYPOINT runs the binary directly with a
    # default CMD of --config /etc/cfgms/controller.cfg. Wrapping it in a shell
    # keeps that config path and creates CFGMS_LOG_DIR first: the file logging
    # provider does not create its own directory, so these nodes wrote no log
    # records at all and every cluster failure had to be diagnosed from a bare
    # container exit code.
    entrypoint: []
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && exec ./controller --config /etc/cfgms/controller.cfg"]
    volumes:
      - ha_cluster_certs:/app/certs
      - controller_central_data:/app/data
      - ha_cluster_secrets:/app/data/secrets
      - ${CFGMS_SECRETS_KEY_FILE:?set CFGMS_SECRETS_KEY_FILE to an ephemeral test key}:/run/secrets/cfgms-secrets-key:ro
      - ./test/fixtures/ha/controller-ha.cfg:/etc/cfgms/controller.cfg:ro
    depends_on:
      timescaledb-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      ha-ca-init:
        condition: service_completed_successfully
    healthcheck:
      # Both listeners, not just QUIC. The stewards register over the HTTP
      # API, so a healthcheck that only proves :4433 is bound reports the
      # node healthy while :9081 is still closed; StartCluster then starts
      # the stewards, whose first registration attempt is refused and whose
      # retry backoff doubles past the test's wait window.
      test: ["CMD", "sh", "-c", "netstat -ln | grep :4433 && netstat -ln | grep :9081"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      cfgms-test:
        ipv4_address: 172.20.0.12
    profiles:
      - ha

  # Controller West (us-west region) - gRPC-over-QUIC Transport (Issue #519)
  controller-west:
    container_name: controller-west
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
    ports:
      - "4435:4433/udp"   # gRPC-over-QUIC transport (different host port)
      - "9082:9082"   # HTTP API
    environment:
      CFGMS_NODE_ID: "controller-west"
      CFGMS_NODE_REGION: "us-west"
      # gRPC-over-QUIC Transport (Issue #519: replaces MQTT+QUIC)
      CFGMS_TRANSPORT_LISTEN_ADDR: "0.0.0.0:4433"
      CFGMS_TRANSPORT_USE_CERT_MANAGER: "true"
      CFGMS_HTTP_LISTEN_ADDR: "0.0.0.0:9082"
      # Storage Configuration
      CFGMS_STORAGE_PROVIDER: "database"
      CFGMS_DB_HOST: "timescaledb-test"
      CFGMS_DB_PORT: "5432"
      CFGMS_DB_NAME: "cfgms_ha_test"
      CFGMS_DB_USER: "cfgms_test"
      CFGMS_DB_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      CFGMS_DB_SSLMODE: "disable"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      CFGMS_TIMESCALE_HOST: "timescaledb-test"
      CFGMS_TIMESCALE_PORT: "5432"
      CFGMS_TIMESCALE_DATABASE: "cfgms_ha_test"
      CFGMS_TIMESCALE_USER: "cfgms_test"
      CFGMS_TIMESCALE_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      # HA Configuration
      CFGMS_HA_ENABLED: "true"
      CFGMS_HA_MODE: "cluster"
      # See controller-east for why these carry the internal Raft port.
      CFGMS_HA_EXTERNAL_ADDRESS: "controller-west:9443"
      CFGMS_HA_CLUSTER_NODES: "controller-east:9443,controller-central:9443,controller-west:9443"
      CFGMS_HA_DISCOVERY_METHOD: "static"
      CFGMS_HA_DISCOVERY_INTERVAL: "10s"
      CFGMS_HA_NODE_TIMEOUT: "15s"
      CFGMS_HA_ELECTION_TIMEOUT: "5s"
      # Raft requires ElectionTimeout >= 5x HeartbeatInterval (see controller-east).
      CFGMS_HA_HEARTBEAT_INTERVAL: "1s"
      CFGMS_HA_INTERNAL_IP: "172.20.0.13"
      CFGMS_HA_CA_CERT_PATH: "/app/certs/ca/ca.crt"
      CFGMS_STORAGE_CLUSTER_POSTGRES_DSN: "postgres://cfgms_test:${TIMESCALEDB_PASSWORD}@timescaledb-test:5432/cfgms_ha_test?sslmode=disable"
      CFGMS_STORAGE_CLUSTER_SESSION_HMAC_KEY: "${HA_SESSION_HMAC_KEY}"
      CFGMS_S3_INSTALLER_BUCKET: "cfgms-installers-test"
      CFGMS_S3_INSTALLER_ENDPOINT_URL: "http://minio-test:9000"
      CFGMS_S3_INSTALLER_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      CFGMS_CERT_PATH: "/app/certs"
      CFGMS_DATA_DIR: "/app/data"
      CFGMS_SECRETS_KEY_FILE: "/run/secrets/cfgms-secrets-key"
      CFGMS_METRICS_LISTEN_ADDR: "127.0.0.1:9099"
      CFGMS_EXTERNAL_HOSTNAME: "controller-west"
      CFGMS_EXTERNAL_URL: "https://controller-west:9082"
      CFGMS_API_KEY: "${API_KEY_WEST}"
      CFGMS_SEED_TEST_API_KEYS: "1"
      # Seeds the registration tokens the HA stewards present; without it
      # every steward registration is rejected 401 and no steward joins.
      CFGMS_SEED_TEST_TOKENS: "1"
      # Same rationale as controller-standalone: the ip-trust default
      # quarantines these stewards, and quarantine needs a durable pending
      # store this deployment has none of, so registration answered 503
      # "Registration admission service unavailable".
      CFGMS_REGISTRATION_WORKFLOW: "auto-approve"
      CFGMS_API_KEY_WEST: "test-api-key-west"
    user: root
    # cmd/controller/Dockerfile's ENTRYPOINT runs the binary directly with a
    # default CMD of --config /etc/cfgms/controller.cfg. Wrapping it in a shell
    # keeps that config path and creates CFGMS_LOG_DIR first: the file logging
    # provider does not create its own directory, so these nodes wrote no log
    # records at all and every cluster failure had to be diagnosed from a bare
    # container exit code.
    entrypoint: []
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && exec ./controller --config /etc/cfgms/controller.cfg"]
    volumes:
      - ha_cluster_certs:/app/certs
      - controller_west_data:/app/data
      - ha_cluster_secrets:/app/data/secrets
      - ${CFGMS_SECRETS_KEY_FILE:?set CFGMS_SECRETS_KEY_FILE to an ephemeral test key}:/run/secrets/cfgms-secrets-key:ro
      - ./test/fixtures/ha/controller-ha.cfg:/etc/cfgms/controller.cfg:ro
    depends_on:
      timescaledb-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      ha-ca-init:
        condition: service_completed_successfully
    healthcheck:
      # Both listeners, not just QUIC. The stewards register over the HTTP
      # API, so a healthcheck that only proves :4433 is bound reports the
      # node healthy while :9082 is still closed; StartCluster then starts
      # the stewards, whose first registration attempt is refused and whose
      # retry backoff doubles past the test's wait window.
      test: ["CMD", "sh", "-c", "netstat -ln | grep :4433 && netstat -ln | grep :9082"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      cfgms-test:
        ipv4_address: 172.20.0.13
    profiles:
      - ha

  # Steward East (connects to HA controller cluster) - gRPC-over-QUIC (Issue #519)
  steward-east:
    container_name: steward-east
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        STEWARD_CONTROLLER_URL: "https://controller-east:9080"
    environment:
      # gRPC-over-QUIC Transport (Issue #519: replaces MQTT+QUIC)
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_EAST}"
      # Trust anchor for the controller's HTTPS API. Without it registration
      # fails the TLS handshake ("certificate signed by unknown authority")
      # and the steward stays in degraded mode, never joining the cluster.
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    # The steward takes its registration token as a flag; there is no
    # CFGMS_REGISTRATION_TOKEN fallback in cmd/steward. Without this the
    # binary dropped into interactive mode and exited immediately with
    # "failed to read registration token: EOF", so no steward ever joined the
    # cluster. Matches the steward-standalone service below.
    # Root, like the other steward containers here. The steward derives its
    # device identity from a machine ID and falls back to generating one
    # under /var/lib/cfgms when /etc/machine-id is absent, as it is in these
    # images. As the unprivileged `cfgms` user that mkdir fails, the device
    # identity key store is skipped, and registration is rejected with
    # "device_id is required and must be a 64-character lowercase hex string".
    user: root
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - ha_ca_public:/app/controller-certs/ca:ro
    depends_on:
      controller-east:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep steward | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cfgms-test
    profiles:
      - ha

  # Steward Central (connects to HA controller cluster) - gRPC-over-QUIC (Issue #519)
  steward-central:
    container_name: steward-central
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        # controller-central serves its API on 9081, not 9080 (see its
        # CFGMS_HTTP_LISTEN_ADDR and CFGMS_EXTERNAL_URL). Pointing the steward at
        # 9080 made every registration attempt fail with "failed to send
        # registration request" against a port nothing listens on, so only
        # steward-east ever joined the cluster.
        STEWARD_CONTROLLER_URL: "https://controller-central:9081"
    environment:
      # gRPC-over-QUIC Transport (Issue #519: replaces MQTT+QUIC)
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_CENTRAL}"
      # Trust anchor for the controller's HTTPS API. Without it registration
      # fails the TLS handshake ("certificate signed by unknown authority")
      # and the steward stays in degraded mode, never joining the cluster.
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    # The steward takes its registration token as a flag; there is no
    # CFGMS_REGISTRATION_TOKEN fallback in cmd/steward. Without this the
    # binary dropped into interactive mode and exited immediately with
    # "failed to read registration token: EOF", so no steward ever joined the
    # cluster. Matches the steward-standalone service below.
    # Root, like the other steward containers here. The steward derives its
    # device identity from a machine ID and falls back to generating one
    # under /var/lib/cfgms when /etc/machine-id is absent, as it is in these
    # images. As the unprivileged `cfgms` user that mkdir fails, the device
    # identity key store is skipped, and registration is rejected with
    # "device_id is required and must be a 64-character lowercase hex string".
    user: root
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - ha_ca_public:/app/controller-certs/ca:ro
    depends_on:
      controller-central:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep steward | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cfgms-test
    profiles:
      - ha

  # Steward West (connects to HA controller cluster) - gRPC-over-QUIC (Issue #519)
  steward-west:
    container_name: steward-west
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        # controller-west serves its API on 9082; see steward-central above.
        STEWARD_CONTROLLER_URL: "https://controller-west:9082"
    environment:
      # gRPC-over-QUIC Transport (Issue #519: replaces MQTT+QUIC)
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_WEST}"
      # Trust anchor for the controller's HTTPS API. Without it registration
      # fails the TLS handshake ("certificate signed by unknown authority")
      # and the steward stays in degraded mode, never joining the cluster.
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    # The steward takes its registration token as a flag; there is no
    # CFGMS_REGISTRATION_TOKEN fallback in cmd/steward. Without this the
    # binary dropped into interactive mode and exited immediately with
    # "failed to read registration token: EOF", so no steward ever joined the
    # cluster. Matches the steward-standalone service below.
    # Root, like the other steward containers here. The steward derives its
    # device identity from a machine ID and falls back to generating one
    # under /var/lib/cfgms when /etc/machine-id is absent, as it is in these
    # images. As the unprivileged `cfgms` user that mkdir fails, the device
    # identity key store is skipped, and registration is rejected with
    # "device_id is required and must be a 64-character lowercase hex string".
    user: root
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - ha_ca_public:/app/controller-certs/ca:ro
    depends_on:
      controller-west:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep steward | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cfgms-test
    profiles:
      - ha

  # Git Server for HA testing (uses TimescaleDB for storage)
  # Note: This is separate from git-server-test to avoid configuration conflicts
  git-server-ha:
    image: gitea/gitea:1.21
    container_name: cfgms-git-server-ha
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=timescaledb-test:5432
      - GITEA__database__NAME=cfgms_ha_test
      - GITEA__database__USER=cfgms_test
      - GITEA__database__PASSWD=${TIMESCALEDB_PASSWORD}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://git-server-ha:3000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    ports:
      - "3002:3000"  # Use port 3002 to avoid conflict with git-server-test on 3001
    volumes:
      - gitea_ha_data:/data
    depends_on:
      timescaledb-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cfgms-test
    profiles:
      - ha

  # ============================================================================
  # STANDALONE CONTROLLER (Non-HA) - gRPC-over-QUIC Transport (Issue #519)
  # Used for integration testing single-controller functionality
  # Runs alongside HA cluster to validate both architectures in parallel
  # Start with: docker compose --profile ha up (included in HA profile)
  # ============================================================================

  controller-standalone:
    container_name: controller-standalone
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
      args:
        # Compiles in the /api/v1/test/* administration endpoints the integration
        # suite drives. CFGMS_ENABLE_TEST_ENDPOINTS below is the second, runtime
        # gate; without both the routes are absent and every call 404s.
        GO_BUILD_TAGS: cfgms_test_endpoints
    ports:
      - "4436:4433/udp"   # gRPC-over-QUIC transport (CP+DP on single port, Story #515)
      - "8080:9080"    # HTTP API (unique host port to avoid conflict with controller-east)
    environment:
      CFGMS_NODE_ID: "controller-standalone"
      CFGMS_EXTERNAL_HOSTNAME: "controller-standalone"  # Story #312: External hostname for steward connections
      # Issue #3196: admin bundle issuance (./controller --init below) fails
      # closed without this. Same hostname as CFGMS_EXTERNAL_HOSTNAME above,
      # which the cert manager already adds to the server certificate's SANs.
      CFGMS_EXTERNAL_URL: "https://controller-standalone:9080"
      # Unified gRPC-over-QUIC transport (Story #515: replaces separate MQTT+QUIC)
      CFGMS_TRANSPORT_LISTEN_ADDR: "0.0.0.0:4433"
      CFGMS_TRANSPORT_USE_CERT_MANAGER: "true"
      # HTTP API listen address. Story #1919 routed getHTTPListenAddr()
      # through cfg.ListenAddr — DefaultConfig() now defaults to
      # 127.0.0.1:8080 (loopback only, secure-by-default). Docker
      # network sandbox already constrains exposure, so explicitly opt
      # this container into 0.0.0.0:9080 (matches controller-east).
      CFGMS_HTTP_LISTEN_ADDR: "0.0.0.0:9080"
      # Storage Configuration
      CFGMS_STORAGE_PROVIDER: "database"
      CFGMS_DB_HOST: "timescaledb-test"  # Share database with HA cluster
      CFGMS_DB_PORT: "5432"
      CFGMS_DB_NAME: "cfgms_ha_test"
      CFGMS_DB_USER: "cfgms_test"
      CFGMS_DB_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      CFGMS_DB_SSLMODE: "disable"
      # Logging Configuration
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      CFGMS_TIMESCALE_HOST: "timescaledb-test"
      CFGMS_TIMESCALE_PORT: "5432"
      CFGMS_TIMESCALE_DATABASE: "cfgms_ha_test"
      CFGMS_TIMESCALE_USER: "cfgms_test"
      CFGMS_TIMESCALE_PASSWORD: "${TIMESCALEDB_PASSWORD}"
      # Disable HA to run in standalone mode
      CFGMS_HA_ENABLED: "false"
      # Seed well-known test tokens for integration test suites (Issue #700)
      CFGMS_SEED_TEST_TOKENS: "1"
      # Issue #1695: integration tests exercise the full register → mTLS flow.
      # Opt into auto-approve so stewards are not quarantined by the ip-trust default.
      CFGMS_REGISTRATION_WORKFLOW: "auto-approve"
      # Enable test endpoints for integration testing (auth bypass for /api/v1/test/*)
      CFGMS_ENABLE_TEST_ENDPOINTS: "true"
      CFGMS_CERT_PATH: "/app/certs"
      CFGMS_DATA_DIR: "/app/data"
      CFGMS_SECRETS_KEY_FILE: "/run/secrets/cfgms-secrets-key"
      # Required explicitly: the controller fails closed when the private metrics
      # listener has no address, and rejects port 0. Loopback keeps it unreachable
      # from outside the container.
      CFGMS_METRICS_LISTEN_ADDR: "127.0.0.1:9099"
    # Run as root to avoid permission issues, create log dir first
    user: root
    # cmd/controller/Dockerfile declares ENTRYPOINT ["/app/controller"], so a bare
    # command would be appended as controller arguments ("unknown command \"sh\"").
    # Clearing the entrypoint restores shell-form startup — same treatment as
    # fleet-controller below.
    entrypoint: []
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && ./controller --init 2>/dev/null; exec ./controller"]
    volumes:
      - controller_standalone_certs:/app/certs  # Use volume for writable certs
      - controller_standalone_data:/app/data
      # The controller refuses to start without an external secrets key; the host
      # path is generated per test session by scripts/generate-test-credentials.sh.
      - ${CFGMS_SECRETS_KEY_FILE:?set CFGMS_SECRETS_KEY_FILE to an ephemeral test key}:/run/secrets/cfgms-secrets-key:ro
    depends_on:
      timescaledb-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ln | grep :4433"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cfgms-test
    profiles:
      - ha  # Include in HA profile to run everything together

  # ============================================================================
  # Steward - Standalone Test Instance
  # ============================================================================
  # Single steward for testing with controller-standalone
  # Used for Docker integration tests to verify real MQTT+QUIC communication
  # Start with: docker compose --profile ha up (included in HA profile)
  # ============================================================================

  steward-standalone:
    container_name: steward-standalone
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        STEWARD_CONTROLLER_URL: "https://controller-standalone:9080"
    environment:
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_STANDALONE}"
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      # gRPC transport uses TLS auto-negotiated via registration response (no static cert paths needed)
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    # Root, for the same two reasons as the HA stewards: the controller's CA
    # directory is 0700 root-owned private key material, and the steward's
    # device identity falls back to generating a machine ID under /var/lib/cfgms
    # when /etc/machine-id is absent. As the unprivileged `cfgms` user this
    # steward logged "CFGMS_HTTP_CA_CERT_PATH set but file not found, falling
    # through" and "Failed to create device identity key store", then never
    # registered — which is what the controller suite's steward assertions were
    # really failing on.
    user: root
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - steward_standalone_data:/app/data
      - controller_standalone_certs:/app/controller-certs:ro
    tmpfs:
      # Story #315: Use tmpfs for module execution test workspace (writable, fast, ephemeral)
      # Simulates real-world endpoint with writable directory, no permission issues
      # exec flag required for script execution tests
      - /test-workspace:uid=1001,gid=1001,mode=0755,exec
    depends_on:
      controller-standalone:
        condition: service_healthy
    networks:
      - cfgms-test
    profiles:
      - ha  # Include in HA profile to run with controller-standalone

  # ============================================================================
  # Multi-Tenant Stewards - Story 12.5: Multi-Tenant Isolation Testing
  # ============================================================================
  # Three tenant-specific stewards for multi-tenant isolation validation
  # Each connects to controller-standalone with unique tenant ID
  # Used to validate gRPC connection registry isolation and tenant boundary enforcement
  # Start with: docker compose --profile ha up
  # ============================================================================

  steward-tenant1:
    container_name: steward-tenant1
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        STEWARD_CONTROLLER_URL: "https://controller-standalone:9080"
    environment:
      CFGMS_TENANT_ID: "tenant1"  # Story 12.5: Tenant isolation
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_TENANT1}"
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - steward_tenant1_data:/app/data
      - ./test/module-execution:/test-workspace:rw
      - controller_standalone_certs:/app/controller-certs:ro
    depends_on:
      controller-standalone:
        condition: service_healthy
    networks:
      - cfgms-test
    profiles:
      - ha

  steward-tenant2:
    container_name: steward-tenant2
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        STEWARD_CONTROLLER_URL: "https://controller-standalone:9080"
    environment:
      CFGMS_TENANT_ID: "tenant2"  # Story 12.5: Tenant isolation
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_TENANT2}"
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - steward_tenant2_data:/app/data
      - ./test/module-execution:/test-workspace:rw
      - controller_standalone_certs:/app/controller-certs:ro
    depends_on:
      controller-standalone:
        condition: service_healthy
    networks:
      - cfgms-test
    profiles:
      - ha

  steward-tenant3:
    container_name: steward-tenant3
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
      args:
        STEWARD_CONTROLLER_URL: "https://controller-standalone:9080"
    environment:
      CFGMS_TENANT_ID: "tenant3"  # Story 12.5: Tenant isolation
      CFGMS_REGISTRATION_TOKEN: "${REG_TOKEN_TENANT3}"
      CFGMS_HTTP_CA_CERT_PATH: "/app/controller-certs/ca/ca.crt"
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
    command: ["sh", "-c", "./steward --regtoken $$CFGMS_REGISTRATION_TOKEN"]
    volumes:
      - steward_tenant3_data:/app/data
      - ./test/module-execution:/test-workspace:rw
      - controller_standalone_certs:/app/controller-certs:ro
    depends_on:
      controller-standalone:
        condition: service_healthy
    networks:
      - cfgms-test
    profiles:
      - ha

  # ============================================================================
  # TRUE Standalone Steward - Tier 1: QUICK_START.md Option A Testing
  # ============================================================================
  # Runs steward in true standalone mode with local config file
  # NO controller connection - validates QUICK_START.md Option A workflow
  # Tests: File/directory creation, module execution, idempotency
  # Start with: docker compose --profile standalone up
  # ============================================================================

  steward-true-standalone:
    container_name: steward-true-standalone
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile
    environment:
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      CFGMS_LOG_LEVEL: "info"
    # Run as root to avoid permission issues, create log dir first
    user: root
    # cmd/steward exposes cobra flags: --config enables standalone mode. The
    # previous single-dash form made cobra treat the path as a subcommand and
    # the container exited immediately with `unknown command
    # "/app/config/standalone.yaml"`, so no resource in standalone.yaml was ever
    # applied and every file/permission assertion in test/integration/standalone
    # failed against a workspace that was never written. -log-level and
    # -log-provider are not steward flags at all; both are environment settings
    # above.
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && ./steward --config /app/config/standalone.yaml"]
    volumes:
      - ./test/integration/standalone/config:/app/config:ro  # Mount config directory
      - steward_true_standalone_data:/app/data
      - steward_true_standalone_workspace:/test-workspace:rw  # Workspace for file/directory tests
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep steward | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cfgms-test
    profiles:
      - standalone  # NEW profile for Tier 1 testing

  # ============================================================================
  # FLEET TEST SERVICES
  # 1 controller + 2 Debian stewards for fleet test framework validation
  # Start with: docker compose --profile fleet -f docker-compose.test.yml up -d
  # ============================================================================

  fleet-controller:
    container_name: fleet-controller
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
      args:
        # Compiles in the /api/v1/test/* administration endpoints the fleet suite
        # drives. CFGMS_ENABLE_TEST_ENDPOINTS below is the second, runtime gate;
        # without both the routes are absent and every call 404s.
        GO_BUILD_TAGS: cfgms_test_endpoints
      x-bake:
        cache-from:
          - type=gha,scope=cfgms-fleet-controller
        cache-to:
          - type=gha,mode=max,scope=cfgms-fleet-controller
    ports:
      - "4437:4433/udp"   # gRPC-over-QUIC transport
      - "8090:9080"       # HTTP API
    environment:
      CFGMS_SEED_TEST_TOKENS: "1"
      # Issue #1695: fleet stewards must complete the full register → mTLS flow.
      # Opt into auto-approve so they are not quarantined by the ip-trust default.
      CFGMS_REGISTRATION_WORKFLOW: "auto-approve"
      CFGMS_ENABLE_TEST_ENDPOINTS: "true"
      CFGMS_TRANSPORT_USE_CERT_MANAGER: "true"
      # Transport listen addr is 0.0.0.0:4433; the controller rewrites the
      # 0.0.0.0 bind address in the registration response to this hostname so
      # stewards on the cfgms-fleet network connect to "fleet-controller:4433"
      # instead of "localhost:4433". Without this the steward connects to its
      # own loopback, fails the gRPC-over-QUIC handshake, and exits 1.
      CFGMS_EXTERNAL_HOSTNAME: "fleet-controller"
      # Same Story #1919 rationale as controller-standalone: getHTTPListenAddr()
      # now respects cfg.ListenAddr, and DefaultConfig() defaults to the secure
      # 127.0.0.1:8080 loopback. The mounted controller.cfg sets ListenAddr
      # implicitly via legacy mqtt/quic fields that no longer drive HTTP bind.
      # Explicitly opt the fleet container into 0.0.0.0:9080 so stewards on the
      # cfgms-fleet network can reach the registration endpoint.
      CFGMS_HTTP_LISTEN_ADDR: "0.0.0.0:9080"
      CFGMS_LOG_LEVEL: "info"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      # Issue #1709: seed installer API key for E2E install-package flow test.
      # Issue #1948: seed upgrade test API key for E2E fleet upgrade tests.
      CFGMS_SEED_TEST_API_KEYS: "1"
      CFGMS_API_KEY_INSTALLER: "installer-test-key"
      CFGMS_API_KEY_UPGRADE_TEST: "cfgms-upgrade-test-key"
      # Issue #1948: ExternalURL used by dispatch handler to build steward download URLs.
      # Must match the hostname reachable by fleet stewards on the cfgms-fleet network.
      CFGMS_EXTERNAL_URL: "https://fleet-controller:9080"
      # Issue #1948: Test Ed25519 publisher key (public key from zero-seed).
      # Allows E2E upgrade tests to sign binaries with the known zero-seed private key.
      # Active only when CFGMS_SEED_TEST_API_KEYS=1.
      CFGMS_TEST_STEWARD_PUBLISHER_KEY: "O2onvM62pC1io6jQKm8Nc2UyFXcd4kOmOsBIoYtZ2ik="
      CFGMS_SECRETS_KEY_FILE: "/run/secrets/cfgms-secrets-key"
      # Required explicitly: the controller fails closed when the private metrics
      # listener has no address, and rejects port 0. Loopback keeps it unreachable
      # from outside the container.
      CFGMS_METRICS_LISTEN_ADDR: "127.0.0.1:9099"
    user: root
    entrypoint: []
    command: ["sh", "-c", "mkdir -p /tmp/cfgms /app/data && ./controller --init 2>/dev/null; exec ./controller"]
    volumes:
      - fleet_controller_certs:/app/certs
      - fleet_controller_data:/app/data
      - ./test/e2e/fleet/configs/controller.cfg:/app/controller.cfg:ro
      - ${CFGMS_SECRETS_KEY_FILE:?set CFGMS_SECRETS_KEY_FILE to an ephemeral test key}:/run/secrets/cfgms-secrets-key:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ln | grep :4433"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cfgms-fleet
    profiles:
      - fleet

  fleet-steward-1:
    container_name: fleet-steward-1
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile.debian
      args:
        STEWARD_CONTROLLER_URL: "https://fleet-controller:9080"
      x-bake:
        cache-from:
          - type=gha,scope=cfgms-fleet-steward-debian
        cache-to:
          - type=gha,mode=max,scope=cfgms-fleet-steward-debian
    environment:
      CFGMS_REGISTRATION_TOKEN: "dockertest_fleet_child_a"
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      # Issue #1948: same test publisher key as fleet-controller so E2E upgrade tests
      # can sign binaries with the zero-seed private key and have them verify on the steward.
      CFGMS_TEST_STEWARD_PUBLISHER_KEY: "O2onvM62pC1io6jQKm8Nc2UyFXcd4kOmOsBIoYtZ2ik="
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && while true; do ./steward --regtoken $$CFGMS_REGISTRATION_TOKEN && break; echo 'steward exited, retrying in 5s...'; sleep 5; done"]
    volumes:
      - fleet_steward1_data:/app/data
    tmpfs:
      - /test-workspace:uid=1001,gid=1001,mode=0755,exec
    depends_on:
      fleet-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep steward | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cfgms-fleet
    profiles:
      - fleet

  fleet-steward-2:
    container_name: fleet-steward-2
    build:
      context: .
      dockerfile: cmd/steward/Dockerfile.debian
      args:
        STEWARD_CONTROLLER_URL: "https://fleet-controller:9080"
      x-bake:
        cache-from:
          - type=gha,scope=cfgms-fleet-steward-debian
        cache-to:
          - type=gha,mode=max,scope=cfgms-fleet-steward-debian
    environment:
      CFGMS_REGISTRATION_TOKEN: "dockertest_fleet_child_b"
      CFGMS_LOG_LEVEL: "debug"
      CFGMS_LOG_PROVIDER: "file"
      CFGMS_LOG_DIR: "/tmp/cfgms"
      CFGMS_TEST_STEWARD_PUBLISHER_KEY: "O2onvM62pC1io6jQKm8Nc2UyFXcd4kOmOsBIoYtZ2ik="
    command: ["sh", "-c", "mkdir -p /tmp/cfgms && while true; do ./steward --regtoken $$CFGMS_REGISTRATION_TOKEN && break; echo 'steward exited, retrying in 5s...'; sleep 5; done"]
    volumes:
      - fleet_steward2_data:/app/data
    tmpfs:
      - /test-workspace:uid=1001,gid=1001,mode=0755,exec
    depends_on:
      fleet-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep steward | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cfgms-fleet
    profiles:
      - fleet

  # OpenBao dev-mode instance for secrets provider integration tests.
  # Uses host port 8201 to avoid collision with any local Vault/OpenBao on 8200.
  # Start with: docker compose --profile openbao -f docker-compose.test.yml up -d openbao-test
  openbao-test:
    image: openbao/openbao:latest
    container_name: cfgms-openbao-test
    command: server -dev -dev-root-token-id=root
    environment:
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8201:8200"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cfgms-test
    profiles:
      - openbao

  # MinIO S3-compatible object store for blob migrator integration tests and for
  # the HA cluster, whose controllers require an S3 installer artifact store in
  # cluster mode (features/controller/server/server.go assertClusterBackendsReady).
  # Start with: docker compose --profile blob-migrate -f docker-compose.test.yml up -d minio-test
  minio-test:
    image: minio/minio:latest
    container_name: cfgms-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"  # S3 API — use non-standard port to avoid conflicts
      - "9003:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cfgms-test
    profiles:
      - blob-migrate
      - ha

volumes:
  postgres_test_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m
  timescaledb_test_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m
  gitea_test_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
  gitea_ha_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
  controller_standalone_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
  controller_standalone_certs:
    driver: local
    # Story #294: CA must persist across container restarts (no tmpfs)
    # This ensures client certificates remain valid when controller restarts
  # Shared CA and server certificate for the three HA controllers. Not tmpfs for
  # the same reason as controller_standalone_certs, and shared rather than
  # per-node because Raft peer mTLS requires one common trust root.
  ha_cluster_certs:
    driver: local
  # The HA data directories are deliberately NOT tmpfs.
  #
  # /app/data/secrets holds the envelope key material that the SOPS secret store
  # uses to decrypt secrets it keeps in the shared cluster database. StartCluster
  # recreates these containers for every test, and a tmpfs volume is empty again
  # on each recreate — so the key material vanished while the database kept the
  # ciphertext, and every node died with "load audit HMAC key: failed to decrypt
  # secret: secret ciphertext authentication failed" on the second test onward.
  # Shared secret-store material for the cluster.
  #
  # The SOPS secret store keeps its ciphertext in the shared cluster database
  # but its envelope key material under /app/data/secrets. With a per-node
  # directory each node could only decrypt secrets it had written itself: a
  # fresh database let all three nodes generate and store the audit HMAC key
  # concurrently, and on the next start every node failed with "secret
  # ciphertext authentication failed" against whichever write landed last.
  # Cluster-wide secrets in a shared database require cluster-wide key material.
  ha_cluster_secrets:
    driver: local
  # Public CA certificate only, published by ha-ca-init for the stewards.
  ha_ca_public:
    driver: local
  ha_ca_init_data:
    driver: local
  controller_east_data:
    driver: local
  controller_central_data:
    driver: local
  controller_west_data:
    driver: local
  steward_standalone_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  steward_tenant1_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  steward_tenant2_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  steward_tenant3_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  steward_true_standalone_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  steward_true_standalone_workspace:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
  fleet_controller_certs:
    driver: local
    # CA must persist across container restarts (no tmpfs)
    # Stewards hold client certs issued by this CA — cert validity requires persistence
    # Mounted by the controller only — never by stewards (holds ca.key).
  fleet_controller_data:
    driver: local
    # SQLite, flat-file state, and the admin bundle must survive controller
    # restart/recreation alongside the persistent CA.
  fleet_steward1_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  fleet_steward2_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m

networks:
  cfgms-test:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    name: cfgms-test  # Explicit network name to avoid name conflicts
  cfgms-fleet:
    driver: bridge
    name: cfgms-fleet  # Isolated network for fleet test services
