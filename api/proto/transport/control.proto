syntax = "proto3";

package cfgms.transport;

option go_package = "github.com/cfgis/cfgms/api/proto/transport";

import "google/protobuf/timestamp.proto";

// CommandType enumerates the types of commands a controller sends to a steward.
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SYNC_CONFIG = 1;
  COMMAND_TYPE_SYNC_DNA = 2;
  COMMAND_TYPE_CONNECT_DATAPLANE = 3;
  COMMAND_TYPE_EXECUTE_TASK = 4;
  COMMAND_TYPE_SHUTDOWN = 5;
  COMMAND_TYPE_VALIDATE_CONFIG = 6;
  COMMAND_TYPE_RECONNECT = 7;
  COMMAND_TYPE_EXECUTE_SCRIPT = 8; // Issue #1669/#1992: controller dispatches a signed script execution to a steward
  COMMAND_TYPE_PUSH_SIGNING_CERT = 9; // Issue #1817: controller pushes current signing cert on every steward connect
  COMMAND_TYPE_PUSH_STEWARD_BINARY = 10; // Issue #1943: controller pushes a new steward binary for self-upgrade
  COMMAND_TYPE_RELAY_RESPONSE = 11;      // Issue #1994: controller sends relay response back to steward relay goroutine
  // Issue #2760: steward dials out Terminal RPC and bridges to a local PTY.
  // Command.params keys: session_id (string), shell (string), cols (int32), rows (int32).
  COMMAND_TYPE_OPEN_TERMINAL = 12;
  // Issue #3104 (ADR-024 Amendment 1): controller pushes the resolved observe-module
  // set back to the steward after receiving EventObserveSweepRequest.
  // Command.params keys: "modules" (JSON array of ObserveModuleSpec objects).
  COMMAND_TYPE_OBSERVE_MODULES = 13;
}

// EventType enumerates the types of events a steward emits to a controller.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_CONFIG_APPLIED = 1;
  EVENT_TYPE_DNA_SYNCED = 2;
  EVENT_TYPE_TASK_COMPLETED = 3;
  EVENT_TYPE_TASK_FAILED = 4;
  EVENT_TYPE_ERROR = 5;
  EVENT_TYPE_COMMAND_RECEIVED = 6;  // Issue #1948: steward acknowledges a dispatched command
  EVENT_TYPE_COMMAND_COMPLETED = 7; // Issue #1948: command handler succeeded (drives upgrade commit)
  EVENT_TYPE_COMMAND_FAILED = 8;    // Issue #1948: command handler failed (drives upgrade failure)
  EVENT_TYPE_SCRIPT_COMPLETED = 9;  // Issue #1997: execute_script finished (drives ad-hoc run completion)
  // Issue #1997: the following events are also published steward->controller over the
  // wire and were silently collapsing to UNSPECIFIED without an enum value.
  EVENT_TYPE_DNA_CHANGED = 10;        // steward DNA attributes changed (controller routes to handleDNAEvent)
  EVENT_TYPE_RELAY_REQUEST = 11;      // steward relays a script's REST call to the controller
  EVENT_TYPE_UPGRADE_DOWNLOADED = 12; // steward.upgrade.downloaded
  EVENT_TYPE_UPGRADE_SWAPPED = 13;    // steward.upgrade.swapped
  EVENT_TYPE_UPGRADE_COMMITTED = 14;  // steward.upgrade.committed
  EVENT_TYPE_UPGRADE_ROLLED_BACK = 15; // steward.upgrade.rolled_back
  // Issue #3104 (ADR-024 Amendment 1): steward initiates a Tier-2 whole-domain
  // observe sweep by publishing baseline DNA; the controller responds with
  // COMMAND_TYPE_OBSERVE_MODULES carrying the resolved module set.
  EVENT_TYPE_OBSERVE_SWEEP_REQUEST = 16;
}

// Severity is used by both Event and LogEntry to indicate importance level.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_CRITICAL = 4;
}

// StewardStatus enumerates the health states a steward can report.
enum StewardStatus {
  STEWARD_STATUS_UNSPECIFIED = 0;
  STEWARD_STATUS_HEALTHY = 1;
  STEWARD_STATUS_DEGRADED = 2;
  STEWARD_STATUS_ERROR = 3;
  STEWARD_STATUS_DISCONNECTED = 4;
}

// ControlMessage is the envelope for all C2 traffic on the ControlChannel stream.
message ControlMessage {
  oneof payload {
    Command command = 1;
    Event event = 2;
    Heartbeat heartbeat = 3;
    Response response = 4;
  }
}

// Command is sent from controller to steward via ControlChannel.
message Command {
  string id = 1;
  CommandType type = 2;
  string steward_id = 3;
  string tenant_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  map<string, string> params = 6;
  int32 priority = 7;
  // term is the Raft term at which this command was published (#3390).
  // Wire-compatible additive field: old stewards that do not understand it
  // silently ignore the unknown field number. Enforcement is added in #3436.
  uint64 term = 8;
}

// Event is sent from steward to controller via ControlChannel.
message Event {
  string id = 1;
  EventType type = 2;
  string steward_id = 3;
  string tenant_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  string command_id = 6;    // correlation to originating command
  map<string, string> details = 7;
  Severity severity = 8;
}

// Heartbeat is sent from steward to controller via ControlChannel.
message Heartbeat {
  string steward_id = 1;
  string tenant_id = 2;
  StewardStatus status = 3;
  google.protobuf.Timestamp timestamp = 4;
  map<string, string> metrics = 5;
  string version = 6;
  string dna_hash = 7;      // for hash-based sync detection
  int32 active_sessions = 8;    // number of active control-channel streams (1 when connected, 0 otherwise)
  string connection_state = 9;  // steward connection state ("connected", "disconnected", "connecting", "reconnecting")
}

// Response is sent from steward to controller for command acknowledgment.
message Response {
  string command_id = 1;
  string steward_id = 2;
  bool success = 3;
  string message = 4;
  google.protobuf.Timestamp timestamp = 5;
  map<string, string> details = 6;
}
