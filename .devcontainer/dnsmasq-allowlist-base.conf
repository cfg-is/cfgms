# Base DNS allowlist for agent containers -- everything that is NOT a model
# provider (Issue #3932, epic #3927's per-harness egress isolation). Loaded
# by every container regardless of which harness (or none) it launched
# with: GitHub, the Go toolchain, package registries, and the security
# scanners this repo's own CI runs inside an agent container.
#
# init-firewall.sh combines this file with exactly one per-harness fragment
# from dnsmasq-allowlist.d/ -- see that script and the fragments themselves
# for the harness-selection rule. This file alone is never sufficient to
# reach any model provider API.
#
# No default server= and no-resolv means unlisted domains get REFUSED
# instantly. Do NOT use address=/#/ -- it returns 0.0.0.0 which causes
# connection hangs.

# --- GitHub (API, git push, asset downloads) ---
server=/github.com/9.9.9.9
server=/githubusercontent.com/9.9.9.9
server=/githubstatus.com/9.9.9.9
# GitHub Actions workflow logs redirect to Azure blob storage (productionresultssa*.blob.core.windows.net).
# Required for fix-pr agents to fetch failing-check log tails (Issue #854 AC7).
server=/blob.core.windows.net/9.9.9.9

# --- Go toolchain (module proxy, checksum DB) ---
server=/golang.org/9.9.9.9
server=/googleapis.com/9.9.9.9

# --- Package registries ---
server=/npmjs.org/9.9.9.9
server=/ghcr.io/9.9.9.9

# --- Security scanners (Trivy, Nancy, truffleHog) ---
server=/aquasecurity.github.io/9.9.9.9
server=/ossindex.sonatype.org/9.9.9.9
server=/trufflesecurity.com/9.9.9.9
# Trivy vulnerability DB is hosted on mirror.gcr.io (Google Container Registry mirror).
# Without this entry dnsmasq returns NXDOMAIN and trivy exits with an init error
# that was previously mis-reported as a vulnerability finding (Issue #1402).
server=/gcr.io/9.9.9.9

# dnsmasq settings -- global, so they live once here rather than being
# duplicated in every per-harness fragment.
no-resolv
no-hosts
cache-size=256
