# OpenCode harness egress fragment (Issue #3936, epic #3927's per-harness
# egress isolation, C2). init-firewall.sh selects this fragment when
# launch-investigator's `--harness opencode` has set
# CFGMS_SECURITY_REVIEW_HARNESS=opencode. Scoped to exactly what the
# OpenCode CLI's own account/subscription flow needs -- login and the
# hosted multi-model gateway a logged-in session actually talks to -- never
# any other harness's domain, and never a third-party model provider's own
# domain reached under a user-supplied API key.
#
# Confirmed against the OpenCode CLI actually installed for this story
# (`opencode-ai@1.18.29`): `opencode providers list --print-logs
# --log-level DEBUG` prints its session credential path as
# "~/.local/share/opencode/auth.json" (mounted read-only by
# agent-dispatch.sh's --harness opencode case), and the compiled binary's
# own literal strings (via `strings`) show its account/gateway endpoints
# entirely under one apex domain: `opencode.ai/auth` (login), and
# `opencode.ai/zen/v1` / `opencode.ai/zen/go/v1` (the "OpenCode Zen" hosted
# multi-model gateway `opencode/<model>` requests resolve through --
# `opencode models` lists Zen catalog entries under exactly that provider
# id). `api.opencode.ai`, `app.opencode.ai`, `models.opencode.ai`, and
# `dev.opencode.ai` are also literal strings in the binary, but need no
# separate entry: dnsmasq's `server=/<domain>/` directive matches a
# domain's subdomains too (verified directly against this allowlist's own
# dnsmasq build), so the single `opencode.ai` entry below already covers
# every one of them.
#
# Every OTHER provider domain the OpenCode CLI can reach (api.moonshot.ai,
# dashscope.aliyuncs.com, openrouter.ai, zenmux.ai, and more -- all literal
# strings in the same binary) is deliberately NOT here. Those serve a user
# configuring a THIRD-PARTY provider directly with their OWN API key or
# OAuth session -- a completely different auth mechanism from the single
# OpenCode Zen account session `--harness opencode` mounts, and this
# harness's roster entries are always bare Zen model ids (`opencode:<id>`),
# never a `provider/model` string naming one of those other providers.
# Adding any of them here would open egress this harness never needs and
# no roster entry can ever legitimately reach.
#
# Combined with dnsmasq-allowlist-base.conf by init-firewall.sh -- never
# loaded alone.
server=/opencode.ai/9.9.9.9
