# Ollama Cloud harness egress fragment (Issue #3976, epic #3975, epic
# #3927's per-harness egress isolation, C2). init-firewall.sh selects this
# fragment when launch-investigator's `--harness ollama` has set
# CFGMS_SECURITY_REVIEW_HARNESS=ollama. Scoped to exactly what the Ollama
# CLI's own `ollama signin` subscription session needs to reach a Cloud
# model -- never a local-inference domain (there are none; local inference
# talks only to `127.0.0.1`, the in-container daemon this lane starts), and
# never any other harness's domain.
#
# Confirmed by static inspection of the pinned CLI binary (`ollama`
# v0.33.3, the `ARG OLLAMA_CLI_VERSION` pinned in `.devcontainer/Dockerfile`
# at the time this fragment was written): downloaded the same release
# tarball URL the Dockerfile pins, extracted `bin/ollama` only, and ran
# `strings` over it -- no live authenticated Cloud turn was available or
# needed for this evidence (no `ollama signin` session exists in a dev
# agent container, and the domain set is a static property of the compiled
# binary, not of any one turn).
#
# Two literal apex domains appear, and both are needed:
#
# - `ollama.com` -- the Cloud/account apex. Literal strings in the binary:
#   `https://ollama.com/connect?name=%s&key=%s` (the `ollama signin` device
#   flow), `You are not signed in to ollama.com`, `You need to be signed in
#   to Ollama to run Cloud models.` (the exact unauthenticated-Cloud-call
#   message this lane's own `ollama_lane.py` treats as a synthetic failure,
#   never a clean pass), `https://ollama.com/api/web_search`,
#   `https://ollama.com/api/experimental/model-recommendations`. All
#   observed paths sit under this one apex; no subdomain of `ollama.com`
#   (e.g. `api.ollama.com`, `auth.ollama.com`) appears anywhere in the
#   binary, so the bare apex is both necessary and sufficient.
#
# - `registry.ollama.ai` -- a SEPARATE apex from `ollama.com` (dnsmasq's
#   `server=/<domain>/` directive matches a domain's own subdomains, never a
#   different registrable domain -- the same subdomain property
#   `opencode.conf`'s header documents, applied here to two distinct
#   apexes), so it needs its own entry rather than being assumed covered by
#   the `ollama.com` line above. Confirmed as a real, referenced host: the
#   literal string `registry.ollama.ai` sits immediately adjacent to
#   `https://ollama.com` and `pulling cloud stub` in the binary's string
#   table, and `failed to pull cloud stub` appears as its own literal
#   nearby -- consistent with a `:cloud` model pull still resolving a
#   manifest through the registry even though inference itself runs on
#   Ollama's Cloud backend. The narrowest form that covers exactly this
#   apex and nothing wider is used (`server=/registry.ollama.ai/`), rather
#   than opening the whole `ollama.ai` apex, which no observed string in
#   the binary needs.
#
# No other Ollama-owned domain is here. Local model files, GPU runner
# libraries, and the `ollama serve` HTTP API are all local
# (`127.0.0.1`/loopback, already reachable with no allowlist entry) --
# out of scope for this story entirely (see the issue's "Out of Scope:
# Local (non-`:cloud`) Ollama models"). Every OpenAI-, Claude-, or
# ChatGPT-flavored string this same binary also carries (the CLI can launch
# several other agent tools' installers) belongs to unrelated,
# never-invoked code paths in this harness -- this lane runs `ollama run
# <model>` and nothing else, so a domain no such invocation can ever reach
# is deliberately excluded, exactly as `codex.conf` excludes
# `api.openai.com`.
#
# Combined with dnsmasq-allowlist-base.conf by init-firewall.sh -- never
# loaded alone.
server=/ollama.com/9.9.9.9
server=/registry.ollama.ai/9.9.9.9
