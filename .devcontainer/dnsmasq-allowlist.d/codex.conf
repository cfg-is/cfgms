# Codex harness egress fragment (Issue #3935, epic #3927's per-harness
# egress isolation, C2). init-firewall.sh selects this fragment when
# launch-investigator's `--harness codex` has set
# CFGMS_SECURITY_REVIEW_HARNESS=codex. Scoped to exactly what the Codex CLI's
# own ChatGPT-subscription auth flow needs -- OAuth token refresh and the
# model-invocation backend a ChatGPT-plan login actually talks to -- never
# any other harness's domain, and never `api.openai.com`.
#
# Confirmed against the Codex CLI actually installed for this story
# (`@openai/codex@0.153.4`): its compiled binary embeds these two hosts as
# literal endpoints for the OAuth/ChatGPT-login path --
# `https://auth.openai.com/oauth/token` (and `/oauth/revoke`,
# `/api/accounts`) for refreshing the session `~/.codex/auth.json` holds, and
# `https://chatgpt.com/backend-api` (plus `/backend-api/codex` and
# `/oauth/codex/client.json`) for the actual model turn once authenticated
# via ChatGPT rather than a raw API key.
#
# `api.openai.com` is deliberately NOT here. That is the domain the deleted
# REST `openai.py` lane (Issue #3933) needed for its API-key HTTP calls, and
# this lane authenticates a completely different way -- the mounted
# ChatGPT-subscription session, never an API key. Observed directly in this
# environment: an unauthenticated `codex exec` run defaults to the "openai"
# API-key provider and fails DNS resolution against
# `wss://api.openai.com/v1/responses`, under the exact base+claude.conf
# allowlist this container runs today -- i.e. `api.openai.com` is not, and
# must not become, reachable from a Codex lane container. Adding it here
# would silently reinstate the deleted REST lane's egress under a different
# story's name; this fragment's whole point is that it does not.
#
# Combined with dnsmasq-allowlist-base.conf by init-firewall.sh -- never
# loaded alone.
server=/auth.openai.com/9.9.9.9
server=/chatgpt.com/9.9.9.9
