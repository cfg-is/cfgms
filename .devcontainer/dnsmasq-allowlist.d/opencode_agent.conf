# opencode_agent harness egress fragment (Issue #4293). init-firewall.sh
# selects this fragment when launch-investigator's `--harness opencode_agent`
# has set CFGMS_SECURITY_REVIEW_HARNESS=opencode_agent.
#
# The opencode_agent finder lane runs OpenCode, but OpenCode talks only to the
# in-container ollama daemon on 127.0.0.1 (`lanes/agentic_verifier_runner.py`,
# OLLAMA_BASE_URL). It never calls an OpenCode-hosted provider, so
# `opencode.ai` is deliberately absent. The daemon signs its Cloud requests
# with the mounted `ollama signin` keypair and needs exactly what the `ollama`
# harness needs -- see ollama.conf for the static-inspection evidence behind
# these two domains. Kept as its own file rather than a symlink so a change to
# one harness's egress is a visible change to that harness's file.
#
# Combined with dnsmasq-allowlist-base.conf by init-firewall.sh -- never
# loaded alone.
server=/ollama.com/9.9.9.9
server=/registry.ollama.ai/9.9.9.9
