# Claude harness egress fragment (Issue #3932, epic #3927's contract C2).
# init-firewall.sh selects this fragment when launch-investigator's
# `--harness claude` has set CFGMS_SECURITY_REVIEW_HARNESS=claude. Scoped to
# exactly what the Claude Code harness itself needs -- OAuth, API traffic,
# and its own error reporting/remote control -- never the other REST lanes'
# provider domains (api.openai.com, ollama.com), which a Claude-harness lane
# has no legitimate reason to reach. That narrowing is the one real
# cross-harness bleed this story's egress split closes: a single investigator
# image with the harness selected at launch would otherwise let every lane
# resolve every provider's domain regardless of which one it authenticates to.
#
# Combined with dnsmasq-allowlist-base.conf by init-firewall.sh -- never
# loaded alone.
server=/anthropic.com/9.9.9.9
server=/claude.ai/9.9.9.9
server=/claude.com/9.9.9.9
server=/sentry.io/9.9.9.9
