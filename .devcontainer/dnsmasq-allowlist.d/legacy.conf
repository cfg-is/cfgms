# Legacy (no --harness) provider egress fragment (Issue #3932, epic #3927's
# per-harness egress isolation). init-firewall.sh selects this fragment
# whenever no harness value is supplied -- every existing dev/review/fix
# agent container, plan mode's own untouched `claude -p` invocation, and the
# three pre-#3932 REST finder lanes (anthropic-opus5, openai-gpt56-sol,
# ollama-qwen) all launch this way today, so this fragment holds exactly
# the union of provider domains dnsmasq-allowlist.conf granted them before
# this story split it. STORY-5b retires this fragment once the REST lanes
# and their non-harness launches are gone.
#
# Combined with dnsmasq-allowlist-base.conf by init-firewall.sh -- never
# loaded alone.

# --- Anthropic (Claude API + OAuth + remote-control) ---
server=/anthropic.com/9.9.9.9
server=/claude.ai/9.9.9.9
server=/claude.com/9.9.9.9
server=/sentry.io/9.9.9.9

# --- OpenAI (finder lane, Story S7) ---
server=/api.openai.com/9.9.9.9

# --- Ollama Cloud (finder lane, Story S8) ---
# ollama.com serves both the native API (/api) and the OpenAI-compatible
# endpoint (/v1) from the bare apex -- Ollama's own docs name no dedicated
# API subdomain, so the apex is already the tightest label available.
server=/ollama.com/9.9.9.9
