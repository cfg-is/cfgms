# DNS allowlist for agent containers.
# Only these domains (and their subdomains) can be resolved.
# All other queries return NXDOMAIN.
#
# To add a domain: add a server=/<domain>/<upstream> line below.
#
# No longer baked into the image (Issue #3932, epic #3927's per-harness
# egress isolation): the Dockerfile now bakes dnsmasq-allowlist-base.conf
# plus the per-harness fragments under dnsmasq-allowlist.d/, and
# init-firewall.sh loads the base plus exactly one fragment at launch. This
# file's combined domain set is preserved verbatim as the union of
# dnsmasq-allowlist-base.conf and dnsmasq-allowlist.d/claude.conf -- the
# fragment selected by default and for every existing dev/review/fix agent
# container (Issue #3933 retired the old "legacy" fragment, which existed
# only for the three REST finder lanes that story deletes, along with those
# lanes' provider domains from every fragment and this file) -- and is
# kept here, unbaked, purely so dnsmasq-allowlist_test.sh keeps exercising
# it as a fixed regression fixture -- it is not read by any running
# container.

# No default server= and no-resolv means unlisted domains get REFUSED instantly.
# Do NOT use address=/#/ — it returns 0.0.0.0 which causes connection hangs.

# --- Anthropic (Claude API + OAuth + remote-control) ---
server=/anthropic.com/9.9.9.9
server=/claude.ai/9.9.9.9
server=/claude.com/9.9.9.9
server=/sentry.io/9.9.9.9

# --- GitHub (API, git push, asset downloads) ---
server=/github.com/9.9.9.9
server=/githubusercontent.com/9.9.9.9
server=/githubstatus.com/9.9.9.9
# GitHub Actions workflow logs redirect to Azure blob storage (productionresultssa*.blob.core.windows.net).
# Required for fix-pr agents to fetch failing-check log tails (Issue #854 AC7).
server=/blob.core.windows.net/9.9.9.9

# --- Go toolchain (module proxy, checksum DB) ---
server=/golang.org/9.9.9.9
server=/googleapis.com/9.9.9.9

# --- Package registries ---
server=/npmjs.org/9.9.9.9
server=/ghcr.io/9.9.9.9

# --- Security scanners (Trivy, Nancy, truffleHog) ---
server=/aquasecurity.github.io/9.9.9.9
server=/ossindex.sonatype.org/9.9.9.9
server=/trufflesecurity.com/9.9.9.9
# Trivy vulnerability DB is hosted on mirror.gcr.io (Google Container Registry mirror).
# Without this entry dnsmasq returns NXDOMAIN and trivy exits with an init error
# that was previously mis-reported as a vulnerability finding (Issue #1402).
server=/gcr.io/9.9.9.9

# dnsmasq settings
no-resolv
no-hosts
cache-size=256
