# Package config fields. Set validates ordinary-resource requirements after
# resource-ID name fallback; @defaults uses the same shape as a host policy.
# A field declaration is not evidence of scheduling/retry behavior.
type: object
description: >
  Package resource or host-wide @defaults policy. Ordinary resources require
  state and, for present, version; name may fall back to the resource ID.
  These context-dependent requirements are enforced by module.go/types.go.
properties:
  name:
    type: string
    description: Package name; no slash, space or leading dash. Defaults to resource ID.
  state:
    type: string
    enum: [present, absent]
    description: Required for ordinary package resources; not used by @defaults.
  version:
    type: string
    pattern: "^(latest|([0-9]+:)?[0-9][0-9a-zA-Z_.:+-]*)$"
    description: Required for present. Concrete version or latest, subject to manager availability.
  update:
    type: boolean
    default: false
    description: Set installs latest when true; not a minimum-version or scheduling policy.
  dependencies:
    type: array
    items:
      type: string
    uniqueItems: true
    description: Package names installed at latest before the requested package.
  providers:
    type: array
    items:
      type: string
      enum: [winget, choco, apt, dnf, yum, pacman, brew]
    description: Ordered allowlist; resource overrides @defaults, then platform defaults.
  package_manager:
    type: string
    description: Legacy singular provider selector, used only when providers is empty.
  choco_source:
    type: string
    description: Organization feed configured through @defaults; required to use choco.
  choco_source_name:
    type: string
    description: Host Chocolatey feed name; defaults to org when unset.
  choco_bootstrap_package:
    type: string
    description: Host bootstrap package path/URL; defaults to feed/chocolatey.nupkg.
  choco_bootstrap_sha256:
    type: string
    description: Operator-pinned 64-hex SHA-256, required before Chocolatey bootstrap.
  maintenance:
    type: object
    description: Serialized Config metadata only; current Set does not enforce windows.
    properties:
      window:
        type: string
      schedule:
        type: string
      duration:
        type: string
      timezone:
        type: string
