name: firewall
description: Manages firewall rules across different operating systems
version: 0.1.0

publisher: cfgms

# Supported execution environments
executors:
  - steward  # Local firewall management on steward systems

author: CFGMS Team
license: MIT
platforms:
  - linux
schema: schema.yaml
interfaces:
  - Get
  - Set
  - Test

owns:
  - kind: firewall  # authority over firewall:* objects this module manages
    required_fields:
      - hostname  # device identity — required in every full-os-device DNA snapshot
      - os        # device identity — required in every full-os-device DNA snapshot

# observe_when: omitted — pending module-tagging story (bounded inventory-worthy
# domain; observe_when predicate will be added by the ADR-024 epic).

security:
  requires_root: true
  capabilities: []
  ports: []
