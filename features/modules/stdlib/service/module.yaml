name: service
version: 0.1.0
description: >
  Manages OS service resources on the system.
  Provides idempotent Get/Set management of service running state and boot-enable
  configuration via the native service manager (systemd on Linux, SCM on Windows,
  launchd on macOS).

publisher: cfgms

# Supported execution environments
executors:
  - steward  # Local service management on steward systems

requirements:
  os: [windows, linux, darwin]
  arch: [amd64, arm64]
  min_memory: "64MB"
  min_disk: "1MB"

interfaces:
  - Get
  - Set
  - Test

owns:
  - kind: service  # authority over service:* objects this module manages
    required_fields:
      - hostname  # device identity — required in every full-os-device DNA snapshot
      - os        # device identity — required in every full-os-device DNA snapshot

# observe_when: omitted — pending module-tagging story (bounded inventory-worthy
# domain; observe_when predicate will be added by the ADR-024 epic).

security:
  requires_root: true  # start/stop/enable/disable require elevated privileges
  capabilities: []
  ports: []

documentation:
  api: "docs/api.md"
  examples: "docs/examples/"
