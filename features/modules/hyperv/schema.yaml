resources:
  vm:
    description: Hyper-V virtual machine (Generation 2)
    required:
      - name
    properties:
      name:
        type: string
        description: User-visible VM name (no __ — used as tenant-namespaced host-side name)
        pattern: "^[a-zA-Z0-9_\\-]{1,64}$"
      memory_mb:
        type: integer
        description: Startup memory in MiB
        minimum: 1
      cpu_count:
        type: integer
        description: Number of virtual processors
        minimum: 1
      vhd_path:
        type: string
        description: Absolute Windows path to the VHD/VHDX file (e.g. C:\\VMs\\disk.vhdx)
      switch_name:
        description: >
          The VM's FULL desired network, declared on the VM. Accepts either a
          single virtual switch name (string — the common case, back-compat) or
          a list of switch names (multi-NIC). On convergence the module
          reconciles the VM's network adapters so that exactly one adapter is
          connected to each switch in the set: a switch added to the set
          connects a new adapter; a switch removed from the set removes the
          adapter on it. Idempotent — when the connected set already equals the
          desired set, no change is made. This is the declarative replacement
          for the removed standalone vmattach resource (#1903, #2021).
        oneOf:
          - type: string
            pattern: "^[a-zA-Z0-9_\\- ]{1,64}$"
          - type: array
            items:
              type: string
              pattern: "^[a-zA-Z0-9_\\- ]{1,64}$"
      generation:
        type: integer
        description: VM generation (1 or 2; omit for default Generation 2)
        enum: [1, 2]
        default: 2
      state:
        type: string
        description: Desired lifecycle state
        enum:
          - running
          - stopped
          - absent
        default: running
      source:
        type: object
        description: >
          ISO boot-provisioning parameters. When present, the module activates
          the provisioning state machine (absent → creating → installing →
          finalizing → ready) one step per convergence cycle. Absent source:
          block leaves the VM managed by the existing lifecycle only.
        required:
          - iso
          - os_family
        properties:
          iso:
            type: string
            description: Absolute Windows path to the installation ISO (e.g. C:\ISO\server.iso)
          os_family:
            type: string
            description: Installer type
            enum:
              - linux
              - windows
          unattend:
            type: string
            description: >
              Optional reference to an unattended-install profile expressed as a
              profile:// URI (e.g. profile://windows/server2022).
          completion:
            type: object
            description: Specifies how the module detects that provisioning succeeded.
            properties:
              mode:
                type: string
                description: Detection strategy; steward-registration is the only supported value in v1.
                enum:
                  - steward-registration
              timeout:
                type: string
                description: >
                  Go duration string bounding the provisioning wait
                  (e.g. "60m"). Omit to use the module default.
          on_existing:
            type: string
            description: >
              Behaviour when the VM already exists. never (default) leaves it
              untouched; recreate destroys and re-provisions.
            enum:
              - never
              - recreate
            default: never
      ha_role:
        type: object
        description: >
          When present, registers the VM as a clustered HA role on the named
          failover cluster after creation (reuses the cluster CNO ownership gate
          and existence-based idempotency). Absent: the VM is a standalone
          (non-HA) resource. When the primary vhd_path is on a Cluster Shared
          Volume (C:\ClusterStorage\...), the module-level seed_dir must be set
          and host-local (not under CSV) or the resource is rejected at validate
          time.
        required:
          - cluster_name
        properties:
          cluster_name:
            type: string
            description: Target failover cluster (must equal the module's declared cluster_name).
          resource_group_name:
            type: string
            description: Optional cluster resource-group name (defaults to the VM name).

  vswitch:
    description: Hyper-V virtual switch (external, internal, or private)
    required:
      - name
      - switch_type
    properties:
      name:
        type: string
        description: User-visible switch name (no __ — tenant-namespaced on the host)
        pattern: "^[a-zA-Z0-9_\\- ]{1,64}$"
      switch_type:
        type: string
        description: Switch type. NAT is not supported.
        enum:
          - external
          - internal
          - private
      net_adapter_name:
        type: string
        description: >
          Physical network adapter to bind. Required for external type;
          must be empty for internal and private types.
      allow_management_os:
        type: boolean
        description: >
          Whether the management OS shares the external switch adapter.
          Forced to true for external type; not applicable for internal/private.
        default: true
      state:
        type: string
        description: Desired lifecycle state
        enum:
          - present
          - absent
        default: present

  cluster:
    description: >
      Hyper-V failover-cluster role property management (cluster-scoped only).
      Reconciles placement/scheduling properties of existing clustered VM
      roles. VM cluster-role membership (promote/demote) is a hyperv.vm
      setting (ha_role) — the single surface for VM-scoped settings; this
      resource never creates or removes roles. Mutation is CNO-owner-gated and
      idempotent. Cluster formation is out of scope.
    required:
      - name
    properties:
      name:
        type: string
        description: Failover cluster (CNO) name; must equal the module's declared cluster_name.
      role_names:
        type: array
        description: >
          Bounded set of existing clustered VM role names whose properties this
          resource reconciles. Roles are never created or removed here — VM
          cluster-role membership is the hyperv.vm ha_role setting.
        items:
          type: string
      allow_destructive:
        type: boolean
        description: >
          Retained for the internal destructive gate; the operator-facing role
          teardown surface is removed — state absent is refused regardless
          (demote via removing ha_role on the hyperv.vm resource).
        default: false
      state:
        type: string
        description: >
          Desired lifecycle. absent is refused (role membership is managed via
          hyperv.vm ha_role); cluster formation/teardown is out of scope.
        enum:
          - present
          - absent
        default: present
      roles:
        type: object
        description: >
          Per-role declarative placement/scheduling properties, keyed by role
          (VM) name. Reconciled on the CNO-owner node after the role exists;
          absent keys leave properties at cluster defaults.
        additionalProperties:
          type: object
          properties:
            preferred_owners:
              type: array
              description: Ordered preferred failover nodes for the role group (Set-ClusterOwnerNode -Group).
              items:
                type: string
            possible_owners:
              type: array
              description: Nodes permitted to own the role's VM resource (Set-ClusterOwnerNode -Resource).
              items:
                type: string
            priority:
              type: integer
              description: Cluster group priority.
              enum:
                - 0
                - 1000
                - 2000
                - 3000
            auto_start:
              type: boolean
              description: Whether the cluster starts the group at node startup.
            anti_affinity_class:
              type: string
              description: Anti-affinity token used to separate sibling roles across nodes.
