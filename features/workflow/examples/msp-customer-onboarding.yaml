name: "msp-customer-onboarding-automation"
description: "Complete MSP customer onboarding workflow integrating M365, a PSA/ticketing provider, and a documentation provider"
version: "1.0.0"

# Tenant scope: this workflow must only ever be triggered/executed under a
# CFGMS execution scoped to the one client tenant it targets (e.g.
# root/msp-a/client-1) — never under an MSP-root or unscoped execution.
# Steps 6-7 below grant Global Administrator in the customer's own M365
# tenant (m365_tenant_id), so running this under the wrong CFGMS tenant
# context is a privilege-escalation risk, not just a data-scoping one.
#
# There is no per-step tenant/scope field in this workflow schema, and one is
# deliberately not added here: CFGMS never trusts a workflow-author-supplied
# tenant value for authorization (Issue #4338) — a `type: "api"` step like
# the ones below has no executor-level tenant check of its own. The real
# tenant boundary is enforced by the engine from the authenticated caller or
# trigger that starts the execution (execution.TenantID, resolved from
# ctxkeys.TenantID) — see docs/api/rest-api.md's "Workflow Triggers" and
# "Registration Token Management" sections for how a trigger or token is
# itself bound to one tenant. Operators must ensure whatever starts this
# workflow (a tenant-scoped trigger, or a session belonging to the correct
# client) is scoped to this specific customer before it runs.

variables:
  # Customer Information
  customer_name: "Acme Corporation"
  customer_domain: "acme-corp.com"
  customer_primary_contact: "john.doe@acme-corp.com"

  # PSA/ticketing provider configuration (illustrative placeholder — "vendor-a"
  # stands in for whichever PSA/ticketing provider is registered)
  vendor_a_company_id: ""
  vendor_a_api_url: "https://api.vendor-a.example"
  vendor_a_client_id: "your-client-id"

  # Microsoft 365 Configuration
  m365_tenant_id: "your-tenant-id"
  m365_client_id: "your-client-id"
  m365_client_secret: "your-client-secret"

  # No credential for the admin account Steps 6-7 create appears in this file,
  # in any form — not a literal, and not a {{ }} reference. See Step 6.

  # Documentation provider configuration (illustrative placeholder — "vendor-b"
  # stands in for whichever documentation provider is registered)
  vendor_b_api_key: "your-vendor-b-api-key"
  vendor_b_organization_id: ""

steps:
  # Step 1: Create customer in the PSA/ticketing provider (vendor-a)
  - name: "create-vendor-a-company"
    type: "api"
    api:
      provider: "vendor-a"
      service: "manage"
      operation: "companies"
      parameters:
        identifier: "{{ .customer_name | replace \" \" \"-\" | lower }}"
        name: "{{ .customer_name }}"
        status:
          id: 1  # Active status
        type:
          id: 7  # Customer type
        addressLine1: "123 Business St"
        city: "Business City"
        state: "CA"
        zip: "90210"
        country: "USA"
        phoneNumber: "(555) 123-4567"
        website: "https://{{ .customer_domain }}"
      auth:
        type: "basic"
        username: "{{ .vendor_a_client_id }}"
        password: "{{ .vendor_a_api_key }}"
      timeout: 30s
      retry:
        max_attempts: 3
        initial_delay: 2s
        backoff_multiplier: 2.0

  # Step 2: Store vendor-a company ID for later steps
  - name: "store-company-id"
    type: "conditional"
    condition:
      type: "variable"
      variable: "create-vendor-a-company_api_success"
      operator: "eq"
      value: true
    steps:
      - name: "set-company-id"
        type: "http"
        http:
          url: "http://localhost:8080/internal/variables"
          method: "POST"
          body:
            vendor_a_company_id: "{{ .create-vendor-a-company_api_response.id }}"

  # Step 3: Create initial support ticket for onboarding
  - name: "create-onboarding-ticket"
    type: "api"
    api:
      provider: "vendor-a"
      service: "manage"
      operation: "tickets"
      parameters:
        summary: "Customer Onboarding - {{ .customer_name }}"
        company:
          id: "{{ .create-vendor-a-company_api_response.id }}"
        board:
          id: 31  # Service Board ID
        status:
          id: 2   # New status
        priority:
          id: 3   # Normal priority
        initialDescription: |
          Customer onboarding automation initiated for {{ .customer_name }}.

          Tasks to complete:
          - Microsoft 365 tenant setup
          - User account creation
          - Security baseline configuration
          - Documentation creation with the documentation provider

          Domain: {{ .customer_domain }}
          Primary Contact: {{ .customer_primary_contact }}
      auth:
        type: "basic"
        username: "{{ .vendor_a_client_id }}"
        password: "{{ .vendor_a_api_key }}"
      timeout: 30s

  # Step 4: Microsoft 365 Authentication
  - name: "authenticate-m365"
    type: "api"
    api:
      provider: "microsoft"
      service: "oauth"
      operation: "get_token"
      auth:
        type: "oauth2"
        oauth2:
          client_id: "{{ .m365_client_id }}"
          client_secret: "{{ .m365_client_secret }}"
          token_url: "https://login.microsoftonline.com/{{ .m365_tenant_id }}/oauth2/v2.0/token"
          scopes: ["https://graph.microsoft.com/.default"]
          grant_type: "client_credentials"
      timeout: 30s

  # Step 5: Apply M365 Security Baseline Configuration
  - name: "apply-m365-security-baseline"
    type: "parallel"
    steps:
      # Enable security defaults
      - name: "enable-security-defaults"
        type: "api"
        api:
          provider: "microsoft"
          service: "security"
          operation: "enable_security_defaults"
          auth:
            type: "bearer"
            bearer_token: "{{ .authenticate_m365_api_response.access_token }}"

      # Configure conditional access policies
      - name: "configure-conditional-access"
        type: "api"
        api:
          provider: "microsoft"
          service: "security"
          operation: "create_conditional_access_policy"
          parameters:
            displayName: "{{ .customer_name }} - Require MFA for All Users"
            state: "enabled"
            conditions:
              users:
                includeUsers: ["All"]
              applications:
                includeApplications: ["All"]
            grantControls:
              operator: "OR"
              builtInControls: ["mfa"]
          auth:
            type: "bearer"
            bearer_token: "{{ .authenticate_m365_api_response.access_token }}"

      # Configure Exchange Online protection
      - name: "configure-exchange-protection"
        type: "api"
        api:
          provider: "microsoft"
          service: "exchange"
          operation: "configure_anti_phishing_policy"
          parameters:
            name: "{{ .customer_name }} Anti-Phishing Policy"
            enableMailboxIntelligence: true
            enableSpoofIntelligence: true
            enableUnauthenticatedSender: true
          auth:
            type: "bearer"
            bearer_token: "{{ .authenticate_m365_api_response.access_token }}"

  # Step 6: Create admin user account. Grants Global Administrator in the
  # customer's M365 tenant (see Step 7) — see the tenant-scope note at the top
  # of this file before reusing this step outside its intended trigger.
  #
  # This step carries NO password, and the account is created disabled
  # (accountEnabled: false). Both are deliberate:
  #
  #   * No credential, literal or templated. A password committed here is a
  #     tenant-takeover credential for every reader of this repository, because
  #     the UPN is predictable (admin@<customer_domain>) and Step 7 makes the
  #     account a Global Administrator. A {{ }} reference is no safer in this
  #     position: renderAPIConfig (features/workflow/engine_template.go) renders
  #     only top-level *string* values in api.parameters, so anything nested
  #     under passwordProfile is passed through to the provider verbatim — the
  #     template text itself would become the password.
  #   * Disabled on create. Between creation and the customer's first
  #     interactive sign-in, an enabled account holding the Step 7 Global
  #     Administrator role is guarded by its initial password alone, and
  #     forceChangePasswordNextSignIn does not protect it before that sign-in.
  #     A disabled account cannot be signed into at all, so no such window
  #     exists.
  #
  # To finish provisioning: set the initial password and enable the account
  # out-of-band, with a per-run CSPRNG value held in the secrets provider
  # (pkg/secrets, SOPS-encrypted at rest) and delivered to the customer through
  # a channel that is not this workflow — never the Step 11 ticket, the Step 9
  # or Step 10 documentation records, or the Step 12 notification payload.
  # Requiring MFA or a conditional-access policy on this account before
  # enabling it, or authorizing the Step 7 role grant separately once the
  # customer holds the account, narrows the exposure further.
  - name: "create-admin-user"
    type: "api"
    api:
      provider: "microsoft"
      service: "users"
      operation: "create"
      parameters:
        displayName: "{{ .customer_name }} Admin"
        userPrincipalName: "admin@{{ .customer_domain }}"
        mailNickname: "admin"
        passwordProfile:
          forceChangePasswordNextSignIn: true
        accountEnabled: false
        usageLocation: "US"
      auth:
        type: "bearer"
        bearer_token: "{{ .authenticate_m365_api_response.access_token }}"
      timeout: 30s

  # Step 7: Assign admin roles
  - name: "assign-admin-roles"
    type: "api"
    api:
      provider: "microsoft"
      service: "users"
      operation: "assign_role"
      parameters:
        user_id: "{{ .create-admin-user_api_response.id }}"
        role_id: "62e90394-69f5-4237-9190-012177145e10"  # Global Administrator
      auth:
        type: "bearer"
        bearer_token: "{{ .authenticate_m365_api_response.access_token }}"
      timeout: 30s

  # Step 8: Wait for M365 configuration propagation
  - name: "wait-for-m365-propagation"
    type: "delay"
    delay:
      duration: 60s
      message: "Waiting for M365 configuration to propagate"

  # Step 9: Create customer documentation with the documentation provider (vendor-b)
  - name: "create-vendor-b-organization"
    type: "api"
    api:
      provider: "vendor-b"
      service: "organizations"
      operation: "create"
      parameters:
        data:
          type: "organizations"
          attributes:
            name: "{{ .customer_name }}"
            organization-type-name: "Customer"
            primary-domain: "{{ .customer_domain }}"
            quick-notes: |
              Customer onboarded on {{ .now }}.

              Microsoft 365 Tenant: {{ .m365_tenant_id }}
              Vendor-a Company ID: {{ .create-vendor-a-company_api_response.id }}

              Admin Account: admin@{{ .customer_domain }}
              Primary Contact: {{ .customer_primary_contact }}
      auth:
        type: "api_key"
        api_key: "{{ .vendor_b_api_key }}"
        api_key_header: "x-api-key"
      timeout: 30s

  # Step 10: Create M365 configuration documentation
  - name: "document-m365-configuration"
    type: "api"
    api:
      provider: "vendor-b"
      service: "flexible-assets"
      operation: "create"
      parameters:
        data:
          type: "flexible-assets"
          attributes:
            organization-id: "{{ .create-vendor-b-organization_api_response.data.id }}"
            flexible-asset-type-id: 123456  # M365 Configuration asset type
            traits:
              tenant-id: "{{ .m365_tenant_id }}"
              primary-domain: "{{ .customer_domain }}"
              admin-account: "admin@{{ .customer_domain }}"
              security-defaults-enabled: true
              conditional-access-configured: true
              anti-phishing-configured: true
              onboarding-date: "{{ .now }}"
      auth:
        type: "api_key"
        api_key: "{{ .vendor_b_api_key }}"
        api_key_header: "x-api-key"
      timeout: 30s

  # Step 11: Update the vendor-a ticket with completion
  - name: "update-onboarding-ticket"
    type: "api"
    api:
      provider: "vendor-a"
      service: "manage"
      operation: "update_ticket"
      parameters:
        ticket_id: "{{ .create-onboarding-ticket_api_response.id }}"
        status:
          id: 5  # Completed status
        resolution: |
          Customer onboarding completed successfully.

          Completed tasks:
          ✓ Vendor-a company created (ID: {{ .create-vendor-a-company_api_response.id }})
          ✓ Microsoft 365 security baseline applied
          ✓ Admin user account created, disabled (admin@{{ .customer_domain }})
          ✓ Global Administrator role assigned
          ✓ Vendor-b organization and documentation created

          Vendor-b Organization ID: {{ .create-vendor-b-organization_api_response.data.id }}

          Next steps:
          - Set the admin account's initial password and enable the account.
            It holds Global Administrator, so use a per-run CSPRNG value from
            the secrets provider and deliver it to the customer out-of-band —
            never in this ticket, in a documentation record, or in any
            workflow file. It must be changed at first sign-in.
          - Schedule security review meeting
          - Begin user account creation process
      auth:
        type: "basic"
        username: "{{ .vendor_a_client_id }}"
        password: "{{ .vendor_a_api_key }}"
      timeout: 30s

  # Step 12: Send completion notification
  - name: "send-completion-notification"
    type: "webhook"
    webhook:
      url: "https://your-notification-service.com/msp-onboarding"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload:
        event: "customer_onboarding_completed"
        customer:
          name: "{{ .customer_name }}"
          domain: "{{ .customer_domain }}"
          primary_contact: "{{ .customer_primary_contact }}"
        vendor_a:
          company_id: "{{ .create-vendor-a-company_api_response.id }}"
          ticket_id: "{{ .create-onboarding-ticket_api_response.id }}"
        microsoft365:
          tenant_id: "{{ .m365_tenant_id }}"
          admin_user_id: "{{ .create-admin-user_api_response.id }}"
        vendor_b:
          organization_id: "{{ .create-vendor-b-organization_api_response.data.id }}"
        completion_time: "{{ .now }}"
        workflow_execution_id: "{{ .workflow_execution_id }}"
      auth:
        type: "api_key"
        api_key: "your-webhook-api-key"
        api_key_header: "X-API-Key"
      timeout: 15s

timeout: 15m
on_failure: "stop"