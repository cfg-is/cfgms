# CFGMS controller configuration for the three-node HA integration cluster.
#
# docker-compose.test.yml mounts this one file into controller-east,
# controller-central and controller-west at /etc/cfgms/controller.cfg, the path
# cmd/controller/Dockerfile's default CMD passes to --config. Per-node values
# come from environment-variable references that each Compose service supplies,
# so the three nodes share a single reviewed file instead of three
# near-identical copies.
#
# Note for editors: config.LoadWithPath scans this file's entire contents,
# comments included, and fails closed on any environment reference it cannot
# resolve. Do not write a placeholder reference in a comment.
#
# Only settings that cannot be expressed as environment variables live here.
# Everything else (storage, HA timings, listen addresses, API keys) stays in
# docker-compose.test.yml, where the rest of the test topology is declared.

# The private Raft listener. features/controller/config.Config.InternalListenAddr
# is YAML-only — there is no CFGMS_* override — and
# config.ValidatePrivateListenerAddress rejects 0.0.0.0, requiring an explicit
# loopback or private IP. Peers reach this listener by Compose service name, so
# it must bind the node's address on the cfgms-test network rather than
# loopback; docker-compose.test.yml pins each node a static address in the
# 172.20.0.0/16 subnet and passes it as CFGMS_HA_INTERNAL_IP.
internal_listen_addr: "${CFGMS_HA_INTERNAL_IP}:9443"

certificate:
  enable_cert_management: true
  ca_path: "/app/certs/ca"
  server:
    common_name: "cfgms-controller"
    # Every node presents a certificate valid for all three service names.
    #
    # Two independent checks need this. api.Server.Start refuses to serve the
    # public API unless the certificate matches the external_url hostname, and
    # the Raft peer transport dials https://controller-<region>:9443 and
    # verifies that name against the shared CA. A per-node SAN list would
    # satisfy the first and fail the second on every inbound peer connection.
    #
    # The nodes share one CA (see ha-ca-init in docker-compose.test.yml), so a
    # certificate minted by any node verifies on all of them.
    dns_names:
      - "localhost"
      - "cfgms-controller"
      - "controller-east"
      - "controller-central"
      - "controller-west"
    ip_addresses:
      - "127.0.0.1"
      - "172.20.0.11"
      - "172.20.0.12"
      - "172.20.0.13"
    organization: "CFGMS"
