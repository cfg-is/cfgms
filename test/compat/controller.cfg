# Steward compat test controller configuration (Issue #6342)
# Compat-only copy of test/e2e/fleet/configs/controller.cfg: only the server
# certificate identity differs, so the auto-generated public API certificate
# covers the compose hostname compat-controller (the controller refuses to start
# when CFGMS_EXTERNAL_URL's host is not a SAN). Keep dns_names in sync with
# CFGMS_EXTERNAL_URL in docker-compose.test.yml; TestCompatControllerCertCoversExternalURL
# enforces it.
# Transport: gRPC-over-QUIC on 0.0.0.0:4433
# Storage: flatfile (no external database required)
# Token seeding: handled by CFGMS_SEED_TEST_TOKENS=1 env var, not in this file

security_profile: "test"
metrics_listen_addr: "127.0.0.1:9090"
admin_bundle_path: "/app/data/admin.bundle.yaml"

cert_path: "/app/certs"

certificate:
  enable_cert_management: true
  auto_generate: true
  ca_path: "/app/certs/ca"
  renewal_threshold_days: 30
  server_cert_validity_days: 365
  client_cert_validity_days: 365
  server:
    common_name: "compat-controller"
    dns_names:
      - "compat-controller"
      - "localhost"
    ip_addresses:
      - "127.0.0.1"
    organization: "CFGMS Compat Test"

transport:
  listen_addr: "0.0.0.0:4433"
  use_cert_manager: true

storage:
  flatfile_root: "/app/data/flatfile"
  sqlite_path: "/app/data/cfgms.db"

logging:
  level: "info"
  provider: "file"
  config:
    directory: "/tmp/cfgms"
    max_file_size: 10485760
    max_files: 3

# compat stewards register from the docker-bridge subnet, which has no
# IPTrustStore entries on a fresh test boot. The default "ip-trust" approval
# workflow (Issue #1695) would quarantine them — they'd get certs but no
# steward_id finalization — and the compat scenarios time out waiting on
# their logs for `"steward_id":"..."`. Use the deprecated auto-approve
# workflow here: appropriate for an isolated docker compose harness where
# every container is part of the test, never for production.
registration:
  workflow: auto-approve

# Issue #1709: blob storage root for installer artifact persistence.
# /app/data is created by the controller startup command; subdirectory is
# created on first use by the filesystem blob provider.
blob_storage:
  root: /app/data/installers
