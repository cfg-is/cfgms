# Staticcheck configuration for the release security gate.
#
# Staticcheck's supported configuration surface is intentionally small. Keep
# this file limited to documented keys so upgrades cannot silently ignore a
# home-grown severity/exclusion section. The release gate runs correctness
# analyzers; formatting, API naming, comments, quick fixes, and pre-existing
# dead-code cleanup belong to separate quality work.
checks = [
  "SA*",
  # Wire-compatible deprecated protobuf fields are retained deliberately.
  "-SA1019",
]
