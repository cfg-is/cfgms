# Fleet config recipe — push this to stewards via `cfg config upload` once you have
# a working controller. NOT a steward boot config.
#
# To deploy:
#   cfg config upload time-sync.cfg --steward <STEWARD_ID>
#
# For the canonical steward boot config, see docs/deployment/steward.cfg
#
# CFGMS Role Config — Time Sync
#
# Declares the host timezone and NTP source with the stdlib `time` module.
#
# Hosts whose time is managed elsewhere should NOT use this file. Domain
# controllers and hypervisor guests normally take time from the directory or
# the host, so declare no `time` resource for them. Leaving the resource out
# is the opt-out; `ntp_sync_enabled: false` is not — it declares sync disabled
# and the host is converged to it. See docs/modules/time.md.
#
# CHANGE: Search for "CHANGE:" below and update for your environment.

steward:
  id: "time-sync"
  logging:
    level: "info"

resources:
  - name: "time-sync"
    module: "time"
    config:
      # `timezone` is required. Windows hosts take a Windows identifier
      # (e.g. "Eastern Standard Time"), Linux and macOS take an IANA name.
      timezone: "UTC"
      # CHANGE: NTP servers reachable from your hosts.
      ntp_servers:
        - "time1.example.com"
        - "time2.example.com"
      ntp_sync_enabled: true
