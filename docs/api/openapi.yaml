        tenant_id:
          type: string
        config_name:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
        source:
          type: string
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    CertificateInfo:
      type: object
      properties:
        serial_number:
          type: string
        common_name:
          type: string
        steward_id:
          type: string
        tenant_id:
          type: string
        is_valid:
          type: boolean
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        days_until_expiration:
          type: integer
