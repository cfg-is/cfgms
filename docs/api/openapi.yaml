openapi: 3.0.3
info:
  title: CFGMS REST API
  description: |
    Configuration Management System REST API for managing stewards, configurations,
    certificates, and role-based access control.
    This is a curated operation/schema subset, not an exhaustive route inventory.
    Registered handlers and route-contract tests determine availability; optional
    services and the separate metrics listener have their own wiring. Serialized
    field shapes do not replace handler validation, tenant/assurance or proof rules.
  version: 1.0.0
  contact:
    name: CFGMS Support
    url: https://github.com/cfg-is/cfgms
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://{hostname}:{port}/api/v1
    description: Controller API listener; trust the configured CA
    variables:
      hostname:
        default: localhost
        description: CFGMS controller hostname
      port:
        default: '9080'
        description: Configured API listener port (--listen-api-addr, CFGMS_HTTP_LISTEN_ADDR or the config file); 9080 is the default

security:
  - ApiKeyAuth: []
  - BearerAuth: []
  - BrowserSession: []

paths:
  /registration/pending:
    get:
      summary: List pending registrations
      description: |
        Devices quarantined at registration and awaiting approval. Tenant-scoped
        callers see only their own tenant; unscoped callers see all tenants.
        Requires the `registration:list-pending` permission.
      operationId: listPendingRegistrations
      tags:
        - Registration
      responses:
        '200':
          description: Pending registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pending_id:
                      type: string
                    steward_id:
                      type: string
                    tenant_id:
                      type: string
                    source_ip:
                      type: string
                    hostname:
                      type: string
                      description: Self-reported by the device, unauthenticated; sanitised on write. Omitted for older entries.
                    key_fingerprint:
                      type: string
                      description: Lowercase hex SHA-256 of the CSR public key (DER SubjectPublicKeyInfo), computed by the controller. Omitted for older entries.
                    registered_at:
                      type: string
                      format: date-time
  /registration/tokens:
    get:
      summary: List registration tokens
      description: |
        Lists registration tokens. Each entry carries the stable `token_id` and the
        6-character `token_prefix`, never the secret. `label` is the operator-written
        description given at mint time; it is omitted for tokens minted without one.
        Requires the `registration:list-tokens` permission.
      operationId: listRegistrationTokens
      tags:
        - Registration
      responses:
        '200':
          description: Registration tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationToken'
                  total:
                    type: integer
    post:
      summary: Create a registration token
      description: |
        Mints a registration token. The response is the only time the full secret
        (`token`) is returned. Requires the `registration:create-token` permission.
      operationId: createRegistrationToken
      tags:
        - Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - controller_url
              properties:
                tenant_id:
                  type: string
                controller_url:
                  type: string
                group:
                  type: string
                label:
                  type: string
                  maxLength: 100
                  description: Optional free-text description. At most 100 characters, printable only (control characters are rejected). Empty is allowed. Never part of the token secret.
                expires_in:
                  type: string
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationToken'
        '400':
          description: Invalid request, including an over-length or control-character `label`
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API server
      operationId: getHealth
      security: []  # No authentication required
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                data:
                  status: healthy
                  service: cfgms-api
                  version: "0.2.0"
                timestamp: "2025-07-27T16:00:00Z"

  /stewards:
    get:
      summary: List all stewards
      description: Returns a list of all registered stewards in the system
      operationId: listStewards
      tags:
        - Stewards
      responses:
        '200':
          description: List of stewards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StewardInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stewards/refresh/pending:
    get:
      summary: List pending steward credential refresh requests
      description: >
        Returns a bare array. `hostname` is the steward-reported hostname for the
        device within the entry's own tenant; it is an empty string when the
        device is unknown. It is untrusted and must be rendered as text.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: Filter by tenant (honoured for unscoped callers only)
          schema:
            type: string
      responses:
        '200':
          description: Pending refresh entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pending_id:
                      type: string
                    device_id:
                      type: string
                      description: Ed25519 key fingerprint of the device
                    hostname:
                      type: string
                      description: Steward-reported hostname, empty when unknown
                    tenant_id:
                      type: string
                    source_ip:
                      type: string
                    provenance_matched_fields:
                      type: integer
                    provenance_total_fields:
                      type: integer
                    status:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: string
                      format: date-time
        '503':
          description: Pending refresh store unavailable

  /stewards/{stewardId}:
    get:
      summary: Get steward details
      description: Returns detailed information about a specific steward
      operationId: getSteward
      tags:
        - Stewards
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Steward details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StewardInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stewards/{stewardId}/dna:
    get:
      summary: Get steward DNA information
      description: Returns the DNA (system fingerprint) information for a steward
      operationId: getStewardDNA
      tags:
        - Stewards
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Steward DNA information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DNAInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stewards/{stewardId}/config:
    get:
      summary: Get steward configuration
      description: >-
        Returns the current configuration for a steward. Tenant scope: a
        scoped caller may read only a steward within its own tenant subtree;
        an out-of-subtree or unknown steward returns 404. Root/unscoped
        callers may read any steward.
      operationId: getStewardConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Steward configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConfigInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update steward configuration
      description: >-
        Stores configuration for a steward and triggers delivery. Tenant
        scope: a scoped caller may write configuration only for a steward
        within its own tenant subtree; an out-of-subtree or unknown steward
        is rejected with 404 STEWARD_NOT_FOUND (not 403, to avoid disclosing
        that the steward exists in another tenant). Root/unscoped callers
        retain authority across tenants, subject to the ADR-025 root/MSP
        tenant-crossing-boundary check for principals that are subject to it.
      operationId: updateStewardConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Configuration stored, with a trackable delivery record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      steward_id:
                        type: string
                      tenant_id:
                        type: string
                      message:
                        type: string
                      command_id:
                        type: string
                        description: >-
                          Present when a durable delivery record was created;
                          absent if no command store is configured.
                      delivery_status:
                        type: string
                        enum: [pending, delivered]
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: A required module is not cached and approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REQUIRED_MODULE_NOT_APPROVED
                  message: required module not approved
                timestamp: "2025-07-27T16:00:00Z"
        '500':
          description: Configuration could not be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: STORAGE_ERROR
                  message: Failed to store configuration
                timestamp: "2025-07-27T16:00:00Z"

  /stewards/{stewardId}/config/effective:
    get:
      summary: Get effective configuration with inheritance
      description: >-
        Returns the effective configuration after applying inheritance
        hierarchy. Tenant scope: resolved against the steward's own tenant
        when known to the controller's registry; a caller whose tenant
        differs from the steward's owning tenant is rejected (mapped to 500,
        since this check does not distinguish the case from a genuine
        resolution failure).
      operationId: getEffectiveConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Effective configuration with source tracking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EffectiveConfig'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /stewards/{stewardId}/config/validate:
    post:
      summary: Validate configuration
      description: >-
        Validates a configuration without applying it. Tenant scope: a
        scoped caller may validate only a steward within its own tenant
        subtree; an out-of-subtree or unknown steward returns 404.
        Root/unscoped callers may validate for any steward.
      operationId: validateConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stewards/{stewardId}/actions/prepare:
    post:
      summary: Prepare a steward action for signing
      description: >-
        Returns only the canonical action content (base64 of the JSON the operator
        signs) and the envelope shell (steward-action), so a browser never
        re-implements canonicalization. The nonce, expiry and targets come from
        the existing POST /operator-payload/sign/begin envelope (selector
        id:<steward id>), never from this endpoint. Nothing is queued. Requires
        steward:service-control for target_kind service and steward:process-control
        for target_kind process, both at strong assurance (401 CFGMS-StepUp below
        it). A steward outside the caller's tenant is a 404; a root-scoped caller
        without a tenant crossing gets the ADR-025 crossing challenge.
      operationId: prepareStewardAction
      tags:
        - Steward Actions
      parameters:
        - $ref: '#/components/parameters/stewardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_kind, target_name, action]
              properties:
                target_kind:
                  type: string
                  enum: [service, process]
                target_name:
                  type: string
                  description: Service name, or the decimal PID for a process
                action:
                  type: string
                  enum: [start, stop, restart, end, suspend, resume]
                image:
                  type: string
                  description: Process image name the operator saw (process actions only)
      responses:
        '200':
          description: Canonical content to sign
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: base64 of the canonical action content
                      shell:
                        type: string
                        example: steward-action
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /terminal/prepare/{steward_id}:
    post:
      summary: Prepare a terminal-open request for signing
      description: >-
        Returns the canonical terminal-open content (base64) and the envelope shell
        (terminal-open) to feed to POST /operator-payload/sign/begin. An empty
        terminal_shell resolves to the target steward's platform default
        (powershell for windows, bash otherwise); 409 when the platform is unknown.
        Requires terminal:create at strong assurance.
      operationId: prepareTerminal
      tags:
        - Terminal
      parameters:
        - name: steward_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminal_shell:
                  type: string
                  example: bash
      responses:
        '200':
          description: Canonical content to sign
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string
                        description: base64 of the canonical terminal content
                      shell:
                        type: string
                        example: terminal-open
                      terminal_shell:
                        type: string
                        example: bash
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Steward platform is unknown (STEWARD_PLATFORM_UNKNOWN); pass terminal_shell

  /terminal/ws/{steward_id}:
    get:
      summary: Open the terminal WebSocket
      description: >-
        Requires a one-time ticket from POST /terminal/tickets/{steward_id}, offered as the
        WebSocket subprotocol cfgms.ticket.<ticket> alongside cfgms.terminal.v1 in
        Sec-WebSocket-Protocol (never in the URL). The server selects only
        cfgms.terminal.v1. The ticket is redeemed after the permission and tenant checks;
        a missing, unknown, used or expired ticket, or one issued to another principal,
        tenant, web session or steward, is 403 TERMINAL_TICKET_REQUIRED before upgrade.
      operationId: openTerminalWebSocket
      tags:
        - Terminal
      parameters:
        - name: steward_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols
        '403':
          description: Ticket missing, invalid, used, expired or not issued to this caller (TERMINAL_TICKET_REQUIRED)
        '404':
          $ref: '#/components/responses/NotFound'

  /terminal/tickets/{steward_id}:
    post:
      summary: Exchange an operator proof for a one-time terminal ticket
      description: >-
        Verifies the operator proof over the terminal-open envelope and returns a
        ticket valid for 30 seconds. The ticket is single use (the first redemption
        consumes it, on any controller node) and is presented as the WebSocket
        subprotocol cfgms.ticket.<ticket> alongside cfgms.terminal.v1. Every
        proof-related failure is 403 INVALID_SIGNATURE. Requires terminal:create at
        strong assurance.
      operationId: createTerminalTicket
      tags:
        - Terminal
      parameters:
        - name: steward_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_shell, nonce, expires_at, targets]
              properties:
                terminal_shell:
                  type: string
                nonce:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                targets:
                  type: array
                  items:
                    type: string
                signature:
                  type: object
                  description: X.509 proof (algorithm, value, public_key); exactly one of signature or webauthn
                webauthn:
                  type: object
                  description: WebAuthn proof (authenticator_data, client_data_json, signature, credential_id)
      responses:
        '200':
          description: Ticket minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
                        description: base64url, 30 second single-use ticket
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: INVALID_SIGNATURE
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Cluster mode with no usable shared ceremony store

  /stewards/{stewardId}/services/{name}/actions:
    post:
      summary: Start, stop or restart a service on one steward
      description: >-
        Verifies the operator-signed envelope, applies the per-principal action
        budget, creates an action run and queues it through the shared queue. It
        returns 202 with the run id and never waits for the steward: poll
        GET /runs/{run_id} and GET /runs/{run_id}/jobs on any node. Requires
        steward:service-control at strong assurance. The justification is
        mandatory. Every request and outcome is audited. Error codes:
        ENVELOPE_EXPIRED (400), ENVELOPE_TTL_EXCEEDED (400), INVALID_TARGETS
        (400), MISSING_JUSTIFICATION (400), INVALID_ACTION (400),
        OPERATOR_SIGNATURE_REQUIRED (403), INVALID_SIGNATURE (403),
        ACTION_BUDGET_EXCEEDED (429).
      operationId: postStewardServiceAction
      tags:
        - Steward Actions
      parameters:
        - $ref: '#/components/parameters/stewardId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StewardActionRequest'
      responses:
        '202':
          $ref: '#/components/responses/StewardActionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing operator signature, or the signature does not verify
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Per-principal action budget exceeded (ACTION_BUDGET_EXCEEDED)

  /stewards/{stewardId}/processes/{pid}/actions:
    post:
      summary: End, suspend or resume a process on one steward
      description: >-
        As the service endpoint, for a process identified by decimal PID. The
        image field is the image name the operator saw; the steward refuses a
        PID that now belongs to a different image (result code process_changed).
        Requires steward:process-control at strong assurance. A refusal by the
        steward, such as self_protect, arrives as the job result_code, not as a
        synchronous error.
      operationId: postStewardProcessAction
      tags:
        - Steward Actions
      parameters:
        - $ref: '#/components/parameters/stewardId'
        - name: pid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StewardActionRequest'
      responses:
        '202':
          $ref: '#/components/responses/StewardActionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing operator signature, or the signature does not verify
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Per-principal action budget exceeded (ACTION_BUDGET_EXCEEDED)

  /runs/script:
    post:
      summary: Run a library script on matched stewards
      description: >-
        Creates a run and queues one execution per steward the target selector
        matches. Requires steward:execute-scripts at strong assurance. The
        optional shell must be one of bash, sh, powershell, pwsh or cmd; any other
        value is rejected with 400 UNSUPPORTED_SHELL. The error message lists the
        allowed shells and never echoes control characters from the submitted
        value. A missing script_id is 400 MISSING_SCRIPT_ID.
      operationId: postRunScript
      tags:
        - Steward Actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script_id]
              properties:
                target:
                  type: string
                  description: Fleet selector
                script_id:
                  type: string
                script_version:
                  type: string
                  description: Empty means latest
                shell:
                  type: string
                  enum: [bash, sh, powershell, pwsh, cmd]
                  description: Optional shell override; other values return 400 UNSUPPORTED_SHELL
                params:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Run created; data.run_id identifies it
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /runs/{runId}:
    get:
      summary: Get a run
      description: >-
        Returns the run record, including kind (script or steward_action). Served
        by every node from the shared run store. A run outside the caller's
        tenant scope is a 404.
      operationId: getRun
      tags:
        - Steward Actions
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The run
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /runs/{runId}/jobs:
    get:
      summary: List a run's jobs
      description: >-
        Each job carries its status and, for a steward action, result_code (ok,
        self_protect, process_changed, unsupported, not_found,
        permission_denied, failed, expired, no_result). result_detail is the
        controller's text for an outcome it assigned itself: "expired, not run"
        for an action never delivered before its 2 minute queue TTL, "sent, no
        result reported" for one sent but never reported. The steward's raw
        error text is never returned.
      operationId: getRunJobs
      tags:
        - Steward Actions
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The run's jobs
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /certificates:
    get:
      summary: List certificates
      description: >-
        Returns certificates within the caller's tenant scope: a scoped
        caller sees only certificates whose owning steward is in its own
        tenant subtree (plus certificates with no owning steward). If the
        subtree cannot be evaluated the request fails closed with 503 rather
        than returning an unfiltered list. Root/unscoped callers see every
        certificate.
      operationId: listCertificates
      tags:
        - Certificates
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CertificateInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /certificates/provision:
    post:
      summary: Provision new certificate
      description: Provisions a new certificate for a subject
      operationId: provisionCertificate
      tags:
        - Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
      responses:
        '200':
          description: Certificate provisioned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CertificateResponse'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /certificates/{serial}/revoke:
    post:
      summary: Revoke certificate
      description: Revokes a certificate by serial number
      operationId: revokeCertificate
      tags:
        - Certificates
      parameters:
        - name: serial
          in: path
          required: true
          description: Certificate serial number
          schema:
            type: string
      responses:
        '200':
          description: Certificate revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows:
    get:
      summary: List workflows
      description: >
        Lists the calling tenant's workflow definitions. Each item carries the
        stored definition plus a summary of its triggers and latest run, so the
        list needs no per-row calls. Counts and last_execution are scoped to the
        caller's tenant. Requires the workflow:list permission.
      operationId: listWorkflows
      tags:
        - Workflows
      responses:
        '200':
          description: Workflows with trigger counts and last execution
          content:
            application/json:
              schema:
                type: object
                required: [workflows, count]
                properties:
                  workflows:
                    type: array
                    items:
                      type: object
                      description: The stored workflow definition plus the summary fields below
                      required: [name, trigger_count, enabled_trigger_count, last_execution]
                      properties:
                        name:
                          type: string
                        trigger_count:
                          type: integer
                          description: Triggers of the tenant that start this workflow
                        enabled_trigger_count:
                          type: integer
                          description: Those triggers whose status is active
                        last_execution:
                          type: object
                          nullable: true
                          description: Most recently started run of this workflow in the tenant; null when it has never run
                          required: [id, status, start_time]
                          properties:
                            id:
                              type: string
                            status:
                              type: string
                            start_time:
                              type: string
                              format: date-time
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workflows/parse-yaml:
    post:
      summary: Parse a YAML workflow document
      description: >
        Parses a YAML workflow document with the server parser and returns the
        workflow as JSON plus every validation issue found. Nothing is saved or
        run. The body is capped at 10 MB (413 above that). Malformed YAML returns
        400 with a generic message that does not echo the document. Requires the
        workflow:read permission.
      operationId: parseWorkflowYaml
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Parsed workflow and validation result
          content:
            application/json:
              schema:
                type: object
                required: [workflow, valid, issues]
                properties:
                  workflow:
                    type: object
                    description: The parsed workflow (same shape as the workflow create request)
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      required: [path, message]
                      properties:
                        path:
                          type: string
                        step_name:
                          type: string
                        message:
                          type: string
        '400':
          description: The document is not a parseable workflow
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Body exceeds the request size limit

  /workflows/render-yaml:
    post:
      summary: Render a workflow as canonical YAML
      description: >
        Renders a workflow definition as the canonical YAML that parse-yaml
        reads. Nothing is saved or run. A workflow using fields the YAML format
        cannot express returns 400 rather than being rendered lossily. Requires
        the workflow:read permission.
      operationId: renderWorkflowYaml
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Same shape as the workflow create request
      responses:
        '200':
          description: Canonical YAML text
          content:
            application/yaml:
              schema:
                type: string
        '400':
          description: Body is not valid JSON, or the workflow cannot be expressed as YAML
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Body exceeds the request size limit

  /workflows/validate:
    post:
      summary: Validate a workflow definition (dry run)
      description: >
        Validates a workflow definition and returns every issue found, without
        saving or running anything. Always returns 200 for a well-formed JSON
        body; a definition with defects returns valid=false and a list of
        issues. Requires the workflow:read permission.
      operationId: validateWorkflow
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Same shape as the workflow create request
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      required: [path, message]
                      properties:
                        path:
                          type: string
                          description: Location of the defect, e.g. steps[2].config
                        step_name:
                          type: string
                        message:
                          type: string
        '400':
          description: Body is not valid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workflows/approvals:
    get:
      summary: List pending workflow approvals
      description: >
        Returns the caller's tenant's pending approval gates, oldest first. A
        root-scoped caller selects a tenant with the tenant query parameter.
        Requires the workflow:read permission.
      operationId: listWorkflowApprovals
      tags:
        - Workflows
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant to list, for root-scoped callers only
          schema:
            type: string
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowApproval'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workflows/approvals/{approvalId}/decision:
    post:
      summary: Approve or reject a workflow approval
      description: >
        Records a decision on a pending approval gate and resumes the suspended
        run (approve) or fails it (reject). Requires the workflow:approve
        permission at strong assurance; a caller below strong assurance receives
        a 401 CFGMS-StepUp challenge. When the gate names an approver_permission,
        the caller must also hold it. The principal that started the run cannot
        decide its approval (403, code SELF_APPROVAL). An approval in another
        tenant is a 404. Each decision is audited.
      operationId: decideWorkflowApproval
      tags:
        - Workflows
      parameters:
        - name: approvalId
          in: path
          required: true
          description: Approval ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                justification:
                  type: string
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval_id:
                    type: string
                  decision:
                    type: string
                  execution_id:
                    type: string
                  resumed:
                    type: boolean
                    description: false when the decision is recorded but the resume is left to engine recovery
                  execution_status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing approver permission, or the caller started the run (SELF_APPROVAL)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Approval already decided or expired

  /rbac/permissions:
    get:
      summary: List permissions
      description: Returns all available permissions in the system
      operationId: listPermissions
      tags:
        - RBAC
      responses:
        '200':
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rbac/roles:
    get:
      summary: List roles
      description: Returns all roles in the system
      operationId: listRoles
      tags:
        - RBAC
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create role
      description: Creates a new role
      operationId: createRole
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rbac/check:
    post:
      summary: Check permission
      description: Checks if a subject has a specific permission
      operationId: checkPermission
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCheckRequest'
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-keys:
    get:
      summary: List API keys
      description: >-
        Returns API keys belonging to the caller's own tenant — an exact
        tenant match, not a subtree. A request with no resolved tenant is
        rejected with 401.
      operationId: listAPIKeys
      tags:
        - API Keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create API key
      description: Creates a new API key
      operationId: createAPIKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
      responses:
        '200':
          description: API key created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyResponse'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-keys/{keyId}:
    get:
      summary: Get API key details
      description: Returns details about a specific API key
      operationId: getAPIKey
      tags:
        - API Keys
      parameters:
        - name: keyId
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete API key
      description: Deletes an API key
      operationId: deleteAPIKey
      tags:
        - API Keys
      parameters:
        - name: keyId
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      responses:
        '200':
          description: API key deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitoring/health:
    get:
      summary: Get system health overview
      description: Returns comprehensive health status of all system components
      operationId: getSystemHealth
      tags:
        - Monitoring
      responses:
        '200':
          description: System health overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SystemHealth'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /monitoring/metrics:
    servers:
      - url: https://{hostname}:{port}/api/v1
        description: Private metrics listener; use configured address and authorized credentials.
        variables:
          hostname:
            default: localhost
          port:
            default: '9090'
            description: Port from metrics_listen_addr or CFGMS_METRICS_LISTEN_ADDR; it has no built-in default, and 9090 is only the container example
    get:
      summary: Get performance metrics
      description: Returns current performance metrics from the dedicated private metrics listener. The public product listener returns 404 for this path.
      operationId: getMetrics
      tags:
        - Monitoring
      responses:
        '200':
          description: Performance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /monitoring/markers:
    servers:
      - url: https://{hostname}:{port}/api/v1
        description: Private metrics listener; use configured address and authorized credentials.
        variables:
          hostname:
            default: localhost
          port:
            default: '9090'
            description: Port from metrics_listen_addr or CFGMS_METRICS_LISTEN_ADDR; it has no built-in default, and 9090 is only the container example
    post:
      summary: Record a deploy, rollback or chaos marker
      description: |
        Records a time-stamped marker carrying a revision, as an audit event under the system
        tenant (action `marker_<kind>`, with the principal and revision in the details).
        Served on the private metrics listener only; the public product listener returns 404.
        Requires `monitoring:write-markers`, which needs strong assurance but accepts an API key
        with no presence tap. Automation grant credentials are refused.
      operationId: recordMarker
      tags:
        - Monitoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, revision]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [deploy, rollback, chaos_start, chaos_end]
                revision:
                  type: string
                  maxLength: 64
                  description: Hex commit id (7 to 64 digits) or semantic version
                  pattern: '^([0-9a-fA-F]{7,64}|v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$'
                note:
                  type: string
                  maxLength: 256
                  description: Optional note; control characters are rejected
      responses:
        '201':
          description: Marker recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Marker'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Request body larger than 4 KiB
    get:
      summary: List markers
      description: |
        Returns, oldest first, the `marker_*` and `controller_start` audit rows of the system
        tenant. `resource` is a marker or rollout id, never a tenant path. At most 1000 markers
        are returned; when more match, the newest are kept. Served on the private metrics
        listener only. Requires `monitoring:read-markers`.
      operationId: listMarkers
      tags:
        - Monitoring
      parameters:
        - name: since
          in: query
          required: false
          description: Earliest marker time (RFC 3339, inclusive)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Latest marker time (RFC 3339, inclusive)
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          required: false
          description: Only markers of this kind, for example `deploy`, `rollback`, `chaos_start`, `chaos_end`, `rollout_start` or `controller_start`
          schema:
            type: string
            maxLength: 32
            pattern: '^[a-z][a-z0-9_]*$'
      responses:
        '200':
          description: Markers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [markers]
                    properties:
                      markers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Marker'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /monitoring/components/{component}/health:
    get:
      summary: Get component health
      description: |
        Returns the live status, message and last-check time of one controller component.
        Known components: `grpc_server`, `storage`, `certificate_ca`, `rbac_service`, `transport`.
        A failing probe reports `unhealthy` with a generic message; probe error text is never returned.
        Requires `monitoring:read-component-health`.
      operationId: getComponentHealth
      tags:
        - Monitoring
      parameters:
        - name: component
          in: path
          required: true
          description: Component name
          schema:
            type: string
      responses:
        '200':
          description: Component health
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status, message, last_checked]
                    properties:
                      status:
                        type: string
                        enum: [healthy, degraded, unhealthy]
                      message:
                        type: string
                      last_checked:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitoring/components/{component}/metrics:
    servers:
      - url: https://{hostname}:{port}/api/v1
        description: Private metrics listener; use configured address and authorized credentials.
        variables:
          hostname:
            default: localhost
          port:
            default: '9090'
            description: Port from metrics_listen_addr or CFGMS_METRICS_LISTEN_ADDR; it has no built-in default, and 9090 is only the container example
    get:
      summary: Get component metrics
      description: Returns the metrics of one controller component (same names as the health endpoint) from the dedicated private metrics listener. The public product listener returns 404 for this path. Requires `monitoring:read-component-metrics`.
      operationId: getComponentMetrics
      tags:
        - Monitoring
      parameters:
        - name: component
          in: path
          required: true
          description: Component name
          schema:
            type: string
      responses:
        '200':
          description: Component metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The component's metrics are currently unavailable

  /alerts/{alertId}/unsilence:
    post:
      summary: Unsilence an alert
      description: |
        Reverses a silence, clearing the silence flag, its expiry and the silencing
        principal. Requires `alert:unsilence` at Strong assurance (same gate as silence).
        Idempotent: unsilencing an alert that is not silenced returns its current state.
      operationId: unsilenceAlert
      tags:
        - Alerts
      parameters:
        - name: alertId
          in: path
          required: true
          description: Alert identifier
          schema:
            type: string
      responses:
        '200':
          description: Updated alert state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Alert store not configured

  /tenants:
    get:
      summary: List tenants visible to the caller
      description: |
        Returns the tenants in the caller's visible scope. Each item carries the tenant
        record plus `device_count`, the number of stewards in the tenant's subtree
        within the caller's visible scope. Registered, active, lost and hidden stewards
        count; terminal-state stewards (deregistered, revoked, archived, dormant) and
        disabled accounts do not. A root-scoped caller also receives a boundary row
        (`boundary: true`, `accessible: false`) for each MSP, a direct child of the root
        tenant, that it holds no crossing for: only `id`, `name`, `parent_id`, `status`,
        `tech_count`, `device_count` and `client_count`. Clients below an MSP are never
        listed. `device_count` here is `endpoint_count` in the billing reports.
      operationId: listTenants
      tags:
        - Tenants
      responses:
        '200':
          description: Tenants with subtree steward counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        parent_id:
                          type: string
                        status:
                          type: string
                        device_count:
                          type: integer
                          minimum: 0
                          description: Subtree steward count within the caller's visible scope.
                        boundary:
                          type: boolean
                          description: True for a walled-off MSP boundary row.
                        accessible:
                          type: boolean
                          description: False for a boundary row, true for a full row.
                        tech_count:
                          type: integer
                          minimum: 0
                          description: Boundary rows only. Enabled accounts in the MSP subtree.
                        client_count:
                          type: integer
                          minimum: 0
                          description: Boundary rows only. Number of direct client tenants; none is identified.

  /tenants/{id}/access-grants/{crossingId}:
    delete:
      summary: End an active tenant crossing
      description: |
        Revokes an active grant or break-glass crossing so it stops granting access
        immediately. Requires `tenant:crossing-end` at Strong assurance. A grant is ended
        by an administrator of the granting tenant (root-scoped callers get `403`); a
        break-glass crossing is ended by the root principal that invoked it or by an
        administrator of the owning tenant. A crossing that does not belong to `{id}` is
        `404`. Idempotent: an already revoked or expired crossing returns its current state.
      operationId: endTenantCrossing
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant that owns the crossing
          schema:
            type: string
        - name: crossingId
          in: path
          required: true
          description: Crossing identifier
          schema:
            type: string
      responses:
        '200':
          description: Crossing state after the call
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller may not end this crossing
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Tenant crossing store not configured
  /billing/report:
    get:
      summary: Cross-MSP billing report
      description: |
        Every MSP (direct child of the root tenant) with tech and endpoint counts and
        metrics, and each MSP's clients under an opaque stored label. Requires
        `tenant:billing-read`; callable by a root-scoped caller (no grant needed), a caller
        bound to the root tenant, or an unscoped certificate-authenticated caller that holds
        the permission. Any other caller gets `403` `BILLING_ROOT_ONLY`. A client is a direct
        child of an MSP with its whole subtree rolled up into it. Endpoint counts exclude
        stewards in a terminal state (deregistered, archived, dormant, revoked); tech counts
        exclude disabled accounts. The response has no client name, client tenant ID or
        client-level metrics.
      operationId: getRootBillingReport
      tags:
        - Tenants
      responses:
        '200':
          description: Cross-MSP billing report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      msps:
                        type: array
                        items:
                          $ref: '#/components/schemas/RootBillingMSP'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the root operator (BILLING_ROOT_ONLY) or lacks tenant:billing-read
  /tenants/{id}/billing-report:
    get:
      summary: Billing report for one tenant subtree
      description: |
        The billing report for the subtree of `{id}`, with real client names and IDs.
        Requires `tenant:billing-read`. A caller outside `{id}`'s subtree gets `404`; a
        root-scoped caller without a crossing into `{id}` gets the tenant-crossing challenge.
        A client is a direct child of `{id}` with its whole subtree rolled up into it.
        Endpoint counts exclude stewards in a terminal state (deregistered, archived,
        dormant, revoked); tech counts exclude disabled accounts.
      operationId: getTenantBillingReport
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID (typically an MSP)
          schema:
            type: string
      responses:
        '200':
          description: Billing report for the subtree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TenantBillingReport'
        '401':
          description: Tenant-crossing step-up challenge for a root-scoped caller without a crossing
        '403':
          description: Caller lacks tenant:billing-read
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/dashboard/alerts:
    get:
      summary: Dashboard alert feed
      description: |
        Drift-derived alerts with acknowledgement and silence state. Actively silenced
        alerts are excluded unless `include_silenced=true`.
      operationId: getDashboardAlerts
      tags:
        - Alerts
      parameters:
        - name: severity
          in: query
          required: false
          description: Comma-separated severity filter (critical, warning, info). Defaults to warning,critical.
          schema:
            type: string
        - name: include_silenced
          in: query
          required: false
          description: When true, include alerts whose silence window is still open (with silenced true).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Alert feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        timestamp:
                          type: string
                        device_id:
                          type: string
                        severity:
                          type: string
                        description:
                          type: string
                        acknowledged:
                          type: boolean
                        silenced:
                          type: boolean
                        acknowledged_by:
                          type: string
                          description: Present only when known
                        silenced_by:
                          type: string
                          description: Present only when known
                  total_alerts:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /compliance/tenants/{tenantId}/devices:
    get:
      summary: List a tenant's devices with compliance status
      description: |
        Returns a page of one tenant's devices with their drift-based compliance
        status (the same buckets as the compliance summary). Devices are sorted by
        steward ID. A tenant outside the caller's scope returns 404 without
        disclosing whether it exists. Requires `compliance:read-summary`.
      operationId: getTenantComplianceDevices
      tags:
        - Compliance
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Page of the tenant's devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        steward_id:
                          type: string
                        hostname:
                          type: string
                        status:
                          type: string
                          enum: [compliant, warning, critical]
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset
        '404':
          description: Tenant not found or outside the caller's scope
        '503':
          description: Compliance data provider unavailable

  /web/passkey/login/finish:
    post:
      summary: Finish passkey web login
      description: |
        Completes the WebAuthn discoverable-credential ceremony and issues the
        web session (HttpOnly session cookie plus CSRF cookie). The response
        body never carries a token; `expires_at` is the only way the browser
        learns the session's remaining lifetime, because it cannot read the
        HttpOnly cookie. Expiry is informational; enforcement is server-side.
      operationId: finishPasskeyLogin
      tags:
        - Web Login
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      username:
                        type: string
                      tenant_id:
                        type: string
                      root_scope:
                        type: boolean
                      expires_at:
                        type: string
                        format: date-time
                        description: The issued session's absolute expiry (RFC 3339).
        '401':
          description: Assertion rejected

  /accounts/{username}/webauthn/credentials:
    get:
      summary: List an account's passkeys
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Passkey metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebAuthnCredentialInfo'
  /accounts/{username}/webauthn/credentials/{credential_id}:
    patch:
      summary: Rename a passkey (requires Strong assurance)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: credential_id
          in: path
          required: true
          description: base64url credential ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 64
      responses:
        '204':
          description: Renamed
        '400':
          description: Invalid credential ID or label
        '401':
          description: Step-up required (Strong assurance)
        '404':
          description: Account or credential not found
        '409':
          description: Account concurrently modified

  /automation/grants:
    post:
      summary: Create an automation grant
      description: >-
        Creates a scoped machine principal for a tenant. Requires
        automation-grant:create at strong assurance with a presence tap. The
        expiry is required and at most 90 days ahead. The plaintext credential
        is returned once and cannot be read again; the response carries
        Cache-Control no-store. The create event is audited before the response;
        if it cannot be recorded the grant is removed and 503 AUDIT_UNAVAILABLE
        is returned. A tenant outside the caller's subtree is a 404
        TENANT_NOT_FOUND. A root-scoped caller must supply tenant_id.
      operationId: createAutomationGrant
      tags:
        - Automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationGrantCreateRequest'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationGrantCreated'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Automation grants or the audit trail are not available (SERVICE_UNAVAILABLE, AUDIT_UNAVAILABLE)
    get:
      summary: List automation grants
      description: >-
        Lists the grants inside the caller's tenant subtree. A grant record never
        contains the credential. A root-scoped caller lists one tenant with the
        tenant query parameter (default the root tenant). Requires
        automation-grant:read.
      operationId: listAutomationGrants
      tags:
        - Automation
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant to list, for root-scoped callers only
          schema:
            type: string
      responses:
        '200':
          description: Grants
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        grants:
                          type: array
                          items:
                            $ref: '#/components/schemas/AutomationGrant'
                        count:
                          type: integer
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Automation grants are not available

  /automation/grants/{id}:
    delete:
      summary: Revoke an automation grant
      description: >-
        Revokes the grant and ends its open runs. Requires
        automation-grant:revoke at strong assurance with no presence tap. The
        revoke event is audited before it is applied; if it cannot be recorded
        the grant is left unchanged (503 AUDIT_UNAVAILABLE). A grant outside the
        caller's subtree is a 404 GRANT_NOT_FOUND. Repeating the request keeps the
        original revocation record and ends any run still open.
      operationId: revokeAutomationGrant
      tags:
        - Automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grant revoked
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationGrantRevoked'
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The grant was revoked but its open runs could not all be ended; repeat the request
        '503':
          description: Automation grants or the audit trail are not available

  /automation/runs:
    post:
      summary: Begin an automation run
      description: >-
        Opens a run bound to one tenant and one triggering event. Reachable only
        by an automation grant principal (Authorization Bearer cfgag_ credential);
        any other principal receives 403. The declared tenant must be the grant
        tenant or a descendant of it; the controller cannot verify the external
        event. The event (grant, event_source, event_ref) is bound to its first
        tenant. A grant has at most 5 open runs and at most 20 begin attempts per
        minute, accepted or refused. A run lasts at most one hour.
      operationId: beginAutomationRun
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRunBeginRequest'
      responses:
        '201':
          description: Run opened
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationRun'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a grant principal, or the tenant is outside the grant's tenant (TENANT_OUT_OF_SCOPE)
        '409':
          description: The event is already bound to another tenant (EVENT_BOUND_TO_OTHER_TENANT)
        '429':
          description: Open-run cap (OPEN_RUN_CAP) or begin rate limit (RATE_LIMITED)

  /automation/runs/{run_id}/end:
    post:
      summary: End an automation run
      description: >-
        Ends the run. Ending an ended run keeps the original end time. Every call
        on a run route is refused with a uniform 403 AUTOMATION_RUN_DENIED when
        the run is unknown, belongs to another grant, has ended or expired, when
        the grant is revoked or expired, or when the query or JSON body names a
        tenant other than the run tenant.
      operationId: endAutomationRun
      tags:
        - Automation
      parameters:
        - $ref: '#/components/parameters/automationRunId'
      security:
        - AutomationGrantAuth: []
      responses:
        '200':
          description: Run ended
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationRun'
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /automation/runs/{run_id}/stewards:
    get:
      summary: List the stewards of the run tenant
      description: >-
        Returns the stewards whose own tenant is exactly the run tenant; stewards of a descendant tenant are dropped, and pagination counts only the returned set. Reachable only by an automation grant principal within an open run.
      operationId: listAutomationRunStewards
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/stewards/{id}:
    get:
      summary: Get one steward of the run tenant
      description: >-
        A steward that does not exist or whose own tenant is not exactly the run tenant is a 404. Reachable only by an automation grant principal within an open run.
      operationId: getAutomationRunSteward
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/stewards/{id}/dna:
    get:
      summary: Get the DNA of one steward of the run tenant
      description: >-
        A steward that does not exist or whose own tenant is not exactly the run tenant is a 404. Reachable only by an automation grant principal within an open run.
      operationId: getAutomationRunStewardDNA
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/results/{result_run_id}:
    get:
      summary: Get a script run this run started
      description: >-
        Unknown, another run's and out-of-tenant runs all answer the same 404. Reachable only by an automation grant principal within an open run.
      operationId: getAutomationRunResult
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
        - name: result_run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/results/{result_run_id}/jobs:
    get:
      summary: List the jobs of a script run this run started
      description: >-
        Jobs on devices outside exactly the run tenant, and jobs whose device cannot be resolved, are dropped. Unknown, another run's and out-of-tenant runs all answer the same 404. Reachable only by an automation grant principal within an open run.
      operationId: getAutomationRunResultJobs
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
        - name: result_run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/executions:
    get:
      summary: List the workflow executions this run started
      description: >-
        Newest first. At most the newest 500 executions of the run tenant are checked against the run's records. Reachable only by an automation grant principal within an open run.
      operationId: listAutomationRunExecutions
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/executions/{exec_id}:
    get:
      summary: Get one workflow execution this run started
      description: >-
        Unknown, another run's and another tenant's executions all answer the same 404. Reachable only by an automation grant principal within an open run.
      operationId: getAutomationRunExecution
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
        - name: exec_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The read result, in the standard data envelope
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/runs/{run_id}/scripts:
    get:
      summary: List the scripts visible to a run
      description: >-
        Lists the scripts the run tenant sees through its library chain (the run
        tenant, then each ancestor up to and including the grant tenant), each
        with its owner tenant and the evaluator's state for its latest version.
        It never returns script text. Audited as automation.script.list.
      operationId: listAutomationRunScripts
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
      responses:
        '200':
          description: Scripts
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AutomationScriptEntry'
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Authorization data is temporarily unavailable
    post:
      summary: Start a pre-approved library script under a run
      description: >-
        Starts one library script on devices of the run tenant. The script is
        resolved once through the run tenant's library chain; that exact version
        is evaluated, pinned and audited. A pending version (no approval, or no
        cfgms-preapproved header declaration) is 409 APPROVAL_PENDING and an
        earlier approved version is never used instead; a denied version is 403
        CONTENT_NOT_APPROVED. params accepts literal strings for declared
        parameters only. A target that reaches a device outside the run tenant
        refuses the whole request (403 TARGET_OUT_OF_TENANT). Every queued command
        carries a guard reference to the run and grant and is cancelled when the
        run ends or the grant is revoked or expires. The steward verifies the
        library script signature against its own trusted keys. Audited as
        automation.script.run.
      operationId: startAutomationRunScript
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationScriptRunRequest'
      responses:
        '201':
          description: Script run queued
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationScriptRun'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: MISSING_SCRIPT_ID, INVALID_REQUEST, INVALID_VERSION, INVALID_TARGET or PARAM_REFUSED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CONTENT_NOT_APPROVED, TARGET_OUT_OF_TENANT or AUTOMATION_RUN_DENIED
        '404':
          description: SCRIPT_NOT_FOUND or NO_TARGETS
        '409':
          description: APPROVAL_PENDING
        '422':
          description: 'TOO_MANY_TARGETS: the target matches more devices than the tenant''s limit'
        '503':
          description: A dependency is not wired or authorization data is unavailable

  /automation/runs/{run_id}/workflows/{name}:
    post:
      summary: Start a pinned workflow version under a run
      description: >-
        Starts one workflow version as a restricted execution under the run
        tenant. The version is required and must be an exact semantic version;
        there is no latest. The version is resolved once through the run tenant's
        library chain and evaluated under the owner tenant's mode and records. A
        stored publication must verify, and the version must carry
        preapproved_for_automation in every mode. The restricted step set in v1
        is the control-flow types, delay, notify to a channel configured for the
        run tenant and the library-script step; sub-workflow steps are refused
        (422 WORKFLOW_NOT_RESTRICTED_SAFE) and nothing runs. A restricted run is
        bounded to 500 steps, 250 loop iterations, 10 parallel branches and 15
        minutes, and the run guard is checked before every step. Audited as
        automation.workflow.run.
      operationId: startAutomationRunWorkflow
      tags:
        - Automation
      security:
        - AutomationGrantAuth: []
      parameters:
        - $ref: '#/components/parameters/automationRunId'
        - name: name
          in: path
          required: true
          description: Workflow name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationWorkflowRunRequest'
      responses:
        '202':
          description: Execution started
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationWorkflowRun'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: INVALID_REQUEST, MISSING_VERSION, INVALID_VERSION, INPUT_REFUSED or INVALID_INPUTS
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CONTENT_NOT_APPROVED or AUTOMATION_RUN_DENIED
        '404':
          description: WORKFLOW_NOT_FOUND
        '409':
          description: 'APPROVAL_PENDING: the version awaits approval or does not opt in with preapproved_for_automation'
        '422':
          description: WORKFLOW_NOT_RESTRICTED_SAFE
        '503':
          description: A dependency is not wired or authorization data is unavailable

  /automation/approvals/scripts:
    get:
      summary: List script versions with their approval state
      description: >-
        Lists every script version in the caller's own tenant's library with its
        content hash, approval hash and evaluator state (approved or pending), and
        the library's approval mode. Requires automation-approval:read.
      operationId: listAutomationScriptApprovals
      tags:
        - Automation
      responses:
        '200':
          description: Library approval state
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        mode:
                          $ref: '#/components/schemas/AutomationApprovalMode'
                        scripts:
                          type: array
                          items:
                            $ref: '#/components/schemas/AutomationApprovalEntry'
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Approvals are not available
    post:
      summary: Approve one script version
      description: >-
        Approves one exact version by its approval hash. Requires
        content-approval:approve at strong assurance with a presence tap. Only a
        human channel may approve; a grant, API key or relay principal is refused.
        The approval never carries to another version or hash. The audit event is
        written before the approval is stored. Audit action content_approval.approve.
      operationId: approveAutomationScript
      tags:
        - Automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script_id, version, approval_hash]
              properties:
                script_id:
                  type: string
                version:
                  type: string
                approval_hash:
                  type: string
                  description: The approval hash the presence tap covers
                content_hash:
                  type: string
                  description: Optional; must equal the stored content hash
      responses:
        '201':
          description: Approval recorded
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationApprovalEntry'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: MISSING_FIELDS or INVALID_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'HASH_MISMATCH: the body no longer names what the controller holds'
        '422':
          description: NOT_APPROVABLE
        '500':
          description: 'AUDIT_UNAVAILABLE: nothing was changed'

  /automation/approvals/scripts/{id}/{version}/{approval_hash}:
    delete:
      summary: Withdraw the approval of one script version
      description: >-
        Withdraws an approval found by its stored key, so the approval of a
        version that has since changed can still be withdrawn. Requires
        content-approval:revoke at strong assurance with no presence tap. Audit
        action content_approval.revoke.
      operationId: revokeAutomationScriptApproval
      tags:
        - Automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: approval_hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Approval withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/approvals/scripts/pending:
    get:
      summary: List approved scripts whose new version awaits approval
      description: >-
        Each change carries the previous approved version and a unified diff of the
        previously approved content against the new content. The diff is shown only
        to an administrator of the owner tenant; the notice email carries
        identifiers only. Requires automation-approval:read.
      operationId: listPendingScriptChanges
      tags:
        - Automation
      responses:
        '200':
          description: Pending changes
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              script_id: {type: string}
                              version: {type: string}
                              content_hash: {type: string}
                              approval_hash: {type: string}
                              previous_version: {type: string}
                              previous_approval_hash: {type: string}
                              first_seen: {type: string}
                              diff: {type: string}
                              diff_unavailable: {type: string}
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /automation/approvals/workflows:
    get:
      summary: List workflow versions with their approval state
      description: >-
        Lists every workflow version in the caller's own tenant's library with its
        content hash, approval hash and evaluator state (approved or pending), and
        the library's approval mode. Requires automation-approval:read.
      operationId: listAutomationWorkflowApprovals
      tags:
        - Automation
      responses:
        '200':
          description: Library approval state
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        mode:
                          $ref: '#/components/schemas/AutomationApprovalMode'
                        workflows:
                          type: array
                          items:
                            $ref: '#/components/schemas/AutomationApprovalEntry'
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Approvals are not available
    post:
      summary: Approve one workflow version
      description: >-
        Approves one exact version by its approval hash. Requires
        content-approval:approve at strong assurance with a presence tap. Only a
        human channel may approve; a grant, API key or relay principal is refused.
        The approval never carries to another version or hash. The audit event is
        written before the approval is stored. Audit action content_approval.approve.
      operationId: approveAutomationWorkflow
      tags:
        - Automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id, version, approval_hash]
              properties:
                workflow_id:
                  type: string
                version:
                  type: string
                approval_hash:
                  type: string
                  description: The approval hash the presence tap covers
                content_hash:
                  type: string
                  description: Optional; must equal the stored content hash
      responses:
        '201':
          description: Approval recorded
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationApprovalEntry'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: MISSING_FIELDS or INVALID_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'HASH_MISMATCH: the body no longer names what the controller holds'
        '422':
          description: NOT_APPROVABLE
        '500':
          description: 'AUDIT_UNAVAILABLE: nothing was changed'

  /automation/approvals/workflows/{id}/{version}/{approval_hash}:
    delete:
      summary: Withdraw the approval of one workflow version
      description: >-
        Withdraws an approval found by its stored key, so the approval of a
        version that has since changed can still be withdrawn. Requires
        content-approval:revoke at strong assurance with no presence tap. Audit
        action content_approval.revoke.
      operationId: revokeAutomationWorkflowApproval
      tags:
        - Automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: approval_hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Approval withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation/libraries/{kind}/mode:
    get:
      summary: Get the approval mode of a library
      description: >-
        Returns the approval mode of the caller's own tenant's script or workflow
        library. Requires content-library:read.
      operationId: getLibraryMode
      tags:
        - Automation
      parameters:
        - $ref: '#/components/parameters/libraryKind'
      responses:
        '200':
          description: Library mode
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationLibraryMode'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: INVALID_KIND
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The content approval store is not available
    put:
      summary: Set the approval mode of a library
      description: >-
        Sets the mode of the caller's own tenant's library. Requires
        content-library:set-mode at strong assurance with a presence tap. There is
        no parent floor: the tenant that owns the library sets its mode. The audit
        event content_library.mode_change is written before the change; if it
        cannot be recorded the mode is left unchanged (503 AUDIT_UNAVAILABLE).
        Setting the mode the library already has goes through the same
        permission, tap and audit.
      operationId: setLibraryMode
      tags:
        - Automation
      parameters:
        - $ref: '#/components/parameters/libraryKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/AutomationApprovalMode'
      responses:
        '200':
          description: Library mode set
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AutomationLibraryMode'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: INVALID_KIND, INVALID_MODE or INVALID_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The audit trail or the content approval store is not available

  /rollout-settings/unattended:
    get:
      summary: Get the unattended rollout setting
      description: >-
        Returns whether unattended (machine-initiated) rollouts are enabled for the
        cell. The setting is off by default: with no stored record the response is
        enabled false with no changed_by or changed_at. Requires
        rollout-automation:read. The path is outside /rollout because
        GET /rollout/{rollout_id} would match "unattended".
      operationId: getUnattendedRolloutSetting
      tags:
        - Rollout
      responses:
        '200':
          description: Unattended rollout setting
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UnattendedRolloutSetting'
                    timestamp:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The unattended rollout store is not available
    put:
      summary: Turn unattended rollouts on or off
      description: >-
        Sets the cell's unattended rollout setting. Requires
        rollout-automation:set at strong assurance with a presence tap; an API key
        (machine principal) is refused. The audit event unattended_rollouts_changed
        (principal, previous and new value) is written before the change; if it
        cannot be recorded the setting is left unchanged (503 AUDIT_UNAVAILABLE).
        Setting the value the cell already has goes through the same permission,
        tap and audit. This setting only records the choice; it does not itself
        start or stop any rollout.
      operationId: setUnattendedRolloutSetting
      tags:
        - Rollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Setting stored
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UnattendedRolloutSetting'
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The audit trail or the unattended rollout store is not available

  /workflows/{id}/versions/{version}/publish/begin:
    post:
      summary: Begin publishing a workflow version
      description: >-
        Loads the exact stored version and returns a WebAuthn challenge over its
        envelope (tenant, name, version, canonical content hash, nonce and
        expiry). Requires workflow:publish at strong assurance, a
        cookie-authenticated web session and a registered passkey. The signer must
        hold workflow:publish in the workflow's tenant.
      operationId: beginWorkflowPublish
      tags:
        - Workflows
      parameters:
        - $ref: '#/components/parameters/workflowPublishId'
        - $ref: '#/components/parameters/workflowPublishVersion'
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        assertion:
                          type: object
                          description: WebAuthn credential assertion options
                        name: {type: string}
                        version: {type: string}
                        content_hash: {type: string}
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: INVALID_VERSION or SESSION_REQUIRED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'NO_CREDENTIALS: enroll a passkey first'
        '503':
          description: WEBAUTHN_NOT_CONFIGURED or the workflow engine is not available

  /workflows/{id}/versions/{version}/publish/finish:
    post:
      summary: Finish publishing a workflow version
      description: >-
        Takes the WebAuthn assertion produced for the begin challenge. The
        controller reloads the version, rebuilds the envelope from its current
        canonical hash and refuses with 409 VERSION_CHANGED if it no longer equals
        the issued one, verifies the assertion under the account's registered
        credential and stores it as the version's publication. The controller
        holds no workflow-signing key. A publication is re-verified at every
        evaluation and start, applies no maximum age, and stops verifying when the
        version changes or moves tenant, or when the signer's credential, account
        or workflow:publish permission is gone. A ceremony is single use. Audit
        action workflow.publish.
      operationId: finishWorkflowPublish
      tags:
        - Workflows
      parameters:
        - $ref: '#/components/parameters/workflowPublishId'
        - $ref: '#/components/parameters/workflowPublishVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The WebAuthn PublicKeyCredential assertion
      responses:
        '200':
          description: Version published
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        name: {type: string}
                        version: {type: string}
                        content_hash: {type: string}
                        signer_account_id: {type: string}
                        signed_at: {type: string, format: date-time}
                    timestamp:
                      type: string
                      format: date-time
        '400':
          description: NO_ACTIVE_PUBLISH_SESSION, SESSION_EXPIRED or WEBAUTHN_VERIFY_ERROR
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: VERSION_CHANGED or INVALID_ENVELOPE
        '429':
          description: THROTTLED

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Credential/session bearer transport where accepted by the route; not an operator-proof bypass.
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-cfgms_session
      description: Browser session; unsafe requests also need the current session CSRF contract.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication via X-API-Key header
    AutomationGrantAuth:
      type: http
      scheme: bearer
      bearerFormat: cfgag_<id>_<secret>
      description: >-
        Automation grant credential (ADR-036). Accepted only as Authorization Bearer and only on
        the /automation/runs routes; a grant is refused on every other route. Sending X-API-Key as
        well is 400 CONFLICTING_CREDENTIALS.

  parameters:
    automationRunId:
      name: run_id
      in: path
      required: true
      description: Automation run ID returned by begin
      schema:
        type: string
    libraryKind:
      name: kind
      in: path
      required: true
      description: Library kind
      schema:
        type: string
        enum: [script, workflow]
    workflowPublishId:
      name: id
      in: path
      required: true
      description: Workflow name
      schema:
        type: string
    workflowPublishVersion:
      name: version
      in: path
      required: true
      description: Semantic version of the stored workflow version
      schema:
        type: string
    stewardId:
      name: stewardId
      in: path
      required: true
      description: Unique identifier of the steward
      schema:
        type: string

  schemas:
    Marker:
      type: object
      required: [time, kind, revision, principal, resource]
      properties:
        id:
          type: string
          description: Marker id; present on the create response
        time:
          type: string
          format: date-time
        kind:
          type: string
          description: Marker kind, the audit action without its `marker_` prefix, or `controller_start`
        revision:
          type: string
          description: Build revision; empty on a `controller_start` row recorded before revisions were added
        principal:
          type: string
        resource:
          type: string
          description: Marker or rollout id
        note:
          type: string

    BillingMetrics:
      type: object
      properties:
        endpoints_online: {type: integer, minimum: 0, description: Stewards with status active}
        endpoints_offline: {type: integer, minimum: 0, description: Stewards with status lost}
        endpoints_pending: {type: integer, minimum: 0, description: Stewards with status registered}
        endpoints_by_platform:
          type: object
          properties:
            windows: {type: integer}
            linux: {type: integer}
            darwin: {type: integer}
            other: {type: integer}
        endpoints_by_version:
          type: object
          additionalProperties: {type: integer}
    BillingOwnCounts:
      type: object
      description: Counts attached to the MSP itself rather than to a client.
      properties:
        tech_count: {type: integer, minimum: 0}
        endpoint_count: {type: integer, minimum: 0}
    RootBillingMSP:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        tech_count: {type: integer, minimum: 0}
        endpoint_count: {type: integer, minimum: 0}
        client_count: {type: integer, minimum: 0}
        metrics: {$ref: '#/components/schemas/BillingMetrics'}
        msp_own: {$ref: '#/components/schemas/BillingOwnCounts'}
        clients:
          type: array
          items:
            type: object
            description: A client under an opaque label. Carries no name or tenant ID.
            properties:
              label: {type: string}
              endpoint_count: {type: integer, minimum: 0}
              tech_count: {type: integer, minimum: 0}
    TenantBillingReport:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        tech_count: {type: integer, minimum: 0}
        endpoint_count: {type: integer, minimum: 0}
        client_count: {type: integer, minimum: 0}
        metrics: {$ref: '#/components/schemas/BillingMetrics'}
        msp_own: {$ref: '#/components/schemas/BillingOwnCounts'}
        clients:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              endpoint_count: {type: integer, minimum: 0}
              tech_count: {type: integer, minimum: 0}
    StewardActionRequest:
      type: object
      required: [action, justification, nonce, expires_at, targets]
      description: >-
        nonce, expires_at and targets are copied from the sign/begin envelope.
        Exactly one of signature (X.509) or webauthn is the sign/finish proof.
        The action content is rebuilt by the server from this body, never from
        client-supplied bytes.
      properties:
        action:
          type: string
          enum: [start, stop, restart, end, suspend, resume]
        justification:
          type: string
          maxLength: 1024
        image:
          type: string
          description: Process image name (process actions only)
        nonce:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Not past, and no more than 5 minutes ahead
        targets:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
          description: Exactly the steward id in the path
        signature:
          type: object
          properties:
            algorithm:
              type: string
            value:
              type: string
            public_key:
              type: string
        webauthn:
          type: object
          properties:
            authenticator_data:
              type: string
              format: byte
            client_data_json:
              type: string
              format: byte
            signature:
              type: string
              format: byte
            credential_id:
              type: string
              format: byte
    WebAuthnCredentialInfo:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        transport:
          type: array
          items:
            type: string
        registered_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        device_type:
          type: string
          enum: [platform, security_key, phone_or_other, unknown]
          description: Transport heuristic; attachment and AAGUID are not stored.
        synced:
          type: boolean
          description: Stored backup-state (BS) flag.
        sync_capable:
          type: boolean
          description: Stored backup-eligible (BE) flag.
        current:
          type: boolean
          description: True for the credential that last proved the caller's web session; false for non-web callers.
    WorkflowApproval:
      type: object
      properties:
        approval_id:
          type: string
        workflow_name:
          type: string
        execution_id:
          type: string
        step_id:
          type: string
        step_name:
          type: string
        message:
          type: string
        approver_permission:
          type: string
        requested_by:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
        justification:
          type: string

    RegistrationToken:
      type: object
      properties:
        token_id:
          type: string
          description: Stable UUID, safe to expose
        token:
          type: string
          description: Full secret — returned by create and rotate only
        token_prefix:
          type: string
        tenant_id:
          type: string
        controller_url:
          type: string
        group:
          type: string
        label:
          type: string
          description: Operator-written free text given at mint time; omitted when empty
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
    AlertState:
      type: object
      properties:
        alert_id:
          type: string
        acknowledged:
          type: boolean
        acknowledged_by:
          type: string
        acknowledged_at:
          type: string
          format: date-time
        silenced:
          type: boolean
        silenced_by:
          type: string
        silenced_until:
          type: string
          format: date-time
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
            message:
              type: string
              description: Human-readable error message
        timestamp:
          type: string
          format: date-time

    AutomationApprovalMode:
      type: string
      enum: [signed, approve, comment]
      description: >-
        signed (default): a signature from a trusted key of the owner tenant, falling back to approve
        when the version is unsigned or the owner trusts no keys. approve: an approval bound to the
        approval hash. comment: the declaration alone. The declaration (header comment or
        preapproved_for_automation) is required in every mode.
    AutomationGrant:
      type: object
      properties:
        id: {type: string}
        tenant_id: {type: string}
        name: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revoked_by: {type: string}
    AutomationGrantCreateRequest:
      type: object
      required: [name, expires_at]
      properties:
        name: {type: string}
        tenant_id:
          type: string
          description: Defaults to the caller's tenant; required for a root-scoped caller
        expires_at:
          type: string
          format: date-time
          description: In the future and at most 90 days ahead
    AutomationGrantCreated:
      type: object
      properties:
        grant:
          $ref: '#/components/schemas/AutomationGrant'
        credential:
          type: string
          description: cfgag_<id>_<secret>, returned once
    AutomationGrantRevoked:
      type: object
      properties:
        grant:
          $ref: '#/components/schemas/AutomationGrant'
        runs_ended: {type: integer}
    AutomationRunBeginRequest:
      type: object
      required: [tenant_id, event_ref, event_source]
      properties:
        tenant_id:
          type: string
          description: The grant tenant or a descendant of it
        event_ref:
          type: string
          maxLength: 128
          description: 'Starts with a letter or digit; A-Z a-z 0-9 . _ : / # - only'
        event_source:
          type: string
          maxLength: 128
    AutomationRun:
      type: object
      properties:
        run_id: {type: string}
        tenant_id: {type: string}
        event_ref: {type: string}
        event_source: {type: string}
        expires_at: {type: string, format: date-time}
        ended: {type: boolean}
    AutomationScriptEntry:
      type: object
      properties:
        script_id: {type: string}
        name: {type: string}
        version: {type: string}
        owner_tenant: {type: string}
        state:
          type: string
          enum: [approved, pending, denied]
        reason: {type: string}
        approval_hash: {type: string}
    AutomationScriptRunRequest:
      type: object
      required: [script_id]
      properties:
        target:
          type: string
          description: Fleet selector; empty or all means every device of the run tenant
        script_id: {type: string}
        version:
          type: string
          description: Optional; when empty the latest is resolved once and pinned
        params:
          type: object
          description: Literal string values for declared parameters only
          additionalProperties:
            type: string
    AutomationScriptRun:
      type: object
      properties:
        run_id:
          type: string
          description: The result run, readable under /automation/runs/{run_id}/results/{run_id}
        tenant_id: {type: string}
        owner_tenant: {type: string}
        script_id: {type: string}
        version: {type: string}
        approval_hash: {type: string}
        device_count: {type: integer}
    AutomationWorkflowRunRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Exact semantic version; there is no latest
        inputs:
          type: object
          description: Values for the workflow's declared inputs (at most 64, each at most 4096 encoded bytes)
          additionalProperties: true
    AutomationWorkflowRun:
      type: object
      properties:
        execution_id: {type: string}
        tenant_id: {type: string}
        owner_tenant: {type: string}
        workflow_name: {type: string}
        version: {type: string}
        approval_hash: {type: string}
        status: {type: string}
    AutomationApprovalEntry:
      type: object
      properties:
        script_id: {type: string}
        workflow_id: {type: string}
        version: {type: string}
        content_hash: {type: string}
        approval_hash: {type: string}
        state:
          type: string
          enum: [approved, pending]
        reason:
          type: string
          description: Present on workflow entries
        approval:
          type: object
          properties:
            approved_by: {type: string}
            approved_at: {type: string}
            method:
              type: string
              enum: [approve-tap, signature, workflow-publish]
    AutomationLibraryMode:
      type: object
      properties:
        kind:
          type: string
          enum: [script, workflow]
        mode:
          $ref: '#/components/schemas/AutomationApprovalMode'
    UnattendedRolloutSetting:
      type: object
      properties:
        enabled:
          type: boolean
        changed_by:
          type: string
        changed_at:
          type: string
          format: date-time
          nullable: true
    StewardInfo:
