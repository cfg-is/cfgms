          additionalProperties: true
        fragments:
          type: array
          items:
            type: object
            additionalProperties: true
            nullable: true
        collected_at:
          type: string
          format: date-time
          nullable: true
    ConfigInfo:
      type: object
      properties:
        steward_id:
          type: string
        version:
          type: string
        config:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
    EffectiveConfig:
      type: object
      properties:
        steward_id:
          type: string
        tenant_id:
          type: string
        config:
          type: object
          additionalProperties: true
