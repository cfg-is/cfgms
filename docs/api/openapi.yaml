        active_sessions:
          type: integer
        connection_state:
          type: string
        key_protection_level:
          type: string
        key_algorithm:
          type: string
        health_reasons:
          type: array
          items:
            type: object
            additionalProperties: true
        tamper_codes:
          type: array
          items:
            type: string
    DNAInfo:
