openapi: 3.0.3
info:
  title: CFGMS REST API
  description: |
    Configuration Management System REST API for managing stewards, configurations,
    certificates, and role-based access control.
  version: 1.0.0
  contact:
    name: CFGMS Support
    url: https://github.com/cfg-is/cfgms
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:9080/api/v1
    description: Development server
  - url: https://{hostname}:9080/api/v1
    description: Production server
    variables:
      hostname:
        default: cfgms.local
        description: CFGMS controller hostname

security:
  - ApiKeyAuth: []

paths:
  /registration/pending:
    get:
      summary: List pending registrations
      description: |
        Devices quarantined at registration and awaiting approval. Tenant-scoped
        callers see only their own tenant; unscoped callers see all tenants.
        Requires the `registration:list-pending` permission.
      operationId: listPendingRegistrations
      tags:
        - Registration
      responses:
        '200':
          description: Pending registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pending_id:
                      type: string
                    steward_id:
                      type: string
                    tenant_id:
                      type: string
                    source_ip:
                      type: string
                    hostname:
                      type: string
                      description: Self-reported by the device, unauthenticated; sanitised on write. Omitted for older entries.
                    key_fingerprint:
                      type: string
                      description: Lowercase hex SHA-256 of the CSR public key (DER SubjectPublicKeyInfo), computed by the controller. Omitted for older entries.
                    registered_at:
                      type: string
                      format: date-time
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API server
      operationId: getHealth
      security: []  # No authentication required
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                data:
                  status: healthy
                  service: cfgms-api
                  version: "0.2.0"
                timestamp: "2025-07-27T16:00:00Z"

  /stewards:
    get:
      summary: List all stewards
      description: Returns a list of all registered stewards in the system
      operationId: listStewards
      tags:
        - Stewards
      responses:
        '200':
          description: List of stewards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StewardInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stewards/{stewardId}:
    get:
      summary: Get steward details
      description: Returns detailed information about a specific steward
      operationId: getSteward
      tags:
        - Stewards
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Steward details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StewardInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stewards/{stewardId}/dna:
    get:
      summary: Get steward DNA information
      description: Returns the DNA (system fingerprint) information for a steward
      operationId: getStewardDNA
      tags:
        - Stewards
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Steward DNA information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DNAInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stewards/{stewardId}/config:
    get:
      summary: Get steward configuration
      description: >-
        Returns the current configuration for a steward. Tenant scope: a
        scoped caller may read only a steward within its own tenant subtree;
        an out-of-subtree or unknown steward returns 404. Root/unscoped
        callers may read any steward.
      operationId: getStewardConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Steward configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConfigInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update steward configuration
      description: >-
        Stores configuration for a steward and triggers delivery. Tenant
        scope: a scoped caller may write configuration only for a steward
        within its own tenant subtree; an out-of-subtree or unknown steward
        is rejected with 404 STEWARD_NOT_FOUND (not 403, to avoid disclosing
        that the steward exists in another tenant). Root/unscoped callers
        retain authority across tenants, subject to the ADR-025 root/MSP
        tenant-crossing-boundary check for principals that are subject to it.
      operationId: updateStewardConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Configuration stored, with a trackable delivery record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      steward_id:
                        type: string
                      tenant_id:
                        type: string
                      message:
                        type: string
                      command_id:
                        type: string
                        description: >-
                          Present when a durable delivery record was created;
                          absent if no command store is configured.
                      delivery_status:
                        type: string
                        enum: [pending, delivered]
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: A required module is not cached and approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REQUIRED_MODULE_NOT_APPROVED
                  message: required module not approved
                timestamp: "2025-07-27T16:00:00Z"
        '500':
          description: Configuration could not be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: STORAGE_ERROR
                  message: Failed to store configuration
                timestamp: "2025-07-27T16:00:00Z"

  /stewards/{stewardId}/config/effective:
    get:
      summary: Get effective configuration with inheritance
      description: >-
        Returns the effective configuration after applying inheritance
        hierarchy. Tenant scope: resolved against the steward's own tenant
        when known to the controller's registry; a caller whose tenant
        differs from the steward's owning tenant is rejected (mapped to 500,
        since this check does not distinguish the case from a genuine
        resolution failure).
      operationId: getEffectiveConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      responses:
        '200':
          description: Effective configuration with source tracking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EffectiveConfig'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /stewards/{stewardId}/config/validate:
    post:
      summary: Validate configuration
      description: >-
        Validates a configuration without applying it. Tenant scope: a
        scoped caller may validate only a steward within its own tenant
        subtree; an out-of-subtree or unknown steward returns 404.
        Root/unscoped callers may validate for any steward.
      operationId: validateConfig
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/stewardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /certificates:
    get:
      summary: List certificates
      description: >-
        Returns certificates within the caller's tenant scope: a scoped
        caller sees only certificates whose owning steward is in its own
        tenant subtree (plus certificates with no owning steward). If the
        subtree cannot be evaluated the request fails closed with 503 rather
        than returning an unfiltered list. Root/unscoped callers see every
        certificate.
      operationId: listCertificates
      tags:
        - Certificates
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CertificateInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /certificates/provision:
    post:
      summary: Provision new certificate
      description: Provisions a new certificate for a subject
      operationId: provisionCertificate
      tags:
        - Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
      responses:
        '200':
          description: Certificate provisioned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CertificateResponse'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /certificates/{serial}/revoke:
    post:
      summary: Revoke certificate
      description: Revokes a certificate by serial number
      operationId: revokeCertificate
      tags:
        - Certificates
      parameters:
        - name: serial
          in: path
          required: true
          description: Certificate serial number
          schema:
            type: string
      responses:
        '200':
          description: Certificate revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbac/permissions:
    get:
      summary: List permissions
      description: Returns all available permissions in the system
      operationId: listPermissions
      tags:
        - RBAC
      responses:
        '200':
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rbac/roles:
    get:
      summary: List roles
      description: Returns all roles in the system
      operationId: listRoles
      tags:
        - RBAC
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create role
      description: Creates a new role
      operationId: createRole
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rbac/check:
    post:
      summary: Check permission
      description: Checks if a subject has a specific permission
      operationId: checkPermission
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCheckRequest'
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-keys:
    get:
      summary: List API keys
      description: >-
        Returns API keys belonging to the caller's own tenant — an exact
        tenant match, not a subtree. A request with no resolved tenant is
        rejected with 401.
      operationId: listAPIKeys
      tags:
        - API Keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create API key
      description: Creates a new API key
      operationId: createAPIKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
      responses:
        '200':
          description: API key created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyResponse'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-keys/{keyId}:
    get:
      summary: Get API key details
      description: Returns details about a specific API key
      operationId: getAPIKey
      tags:
        - API Keys
      parameters:
        - name: keyId
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyInfo'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete API key
      description: Deletes an API key
      operationId: deleteAPIKey
      tags:
        - API Keys
      parameters:
        - name: keyId
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      responses:
        '200':
          description: API key deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitoring/health:
    get:
      summary: Get system health overview
      description: Returns comprehensive health status of all system components
      operationId: getSystemHealth
      tags:
        - Monitoring
      responses:
        '200':
          description: System health overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SystemHealth'
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /monitoring/metrics:
    get:
      summary: Get performance metrics
      description: Returns current performance metrics from the dedicated private metrics listener. The public product listener returns 404 for this path.
      operationId: getMetrics
      tags:
        - Monitoring
      servers:
        - url: https://localhost:9090/api/v1
          description: Private metrics listener; replace localhost only with an explicitly configured private address
      responses:
        '200':
          description: Performance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/{alertId}/unsilence:
    post:
      summary: Unsilence an alert
      description: |
        Reverses a silence, clearing the silence flag, its expiry and the silencing
        principal. Requires `alert:unsilence` at Strong assurance (same gate as silence).
        Idempotent: unsilencing an alert that is not silenced returns its current state.
      operationId: unsilenceAlert
      tags:
        - Alerts
      parameters:
        - name: alertId
          in: path
          required: true
          description: Alert identifier
          schema:
            type: string
      responses:
        '200':
          description: Updated alert state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Alert store not configured

  /tenants/{id}/access-grants/{crossingId}:
    delete:
      summary: End an active tenant crossing
      description: |
        Revokes an active grant or break-glass crossing so it stops granting access
        immediately. Requires `tenant:crossing-end` at Strong assurance. A grant is ended
        by an administrator of the granting tenant (root-scoped callers get `403`); a
        break-glass crossing is ended by the root principal that invoked it or by an
        administrator of the owning tenant. A crossing that does not belong to `{id}` is
        `404`. Idempotent: an already revoked or expired crossing returns its current state.
      operationId: endTenantCrossing
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant that owns the crossing
          schema:
            type: string
        - name: crossingId
          in: path
          required: true
          description: Crossing identifier
          schema:
            type: string
      responses:
        '200':
          description: Crossing state after the call
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller may not end this crossing
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Tenant crossing store not configured
  /reports/dashboard/alerts:
    get:
      summary: Dashboard alert feed
      description: |
        Drift-derived alerts with acknowledgement and silence state. Actively silenced
        alerts are excluded unless `include_silenced=true`.
      operationId: getDashboardAlerts
      tags:
        - Alerts
      parameters:
        - name: severity
          in: query
          required: false
          description: Comma-separated severity filter (critical, warning, info). Defaults to warning,critical.
          schema:
            type: string
        - name: include_silenced
          in: query
          required: false
          description: When true, include alerts whose silence window is still open (with silenced true).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Alert feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        timestamp:
                          type: string
                        device_id:
                          type: string
                        severity:
                          type: string
                        description:
                          type: string
                        acknowledged:
                          type: boolean
                        silenced:
                          type: boolean
                        acknowledged_by:
                          type: string
                          description: Present only when known
                        silenced_by:
                          type: string
                          description: Present only when known
                  total_alerts:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /compliance/tenants/{tenantId}/devices:
    get:
      summary: List a tenant's devices with compliance status
      description: |
        Returns a page of one tenant's devices with their drift-based compliance
        status (the same buckets as the compliance summary). Devices are sorted by
        steward ID. A tenant outside the caller's scope returns 404 without
        disclosing whether it exists. Requires `compliance:read-summary`.
      operationId: getTenantComplianceDevices
      tags:
        - Compliance
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Page of the tenant's devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        steward_id:
                          type: string
                        hostname:
                          type: string
                        status:
                          type: string
                          enum: [compliant, warning, critical]
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset
        '404':
          description: Tenant not found or outside the caller's scope
        '503':
          description: Compliance data provider unavailable

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication via X-API-Key header

  parameters:
    stewardId:
      name: stewardId
      in: path
      required: true
      description: Unique identifier of the steward
      schema:
        type: string

  schemas:
    AlertState:
      type: object
      properties:
        alert_id:
          type: string
        acknowledged:
          type: boolean
        acknowledged_by:
          type: string
        acknowledged_at:
          type: string
          format: date-time
        silenced:
          type: boolean
        silenced_by:
          type: string
        silenced_until:
          type: string
          format: date-time
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
            message:
              type: string
              description: Human-readable error message
        timestamp:
          type: string
          format: date-time

    StewardInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique steward identifier
        status:
          type: string
          description: Current steward status
          enum: [online, offline, unknown]
        last_seen:
          type: string
          format: date-time
          description: Last time the steward was seen
        version:
          type: string
          description: Steward software version
        connected_at:
          type: string
          format: date-time
          description: Connection timestamp
        metrics:
          type: object
          additionalProperties:
            type: string
          description: Steward performance metrics
        dna:
          $ref: '#/components/schemas/DNAInfo'

    DNAInfo:
      type: object
      properties:
        hostname:
          type: string
          description: Steward hostname
        os:
          type: string
          description: Operating system
        architecture:
          type: string
          description: System architecture
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Additional DNA attributes

    ConfigInfo:
      type: object
      properties:
        version:
          type: string
          description: Configuration version
        modules:
          type: object
          additionalProperties:
            type: object
          description: Module-specific configurations

    EffectiveConfig:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConfigValue'

    ConfigValue:
      type: object
      properties:
        value:
          description: The configuration value
        source:
          type: string
          description: Which level provided this value
          enum: [msp, client, group, device]
        level:
          type: integer
          description: Hierarchy level (0=msp, 1=client, 2=group, 3=device)

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    CertificateInfo:
      type: object
      properties:
        serial:
          type: string
        subject:
          type: string
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        revoked:
          type: boolean

    CertificateRequest:
      type: object
      required:
        - subject_type
        - subject_id
      properties:
        subject_type:
          type: string
          enum: [steward, user]
        subject_id:
          type: string
        validity_days:
          type: integer
          default: 365
          maximum: 825
          description: >-
            A request exceeding the maximum is refused with 400 Bad Request
            (VALIDITY_DAYS_EXCEEDS_MAXIMUM), never silently clamped.

    CertificateResponse:
      type: object
      properties:
        certificate:
          type: string
          description: PEM-encoded certificate
        private_key:
          type: string
          description: PEM-encoded private key
        ca_certificate:
          type: string
          description: PEM-encoded CA certificate

    Permission:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        resource:
          type: string
        action:
          type: string

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        tenant_id:
          type: string

    RoleRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        tenant_id:
          type: string

    PermissionCheckRequest:
      type: object
      required:
        - subject
        - resource
        - action
      properties:
        subject:
          type: string
        resource:
          type: string
        action:
          type: string
        tenant_id:
          type: string

    APIKeyInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string

    APIKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        permissions:
          type: array
          items:
            type: string

    APIKeyResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
          description: The actual API key (only shown once)
        name:
          type: string
        expires_at:
          type: string
          format: date-time

    SystemHealth:
      type: object
      properties:
        overall_status:
          type: string
          enum: [healthy, degraded, unhealthy]
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [healthy, degraded, unhealthy]
              message:
                type: string
        uptime_seconds:
          type: integer
        version:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_REQUEST
              message: The request was invalid
            timestamp: "2025-07-27T16:00:00Z"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
            timestamp: "2025-07-27T16:00:00Z"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Insufficient permissions
            timestamp: "2025-07-27T16:00:00Z"

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
            timestamp: "2025-07-27T16:00:00Z"

    NotImplemented:
      description: Not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_IMPLEMENTED
              message: This feature is not yet implemented
            timestamp: "2025-07-27T16:00:00Z"
