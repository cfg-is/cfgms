file: visibility-surfaces.html
order: 14
status: **Reference**
what: **Visibility surfaces** (Epic #2860) — the aggregate read surfaces the controller computes but never showed. One file, four screens behind a **Surface** switcher: **Reports** (hero score, KPI stat tiles, drift-trend line chart with table view, key insights / recommended actions, report-template list + generate), **Compliance** (observed drift from DNA snapshot history — labelled for what it measures, not "convergence"; 5 stat tiles, per-tenant stacked drift mix, per-device detail with the honest empty-patches state), **Monitoring** (system health + component grid, dependencies, the always-empty anomalies state and the always-503 per-component state drawn as designed states, read-only config), and the **Alert center** (populated bell + popover, severity badges, acknowledge and step-up-gated silence, show-silenced toggle). Establishes the **validated** chart conventions: sequential ramp for magnitude, the reserved status scale for state (always icon + label — `--state-warn` and `--state-crit` measure ΔE 3.1 apart and must never be colour-alone neighbours), categorical capped at 4 series, 2px surface gaps and rings, table view on every chart. Ready / Loading / Error / Empty for every surface; both themes.
