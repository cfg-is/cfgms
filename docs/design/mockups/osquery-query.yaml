file: osquery-query.html
order: 18
status: **Reference**
what: **Fleet query** (Epic #5300 · #5460) — own nav entry / `/osquery` route. Pick a catalog query from `GET /api/v1/osquery/catalog` (no free-form query, no typed catalog id); parameter inputs are built from the entry's schema (enum → select, charset → text). Enter a fleet selector (the shared selector input + grammar hint) and run `POST /api/v1/osquery/query` behind a passkey presence tap. Results render one card per steward: a row table (cells as literal text, long values wrap, 5-row preview with Show all), a distinct **No rows** card and a terracotta **Error** card with the steward error as text; tally pills and All / With rows / No rows / Errors filters. Also first-visit, catalog loading, catalog error, passkey, passkey cancelled, running, rejected selector (400), tenant outside yours (403), unavailable (503), request error and no-stewards-matched states. Renders directly with its own **State / Theme** strip; both themes.
