<style>
  :root {
    --bg: #EFF2F7;

    --chrome-2: #F4F6FA;

    --text: #1A2230;
    --text-dim: #5C6678;
    --accent: #3B62E8;
    --accent-ink: #FFFFFF;
    --accent-weak: #E6ECFD;
    --shadow: 0 18px 50px -22px rgba(20,32,60,.45);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090C12;
      --chrome: #141922;
      --chrome-2: #1B212C;
      --border: #29323F;
      --text: #E7ECF3;
      --text-dim: #8593A5;
      --accent: #6188F6;
      --accent-ink: #0A0E15;
      --accent-weak: #1A2540;
      --shadow: 0 22px 60px -26px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="light"] {
    --bg: #EFF2F7; --chrome: #FFFFFF; --chrome-2: #F4F6FA; --border: #D8DFEA;
    --text: #1A2230; --text-dim: #5C6678; --accent: #3B62E8; --accent-ink: #FFFFFF;
    --accent-weak: #E6ECFD; --shadow: 0 18px 50px -22px rgba(20,32,60,.45);
  }
  :root[data-theme="dark"] {
    --bg: #090C12; --chrome: #141922; --chrome-2: #1B212C; --border: #29323F;
    --text: #E7ECF3; --text-dim: #8593A5; --accent: #6188F6; --accent-ink: #0A0E15;
    --accent-weak: #1A2540; --shadow: 0 22px 60px -26px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 16px;
    background: var(--chrome);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-right: auto;
  }
  .brand b {
    font-size: 15px;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .brand span {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .04em;
  }

  .seg {
    display: inline-flex;
    position: relative;
    background: var(--chrome-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
  }
  .seg button {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: color .18s ease;
  }
  .seg button[aria-pressed="true"] { color: var(--accent-ink); }
  .seg .thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    height: calc(100% - 6px);
    background: var(--accent);
    border-radius: 7px;
    transition: transform .22s cubic-bezier(.4,.9,.3,1), width .22s cubic-bezier(.4,.9,.3,1);
    z-index: 0;
  }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dims {
    font-family: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 22px 16px 40px;
    overflow: auto;
  }
  .frame-wrap {
    position: relative;
    margin: 0 auto;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    background: var(--chrome);
    transition: width .22s ease, height .22s ease;
  }
  .frame {
    display: block;
    border: 0;
    transform-origin: 0 0;
    background: transparent;
  }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.6;
    padding: 0 20px 30px;
    max-width: 520px;
    margin: 0 auto;
  }
  .hint kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    background: var(--chrome);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--text);
  }
</style>

  </div>`;

  function currentTheme() {
    const d = document.documentElement.getAttribute("data-theme");
    if (d) return d;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function srcdoc(theme) {
    return '<!doctype html><html lang="en" data-theme="' + theme + '"><head>' +
      '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>' + MOCK_CSS + '</style></head><body>' + MOCK_HTML + '</body></html>';
  }
  function layout() {
    const d = DEVICES[current];
    frame.style.width = d.w + "px";
    frame.style.height = d.h + "px";
    const avail = stage.clientWidth - 32;
    const scale = Math.min(1, avail / d.w);
    frame.style.transform = "scale(" + scale + ")";
    wrap.style.width = (d.w * scale) + "px";
    wrap.style.height = (d.h * scale) + "px";
    dims.textContent = d.w + " × " + d.h + " · " + Math.round(scale * 100) + "%";
  }
  function moveThumb() {
    const active = btns.find(b => b.dataset.dev === current);
    thumb.style.width = active.offsetWidth + "px";
    thumb.style.transform = "translateX(" + (active.offsetLeft - 3) + "px)";
  }
  function render() { frame.srcdoc = srcdoc(currentTheme()); layout(); }

  btns.forEach(b => b.addEventListener("click", () => {
    current = b.dataset.dev;
    btns.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    moveThumb();
    layout();
  }));

  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  window.addEventListener("resize", () => { layout(); moveThumb(); });
  window.addEventListener("orientationchange", () => setTimeout(() => { layout(); moveThumb(); }, 200));

  render();
  moveThumb();
</script>
