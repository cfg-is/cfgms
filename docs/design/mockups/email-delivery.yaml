status: **Reference**
what: MSP **Email delivery** page (Epic #6039 · #6247) — own nav entry below Support access / `/email-delivery` route. A **Sender** card shows the MSP's own sender (server, port · TLS, from, username, and a **Password saved** chip, never the value) or **No sender: using the platform sender**; **Replace** and **Remove** (inline confirm). The **Set / Replace sender** form: host, TLS mode with the port (587 / 465) following it, bare from address, optional username, and a write-only password (`new-password`, empty on load, "leave empty to keep the saved password", cleared after every save attempt); saving takes a passkey step-up. **Send a test** sends one fixed message to the sender's own from address and shows the recipient as Accepted / Not sent with the reason as literal text. A **What uses this sender** table. A root session gets the standard crossing prompt (401) and, with a crossing, a read-only view. Ready / No sender / Replace / First set / Validation error / Saved / Remove confirm / Test running / Delivered / Failed / Loading / Error / Crossing required (401) / Root with crossing (read-only) / Forbidden (403) / Passkey cancelled states; renders directly with its own **State / Theme** strip; both themes.
