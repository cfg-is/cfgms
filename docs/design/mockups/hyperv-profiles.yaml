file: hyperv-profiles.html
order: 21
status: **Reference**
what: **Hyper-V provisioning profiles** (Epic #5300 · #5461) — own nav entry / `/hyperv/profiles` route. List of profile names (`profile://<name>`) beside a detail pane: OS family, answer format, a **runs as root / SYSTEM** pill, an enrollment call-out (token secret key name, bundle URL, label — or "Enrollment: off") and the template shown as literal, line-numbered text with per-VM placeholders highlighted. Profiles cannot be edited. **Create** is two steps: **Write** (name, linux / windows, answer format filtered to the OS, template with live size against the 256 KB cap, enrollment fields), then **Review what runs as root** (the whole template, enrollment, every placeholder and secret reference listed, an "I read the whole template" check) before the passkey tap. Server validation errors return to Write with the code and message. **Delete** is an inline row confirm behind a passkey tap. Ready / Empty / Loading / Error / View / Create-edit / Create-review / Passkey / Validation error / Delete confirm states; renders directly with its own **State / Theme** strip; both themes.
