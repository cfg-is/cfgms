# CFGMS Controller — hardened single-node container configuration
#
# Replace every CHANGE value before initialization. This file is mounted
# read-only; all generated credentials and mutable state live on the dedicated
# /var/lib/cfgms volume.

security_profile: "public-beta"
execution:
  require_signed_adhoc: true

listen_addr: "0.0.0.0:9080"
# Dedicated metrics listener on the fixed private Compose bridge address.
# Compose publishes this port only on host loopback.
metrics_listen_addr: "172.30.0.10:9090"
external_url: "https://controller.example.com:9080"
data_dir: "/var/lib/cfgms"
admin_bundle_path: "/var/lib/cfgms/admin.bundle.yaml"
cert_path: "/var/lib/cfgms/certs"

certificate:
  enable_cert_management: true
  ca_path: "/var/lib/cfgms/certs/ca"
  renewal_threshold_days: 30
  server_cert_validity_days: 365
  client_cert_validity_days: 365
  server:
    common_name: "controller.example.com"
    dns_names:
      - "controller.example.com"
      - "localhost"
    ip_addresses:
      - "127.0.0.1"
    organization: "CHANGE-TO-YOUR-ORGANIZATION"

storage:
  flatfile_root: "/var/lib/cfgms/storage"
  sqlite_path: "/var/lib/cfgms/cfgms.db"

logging:
  level: "info"
  provider: "file"
  config:
    directory: "/var/log/cfgms"
    max_file_size: 10485760
    max_files: 5

transport:
  listen_addr: "0.0.0.0:4433"
  external_address: "controller.example.com"
  use_cert_manager: true
  max_connections: 50000
  keepalive_period: "30s"
  idle_timeout: "5m"
