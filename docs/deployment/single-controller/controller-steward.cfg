# This is the steward boot config for the steward that manages the controller node itself
# (a pattern used in the single-controller walkthrough). It is NOT a generic steward boot
# config — see docs/deployment/steward.cfg for that.
#
# CFGMS Controller-Steward Configuration
#
# This is the steward that manages the controller node itself. It ensures
# directories, packages, firewall rules, and the systemd service stay in
# the desired state. If anything drifts, the steward converges it back.
#
# Copy this file to /etc/cfgms/controller-steward.cfg on your controller node.
#
# Before running, open this file and verify the variables marked with
# CHANGE below. These MUST match the values you set in controller.cfg:
#
#   controller.example.com  — your controller's hostname or IP
#   9080                    — REST API port (default, override via CFGMS_HTTP_LISTEN_ADDR)
#   4433                    — transport port (must match transport.listen_addr in controller.cfg)
#   My Organization         — your organization name

steward:
  id: "controller-node"
  mode: "standalone"
  logging:
    level: "info"

resources:
  # ── Service identity ─────────────────────────────────────────

  - name: "cfgms-service-account"
    module: "script"
    config:
      interpreter: "/bin/bash"
      content: |
        #!/bin/bash
        set -euo pipefail
        if ! id cfgms >/dev/null 2>&1; then
          useradd --system --no-create-home --shell /usr/sbin/nologin cfgms
        fi
      timeout: "30s"

  # ── Directories ──────────────────────────────────────────────

  - name: "cfgms-config-dir"
    module: "directory"
    config:
      path: "/etc/cfgms"
      owner: "cfgms"
      group: "cfgms"
      permissions: 750

  - name: "cfgms-data-dir"
    module: "directory"
    config:
      path: "/var/lib/cfgms"
      owner: "cfgms"
      group: "cfgms"
      permissions: 750

  - name: "cfgms-ca-dir"
    module: "directory"
    config:
      path: "/var/lib/cfgms/certs/ca"
      owner: "cfgms"
      group: "cfgms"
      permissions: 700

  - name: "cfgms-cert-dir"
    module: "directory"
    config:
      path: "/var/lib/cfgms/certs"
      owner: "cfgms"
      group: "cfgms"
      permissions: 750

  - name: "cfgms-log-dir"
    module: "directory"
    config:
      path: "/var/log/cfgms"
      owner: "cfgms"
      group: "cfgms"
      permissions: 750

  - name: "cfgms-storage-dir"
    module: "directory"
    config:
      path: "/var/lib/cfgms/storage"
      owner: "cfgms"
      group: "cfgms"
      permissions: 750

  # ── Prerequisites ────────────────────────────────────────────

  - name: "install-git"
    module: "package"
    config:
      packages:
        - name: "git"
          state: "installed"
        - name: "openssl"
          state: "installed"

  - name: "cfgms-secrets-key"
    module: "script"
    config:
      interpreter: "/bin/bash"
      content: |
        #!/bin/bash
        # Generate the secret-encryption key and seal it to this host's TPM2 in a
        # single pipeline: the plaintext exists only inside the pipe, so no
        # cleartext key is ever written to disk (ADR-030). The unit below loads
        # the sealed blob with LoadCredentialEncrypted=.
        set -euo pipefail
        if [ ! -f /etc/cfgms/secrets.key.cred ]; then
          # CHANGE if this host has no TPM2: --with-key=host seals to
          # /var/lib/systemd/credential.secret on this host's own disk, so a
          # stolen disk image yields the plaintext. Never use --with-key=auto —
          # it downgrades to the host key silently.
          if ! systemd-analyze has-tpm2 -q >/dev/null 2>&1; then
            echo "no usable TPM2 on this host; refusing to seal the key to disk silently." >&2
            echo "  Set --with-key=host here deliberately if that is acceptable." >&2
            exit 1
          fi
          umask 077
          openssl rand 32 | systemd-creds encrypt \
            --name=cfgms-secrets-key --with-key=tpm2 - /etc/cfgms/secrets.key.cred
        fi
        chown root:root /etc/cfgms/secrets.key.cred
        chmod 0400 /etc/cfgms/secrets.key.cred
      timeout: "30s"

  # ── Controller configuration ─────────────────────────────────
  # This writes /etc/cfgms/controller.cfg from the steward.
  # CHANGE: Update all values below to match your environment.

  - name: "controller-config"
    module: "file"
    config:
      path: "/etc/cfgms/controller.cfg"
      owner: "root"
      group: "cfgms"
      permissions: 640
      content: |
        security_profile: "public-beta"
        execution:
          require_signed_adhoc: true

        listen_addr: "0.0.0.0:9080"
        metrics_listen_addr: "127.0.0.1:9090"
        data_dir: "/var/lib/cfgms"
        cert_path: "/var/lib/cfgms/certs"

        certificate:
          enable_cert_management: true
          ca_path: "/var/lib/cfgms/certs/ca"
          renewal_threshold_days: 30
          server_cert_validity_days: 365
          client_cert_validity_days: 365
          server:
            # CHANGE: Your controller's hostname or IP address.
            common_name: "controller.example.com"
            # CHANGE: All hostnames/domains the controller is reachable at.
            dns_names:
              - "controller.example.com"
              - "localhost"
            # CHANGE: All IP addresses the controller is reachable at.
            ip_addresses:
              - "127.0.0.1"
            # CHANGE: Your organization name.
            organization: "My Organization"

        storage:
          flatfile_root: "/var/lib/cfgms/storage"
          sqlite_path: "/var/lib/cfgms/cfgms.db"

        logging:
          level: "info"
          provider: "file"
          config:
            directory: "/var/log/cfgms"
            max_file_size: 10485760
            max_files: 5

        transport:
          listen_addr: "0.0.0.0:4433"
          use_cert_manager: true
          max_connections: 50000
          keepalive_period: "30s"
          idle_timeout: "5m"

  # ── Firewall ─────────────────────────────────────────────────
  # CHANGE: Ports must match the REST API and transport ports above.

  - name: "controller-rest-port"
    module: "firewall"
    config:
      rules:
        - name: "allow-cfgms-rest"
          port: 9080
          protocol: "tcp"
          action: "allow"
          source: "0.0.0.0/0"

  - name: "controller-transport-port"
    module: "firewall"
    config:
      rules:
        - name: "allow-cfgms-transport"
          port: 4433
          protocol: "udp"
          action: "allow"
          source: "0.0.0.0/0"

  # ── Systemd service ──────────────────────────────────────────

  - name: "controller-systemd-unit"
    module: "file"
    config:
      path: "/etc/systemd/system/cfgms-controller.service"
      owner: "root"
      group: "root"
      permissions: 644
      content: |
        [Unit]
        Description=CFGMS Controller
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=simple
        ExecStart=/usr/local/bin/cfgms-controller --config /etc/cfgms/controller.cfg
        LoadCredentialEncrypted=cfgms-secrets-key:/etc/cfgms/secrets.key.cred
        Environment=CFGMS_SECRETS_KEY_FILE=%d/cfgms-secrets-key
        Environment=CFGMS_SECURITY_PROFILE=public-beta
        Environment=CFGMS_EXECUTION_REQUIRE_SIGNED_ADHOC=true
        Restart=on-failure
        RestartSec=5
        User=cfgms
        Group=cfgms
        WorkingDirectory=/var/lib/cfgms
        UMask=0077
        ConfigurationDirectory=cfgms
        ConfigurationDirectoryMode=0750
        StateDirectory=cfgms
        StateDirectoryMode=0750
        LogsDirectory=cfgms
        LogsDirectoryMode=0750
        RuntimeDirectory=cfgms
        RuntimeDirectoryMode=0750
        NoNewPrivileges=true
        PrivateTmp=true
        PrivateDevices=true
        ProtectSystem=strict
        ProtectHome=true
        InaccessiblePaths=/etc/cfgms/secrets.key.cred
        ProtectHostname=true
        ProtectClock=true
        ProtectKernelTunables=true
        ProtectKernelModules=true
        ProtectKernelLogs=true
        ProtectControlGroups=true
        ProtectProc=invisible
        ProcSubset=pid
        ReadWritePaths=/var/lib/cfgms /var/log/cfgms
        CapabilityBoundingSet=
        AmbientCapabilities=
        RestrictSUIDSGID=true
        RestrictNamespaces=true
        RestrictRealtime=true
        LockPersonality=true
        MemoryDenyWriteExecute=true
        RemoveIPC=true
        KeyringMode=private
        PrivateMounts=true
        SystemCallArchitectures=native
        SystemCallFilter=@system-service
        SystemCallErrorNumber=EPERM
        RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
        LimitNOFILE=65536
        TasksMax=512
        StandardOutput=journal
        StandardError=journal
        SyslogIdentifier=cfgms-controller

        [Install]
        WantedBy=multi-user.target

  # ── Start controller (only after initialization) ─────────────

  - name: "enable-controller-service"
    module: "script"
    config:
      interpreter: "/bin/bash"
      content: |
        #!/bin/bash
        # Only enable and start the controller if it has been initialized.
        # The .cfgms-initialized marker is created by: cfgms-controller --init
        if [ -f /var/lib/cfgms/certs/ca/.cfgms-initialized ]; then
          systemctl daemon-reload
          systemctl enable cfgms-controller
          if ! systemctl is-active --quiet cfgms-controller; then
            systemctl start cfgms-controller
          fi
        else
          echo "Controller not yet initialized."
          echo "Not yet initialized. --init runs outside systemd, so unseal the key onto"
          echo "tmpfs for the run and remove it afterwards — see the initialization step in"
          echo "docs/deployment/single-controller/walkthrough.md."
        fi
      timeout: "30s"
